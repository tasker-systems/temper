title    = "The CLI runs with its credential held outside the process under `TEMPER_AUTH=ambient`"
pr       = "self"
classes  = ["additive", "behavioral"]
surfaces = ["cli-stdout", "clients"]
status   = "signal-only"
body = '''
New, opt-in custody for hosts whose egress proxy attaches the credential in transit (a network
secret for the API host), so no token is ever in the session. With `TEMPER_AUTH=ambient` the CLI
sends requests without an `Authorization` header for the proxy to add, never reads or writes
`auth.json`, and mints no device id.
`temper auth status` gains an optional `credential: "ambient"` field (absent otherwise, so the
default shape is unchanged) and in that mode takes `authenticated` from the server's answer; a 401
names the ambient credential rather than `temper auth login`; `auth login` / `token` / `logout` /
`export-token` refuse. `TEMPER_AUTH=ambient` beside `TEMPER_TOKEN`, and any other `TEMPER_AUTH`
value, are configuration errors. One behavioral change
outside the mode: `auth status` now classifies a 401 that carries the API's error envelope as
`unauthenticated` rather than `error`. Who observes: CLI users and agents in cloud sessions;
nothing changes for anyone who does not set the variables. Rust callers of `temperkb-client`: an
`HttpClient::resolve_token` now returns `Option<String>`, and `ClientError` gains `AmbientRefused` (Rust-API breaks for the release notes: 0.x carries no Cargo semver promise); new `AmbientAuth`, `TemperClient::ambient`, `HttpClient::ambient` and `config::build_ambient_client_from`. Release
relevance: signal-only; no server or wire change.
'''
