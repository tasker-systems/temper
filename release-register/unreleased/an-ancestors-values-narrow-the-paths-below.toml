title    = "An ancestor's enum or const narrows the paths below it"
pr       = "self"
classes  = ["additive", "behavioral"]
surfaces = ["http", "mcp", "cli-stdout", "clients"]
status   = "signal-only"
body = '''
Correctness. Content at a path must satisfy the `enum` / `const` of every node above it, and the
schema walk reads it that way. Every `const` and `enum` member a shape declares is a scalar, which
holds nothing at any key, so below a node that declares values every path holds the empty set. In
`{"properties":{"m":{"const":"kg","properties":{"unit":{}}}}}` the path `m.unit` holds no value, and
an ask for `m.unit contains "lb"` is refused `value_outside_shape`: no conforming artifact can match
it. This holds whether the path below declares its own `enum` or `const`, an untyped `{}` or `true`.
A path's own `type` stands as declared. `compare` is decided by the declared types alone and
`has_key` reads no value set, so both are admitted there, as they are at any path.

What changes for a caller: a shape's vocabulary (`GET /api/shapes/{id}`'s `askable`, the MCP
`get_data_artifact_shape` tool, `temper data-artifact schema show`) lists an empty `values` at a path
below an ancestor that declares an `enum` or `const`, and a `value_outside_shape` refusal teaches it.
Only shapes that declare an `enum` or `const` above a declared `properties` key are affected. No
wire field is added: `PathFacts.values` changes only in its description text, in OpenAPI, ts-rs and
the three generated SDKs.

A path with no value-declaring ancestor lists the values it declares, once; a vocabulary holds no
more values than its schema declares. An element's values (`items`) are not narrowed. The size of
declared values is bounded at declare, by the scalar rule and the value budget of a shape's schema.
No migration.

Who observes: agents and CLIs asking at a path below a declared value, and readers of a shape's
vocabulary. Release relevance: signal-only.
'''
