title    = "Attaching, reparenting or restoring a team whose live subtree holds an auto-join or gating team is a system admin's act"
pr       = "self"
classes  = ["additive", "behavioral"]
surfaces = ["http", "mcp", "schema"]
status   = "signal-only"
body = '''
PW-1. Rule R6 says that bringing an auto-join team (every approved profile is on it) or the gating
team under a team hands that team's material to the whole instance, so it is a system admin's
act. Attach, reparent and restore checked this only for the child, or the restored team, itself.
A non-admin who managed both sides could attach a team whose child or grandchild was auto-join.
team_service now refuses such an act to a non-admin with 403 when any team in the child's live
subtree, or the restored team's, is auto-join, the root or the gating team. The check runs in
the pool pre-check and again under the row locks. A soft-deleted team below, and anything under
it, does not count, because reach does not pass through a dead team. Migration 20261119000020 adds
team_live_descendants(p_team), the live-only down-walk that mirrors team_ancestors.

Who observes: a non-admin team manager attaching, reparenting or restoring such a subtree now gets
403 where they got success. Admins are unaffected. Request and response shapes are unchanged.
Witnesses: `crates/temper-services/tests/team_subtree_pool_authority_test.rs`. Release relevance:
closes an authority gap; signal-only.
'''
