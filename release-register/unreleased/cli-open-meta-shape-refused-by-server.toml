title    = "A mis-shaped open-meta key on `resource create` or `resource update` is refused by the server, and the CLI relays its refusal"
pr       = "self"
classes  = ["behavioral"]
surfaces = ["cli-stdout"]
status   = "signal-only"
body = '''
Behavioral: the CLI no longer checks open-meta shape before sending (ruling R8: the server is the
only enforcing copy of request shaping). A recognized open-meta key carrying the wrong shape, on
`resource create --open-meta`, `resource update --open-meta` or `resource update --open-meta-add`,
now reaches the server, whose `validate_open_meta_shape` refuses it. Nothing is written, before or
after, and the exit code stays 1.

The stdout error payload changes. Before: code `bad-request`, message `invalid --open-meta shape:
/descriptor: 42 is not of type "string". Run ...`. After: code `api`, message `API error: server
error (400): Bad request: invalid open_meta shape: /descriptor: 42 is not of type "string". A
recognized open_meta key carries the wrong shape; run ...`, which is how the CLI renders every
untyped server 400. A caller branching on `bad-request` for this refusal now sees `api`.

Unchanged: `{"tags":null}` on update still deletes the key; the discouraged-key warning (a bare
`slug` or `title`) still prints on stderr; a null on create is still refused by the CLI. Observed by
CLI callers that send a mis-shaped recognized open-meta key. No HTTP, MCP-tool or schema change.
'''
