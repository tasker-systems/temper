title    = "The per-resource artifact list can be bounded: `limit`, with the next page named in a `Link` header"
pr       = "self"
classes  = ["additive"]
surfaces = ["http", "mcp", "cli-stdout", "clients", "schema", "internal"]
status   = "signal-only"
body = '''
`GET /api/resources/{id}/artifacts` gains optional `limit`, `after_created` and `after_id` query parameters and a documented `Link: <target>; rel="next"` response header on its 200, whose body stays the bare array with its schema unchanged; the header names this route with the caller's filters and the next page's position, and is absent on the last page and on every response without `limit` (a `limit` of 0 or above `MAX_ARTIFACT_PAGE_ROWS` is a 400, never clamped, and the unbounded no-`limit` form retires later under its own `shape-breaking` entry). Skew holds both ways: an old client sends no `limit` and gets the identical array, and a new `temper-client` against an old server gets every artifact with no `Link` and reads it as the final page, so `list_all` returns the complete set in one request, while a `Link` it cannot read is an error, never a silent last page. Behind it, migration `20261102000000` adds an 8-argument arity of `artifacts_for_resource` with no `DEFAULT`, leaving the 5-argument function untouched; `temper data-artifact list` and MCP `list_data_artifacts` drain the bounded list and answer as before. The web UI's resource page, which read every artifact on each view, now reads one page of 50 (folded ones still included) and, when the `Link` header says more exist, labels the count as this page's and links to the later page, with the position in the page's own URL; the vocabulary has no UI surface token, so `internal` stands for it. Release relevance: signal-only.
'''
