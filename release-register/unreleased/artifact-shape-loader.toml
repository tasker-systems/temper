title    = "A shape's by-id read carries `askable`; a schema over 256 KiB, or a pattern over 10 KiB compiled, is refused"
pr       = "self"
classes  = ["additive", "behavioral"]
surfaces = ["http", "mcp", "cli-stdout", "clients"]
status   = "signal-only"
body = '''
`ShapeView` gains two optional fields, filled only by the by-id read (`GET /api/shapes/{id}`, MCP
`get_data_artifact_shape`, `temper data-artifact schema show`, and the shape the declare routes
answer with). `askable` lists every path an artifact ask may name against that version of the
shape, each with its declared JSON types, its `enum`/`const` values and the operators feasible
there; it is bounded, and a cut vocabulary names the bound in `truncated`. When the version's
schema cannot be walked, `unaskable` says why with the refusal step 3 of asking gives it:
`shape_schema_uncompilable` with its fixed sentence for a schema that does not compile without a
fetch (`askable` empty), or with a sentence naming the bound and `teaches.beyond_bound:
schema_bytes` for a schema larger than 262,144 bytes of compact JSON, which is not compiled
(`askable` reads `truncated: ["schema_bytes"]`). The listing routes and tools leave both fields
absent, not empty. Older clients ignore the fields; `openapi.json`, the three SDKs and the ts-rs
types grow, and the MCP tool's description names the field.

Declaring a shape (`POST /api/contexts/{id}/shapes`, `POST /api/cognitive-maps/{id}/shapes`, MCP
`declare_data_artifact_shape`, `temper data-artifact schema declare`) measures the schema before
compiling it and refuses one larger than 262,144 bytes of compact JSON with the existing
data-artifact refusal (`400`, code `DATA_ARTIFACT_REFUSAL`, MCP `invalid_params`), carrying a
sentence that names the bound and no compiler text; no shape row is written. Schemas within the
bound declare as before. Shapes already stored above the bound are unchanged for commit and
reconcile.

Every compile of a shape schema holds the regex of each `pattern` to
10 KiB compiled (the engine's default is 10 MiB). A schema with such a regex past it does not
compile, at declare, commit and reconcile alike, and is treated as any uncompilable schema is:
declare refuses it with the existing fixed sentence, an `enforcing` commit is refused, an
`advisory` commit is stored with no verdict, and reconcile skips it. Patterns written for fields
compile as before. The limit applies to each such regex on its own.

Behind it, `temper-services` gains the shape loader, which turns each shape an ask names into one
of loaded, not askable (absent or unreadable, one answer for both), superseded (with the version in
force at the same home and family), too large, or uncompilable, in that order and only through the
gated shape read; the compile runs off the async executor under a few process-wide permits, and a
stored shape's verdict is remembered by id, so a shape read many times compiles about once.
`temper-core` validates asks through an `AskSession` begun from the loaded shapes, so one request's
asks share each shape's walk and one work budget, and an ask validated twice is answered the same
way without spending again. No door accepts an ask yet, so no caller sees an ask refusal.

Who observes: shape authors declaring through the doors above, and readers of a shape by id.
Release relevance: signal-only.
'''
