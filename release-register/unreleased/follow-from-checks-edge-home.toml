title    = "The follow-from walk and graph_traverse admit an edge only if its home anchor is readable, as well as both endpoints"
pr       = "self"
classes  = ["additive", "behavioral"]
surfaces = ["schema", "http"]
status   = "signal-only"
body = '''
Migration 20261119000010 (PW-6). The follow-from walk behind a `follow-from` stage of /api/query,
query_follow_from and search_graph_expand admitted any live edge whose two endpoints the caller
could see, whatever context or cogmap the edge was homed in. An edge homed where the caller cannot
read, between two resources they can, was walked, reported in `via`, and moved
search_graph_expand's ranking. The walk now lives in __temper_ungated_follow_from_homed, which takes
the principal and admits an edge only if edges_visible_to does: live, home readable, both
endpoints readable. query_follow_from passes its principal, and the compiler emits the new body
with its own principal bind. graph_traverse (no product caller) is gated the same way in place.

Additive: no DROP and no new arity of an existing name. The 10-arity __temper_ungated_follow_from
stays, as a wrapper passing a NULL reader, which admits no edge. Skew: an older binary still emits
that 10-arity call, so its follow-from stages return no rows until the new binary is live. That is
narrower, never wider. Who observes: a caller whose walk crossed an edge homed in a context or
cogmap they cannot read; that neighbour and its `via` entry disappear. Response shapes are
unchanged. Witnesses: `follow_from_ignores_an_edge_whose_home_is_unreadable` and
`graph_traverse_admits_only_visible_edges` in
`crates/temper-services/tests/edge_conjunction_harness.rs`. Release relevance: closes a
low-severity edge disclosure; signal-only.
'''
