title    = "The follow-from walk and graph_traverse admit an edge only if its home anchor is readable, as well as both endpoints"
pr       = "self"
classes  = ["additive", "behavioral"]
surfaces = ["schema", "http", "mcp"]
status   = "signal-only"
body = '''
Migrations 20261119000010 and 20261119000050. The follow-from walk behind a `follow-from` stage of /api/query (and so
MCP run_query), query_follow_from and search_graph_expand admitted any live edge whose two
endpoints the caller could see, whatever context or cogmap the edge was homed in. An edge homed
where the caller cannot read, between two resources they can, was walked, reported in `via`, and
moved search_graph_expand's ranking. The walk now lives in __temper_ungated_follow_from_homed. It
takes the principal and admits a candidate edge only if the principal can read its home, checked
once per distinct home. The endpoints stay gated by the visible set the caller hands in.
query_follow_from passes its principal, and the compiler emits the new body with its own principal
bind. graph_traverse (no product caller) is gated in place on edges_visible_to and keeps its depth
clamp.

Additive: no DROP and no new arity of an existing name. The 10-arity __temper_ungated_follow_from
stays, as a wrapper passing a NULL reader, which admits no edge. Skew: this narrows, never widens.
An older binary still emits that 10-arity call, so its follow-from stages return no rows until the
new binary is live. Cost: four follow stages in one statement on a synthetic 30k-resource,
50k-edge corpus took 128 ms, against 78 ms for the ungated walk. Who observes: a caller whose walk
crossed an edge homed in a context or cogmap they cannot read; that neighbour and its `via` entry
disappear. Response shapes are unchanged. Witnesses: `follow_from_admits_only_visible_edges`,
`graph_traverse_admits_only_visible_edges` and `graph_traverse_clamps_its_depth_on_a_cycle` in
`crates/temper-services/tests/edge_conjunction_harness.rs`. Release relevance: signal-only.
'''
