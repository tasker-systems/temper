title    = "`temper data-artifact list --limit` and MCP `list_data_artifacts` with `limit` answer one bounded page in a `{artifacts, next}` envelope"
pr       = "self"
classes  = ["additive"]
surfaces = ["mcp", "cli-stdout"]
status   = "signal-only"
body = '''
`temper data-artifact list` gains `--limit <n>`, `--order asc|desc`, `--after-created <rfc3339>` and `--after-id <uuid>`, and MCP `list_data_artifacts` gains `limit`, `order` (`asc` or `desc`) and `after` (`{created, artifact_id}`, the existing `ArtifactCursor`). The bounded answer is opted into with `limit`: it is one page, oldest first unless `order` is `desc`, answered as the envelope `{"artifacts": [...], "next": {"created": ..., "artifact_id": ...} | null}` on the CLI's stdout in every output format and in the MCP tool's single content block. `next` is always present, `null` on the last page, and continues the walk when passed back unchanged (as `after`, or as `--after-created` and `--after-id`) with the same filters and `order`; it carries `created` at full precision, so the position round-trips exactly. The paging inputs are checked by `ArtifactListParams::page_request`, the route's own validation, so `after`/`--after-*` or `order`/`--order` without `limit`, half a position, and a `limit` of 0 or above `MAX_ARTIFACT_PAGE_ROWS` (200) are refused in the route's words, on MCP as `invalid_params` before anything is relayed; `--counts` beside any paging flag is a CLI usage error. Without `limit`, both doors answer exactly as before: every artifact as a bare array, read a bounded page at a time. That unbounded default retires on the retirement train under a later entry. The MCP tool's input schema gains the three fields (inline, no `$ref`), and its description now tells an agent to prefer `limit` and how to continue. Release relevance: signal-only.
'''
