title    = "A `find-resources-with` stage that asks artifacts discloses, per ask, the population it counted by shape state and how many matched, on its trace entry"
pr       = "self"
classes  = ["additive"]
surfaces = ["http", "clients", "mcp", "cli-stdout", "schema"]
status   = "signal-only"
body = '''
`StageTrace` gains `artifact_asks`, a list skipped when empty, so a stage that asks nothing serializes as before. A `find-resources-with` stage carrying `artifact_filter` has one entry per ask in filter order: `position`, the `shape_id` and `shape_version` the plan was validated against, `in_force` (the live version of the shape's lineage when the statement ran, or `null` when the shape's home is not readable at execution or the shape is gone), and `population`, an `ArtifactAskPopulation` of `declared_satisfied`, `declared_not_satisfied`, `declared_not_yet_checked` and `matched`. The by-state counts apply the ask's intent but not its `shape_states`; `matched` applies the whole ask; both range over the ask's counted set (visible, fully ingested resources in the shape's home, while the home is readable), which ignores the stage's `resource_filter`; and two asks' counts do not combine. A stage refused, or downstream of a refusal, carries no entries. The counts ride the one compiled statement as a new `population` row class, computed by migration `20261105000000`'s new `__temper_ungated_artifact_ask_counts`, which returns exactly one row per ask over the counted set the selection already reads; a stage whose asks ran without its rows fails the response as a missing tally does, and the executor now errors on a row class it does not know rather than reading it as a tally.

Who observes it: callers of `POST /api/query` and the three SDKs (the response schema grows the field and three types), MCP `run_query` (the response carries it; its description now says where an empty selection's explanation is), and `temper query`, whose JSON or TOON output carries the field; the CLI has no per-stage human rendering of the trace, so nothing else in its output moves. The skill's data-artifacts and querying guidance teach reading it.

Same release; see `find-resources-with-asks-artifacts`. That entry's `artifact_filter` is what makes an empty composable stage mean one of three things, and this entry's per-ask population is what tells them apart, so the two ship together.

Release relevance: signal-only. Additive response members and a new function; no request, route, or existing response changes for a plan that asks no artifacts.
'''
