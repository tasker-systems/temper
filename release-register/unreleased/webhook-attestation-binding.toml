title    = "An inbound webhook attestation can be bound to this project and accepted once"
pr       = "self"
classes  = ["additive", "behavioral"]
surfaces = ["http", "schema"]
status   = "signal-only"
body = '''
`POST /api/intake/webhook` gains two checks on the Vercel Connect attestation, behind a new optional
env var, `VERCEL_CONNECT_ENFORCE_ATTESTATION_BINDING`: its `project_id` claim must equal
`VERCEL_CONNECT_PROJECT_ID`, and the same attestation is accepted once (its SHA-256, never the
token, is recorded in the new `kb_inbound_attestations_seen` until it expires). Unset, which is the
default, a failed check is logged as a would-be refusal (`reason` = `project_mismatch` /
`replayed`) and the webhook still lands; set to `true`, it is the same opaque 401 as every other
intake refusal. Either way each receipt now records its attestation's hash, in the same transaction
as its event, so a receipt that fails never spends its attestation and of two simultaneous copies
exactly one is the first. The flag's effective value is logged at startup, and a value that is not
a recognisable boolean enforces. Request and response shapes are unchanged. Who observes:
operators reading the intake log; with the flag set, a sender replaying an attestation or presenting
another project's. Release relevance: additive (the table, the env var), behavioral only once an
operator sets the flag.
'''
