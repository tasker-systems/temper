title    = "`GET /api/resources` lists resources by id, bounded to what the caller can see"
pr       = "self"
classes  = ["additive", "behavioral"]
surfaces = ["http", "clients", "mcp", "cli-stdout", "schema"]
status   = "signal-only"
body = '''
`ResourceListParams` gains `ids`: a comma-separated list of resource UUIDs, at most 256 (the id-set bound the query door already uses). The page holds the caller's visible resources among them and nothing else. An id that does not exist, was deleted, is not visible to the caller, or names an unfinished upload is simply absent from the rows, and the response carries no other trace of it: no per-id status, no error, no count. A malformed id, or more than 256, is a `400` that names the field and never echoes the values. Rows are the list's existing row, with no body. It composes with every other filter as one more AND.

The same read is on every door: `temper resource list --ids <ref>` (repeatable or comma-separated) and MCP `list_resources.ids` take UUIDs or decorated refs, refuse a malformed ref or more than 256 before the round-trip, and raise the page size to at least the number of ids. MCP's 200-row clamp does not cut a by-id read.

`@tasker-systems/temper-design` gains `./links`: the exact `./<uuid>` matcher (with an optional trailing `/`), `extractVaultLinks` (bounded by the markdown source bound, DOM-free and total), the answer types, `BODY_LINK_CAP` (256, held to the published `IdSet` bound by a test) and the hover words. `sanitizeMarkdownHtml` takes an optional second argument, the body's link answers and the surface's resource address, or `'pending'`, and rewrites every vault link after sanitizing: resolved shows the held title as text; absent is inert, with one sentence for gone and not visible; unchecked, including every link when no answers are given, stays followable with its own mark. `contract/markdown.css` paints the two marks on the `empty` and `failed` region roles.

Who observes it: callers of `GET /api/resources` and the three SDKs, whose list parameters grow the field; `temper resource list`, which gains `--ids`; MCP `list_resources`, whose input schema gains `ids`; and a surface importing the package, whose rendered `./<uuid>` links now render unchecked until it passes answers. A request that does not use `ids` is unchanged.

Release relevance: signal-only. Additive (a query parameter, a module, an optional argument) and behavioral (how a rendered body link reads).
'''
