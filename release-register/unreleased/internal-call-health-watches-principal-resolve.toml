title    = "The internal-call health check watches the principal resolve channel, and its sustained line names the operator's checks"
pr       = "self"
classes  = ["behavioral"]
surfaces = ["internal"]
status   = "signal-only"
body = '''
What changed: temper-cloud's principal resolve call, the fail-open sibling of the SAML membership
reconcile, now records its outcome on a second kb_internal_call_health channel, principal_resolve,
at both call sites (the ACS and the token endpoint's re-resolve of an ownerless chain). Its
failures are classified like the reconcile's: an unset variable is config_missing, a 401 or 403 is
unauthorized, no answer is transport, and anything else, including a 2xx with no usable profile
id, is endpoint_error. /api/internal-calls/health reports both channels, so a SAML deployment
without INTERNAL_RESOLVE_URL now reports principal_resolve as sustained with cause config_missing
instead of nothing.

Both calls check their own URL before signing: a path that is not the door the call signs for
(a stray segment, a trailing slash, the other door, or a prefix a proxy strips), a value that is
not a URL, a scheme other than http(s), or a URL with userinfo is config_missing with detail
"<VARIABLE> path", and nothing is sent. Before, it was sent and recorded as unauthorized or
transport. A deployment that reached the API through a stripped path prefix stops reaching it and
reports config_missing on both channels until the URLs name the doors directly. A subject temper-api
refuses as machine-shaped (an @clients NameID) is no longer sent to either door, and is not recorded
as a channel failure: the API's 401 for it would otherwise page as a wrong secret. The meaning of unauthorized is reworded "the signature was refused or the door is
not served": temper-api answers every unauthenticated caller the same way, so the 401 cannot say
which.

The sustained error line gains an action field and a consequence field. For unauthorized the
action names both checks: the channel's URL (path and host) and INTERNAL_RECONCILE_SECRET on both
sides. The line's message no longer names IdP de-provisioning; the consequence field says what has
stopped for that channel.

Unchanged: fail-open. A failed resolve or reconcile never refuses a login or a rotation. No
migration; the table was keyed on channel for this sibling.
'''
