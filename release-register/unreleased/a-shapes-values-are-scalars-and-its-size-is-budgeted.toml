title    = "A shape's const and enum members are scalars, and its schema's parsed size is budgeted"
pr       = "self"
classes  = ["additive", "behavioral"]
surfaces = ["http", "mcp", "cli-stdout", "clients"]
status   = "signal-only"
body = '''
Hardening. Two rules join the field-tree rules, both enforced by the one compile every shape goes
through (declare, commit, reconcile and the shape loader).

Values are scalars. A `const`, and every `enum` member, must be a string of at most 256 bytes
(JSON-escaped), a number, a boolean or `null`; an object, an array or a longer string makes the
schema uncompilable. `default` and `examples` stay free-form.

A schema's parsed size has a budget. A shape's schema holds at most 12,288 JSON values, at most
3,072 of them objects, counted at every depth across the whole document with `default` and
`examples` included. The budget can refuse a schema every other cap allows: 48 enums of 256 strings
each fit the per-keyword caps but not the budget. The shape loader counts it before it takes a
compile permit or copies a stored schema. The declare routes (`POST /api/contexts/{id}/shapes`,
`POST /api/cognitive-maps/{id}/shapes`) take a request body of at most 512 KiB, twice the 256 KiB
schema cap; the MCP `declare_data_artifact_shape` tool and `temper data-artifact schema declare`
reach the same compile. Declare's refusal (`400`, code `DATA_ARTIFACT_REFUSAL`, MCP
`invalid_params`) names the first thing refused with the cap it passed — `keyword const that is not
a scalar of at most 256 bytes at /properties/a`, or `more than 12288 JSON values in the whole
schema` — then the sentence of rules, which now names both (`enum … and const of scalars`, `within
a value budget`). No wire field is added;
OpenAPI, ts-rs and the three generated SDKs change only in description text.

The ask walk reads a schema holding a structured `const` or `enum` member as `false`: it declares
nothing, so every path is refused `path_outside_shape` and the vocabulary is empty. No stored shape
reaches it, because the loader compiles every stored shape first. Below a node that declares values,
every path holds the empty set: a `contains` ask there is refused `value_outside_shape`, while
`compare`, which reads the declared types only, and `has_key` are admitted.

Stored shapes. A stored schema the new compile refuses can no longer be checked:
- an `enforcing` family refuses every commit until the shape is amended, a write outage until its
  author re-declares it; commits refused while that lasts are lost unless the client retries;
- an `advisory` family records each commit unchecked (`declared_not_yet_checked`);
- reconcile writes a `kb_shape_reconcile_uncheckable` row with reason `schema_uncompilable` and
  stops selecting the shape;
- an ask of the shape, and a by-id read of its vocabulary, answer `shape_schema_uncompilable`,
  naming the first thing the compile refused, as declare does, to a reader the gated shape read
  admits. Re-declaring the shape returns the full refusal sentence, which names every rule the
  compile holds a schema to (a schema past the 256 KiB size cap is refused with a sentence of its
  own).

Operators of other deployments: before upgrading, check every stored schema against both rules.
For each row of `SELECT id, artifact_kind, schema FROM kb_data_artifact_shapes`, count its values
with `SELECT count(*) FROM jsonb_path_query(schema, 'strict $.**')` and its objects with
`... 'strict $.** ? (@.type() == "object")'`, and look for structured members with
`jsonb_path_query(schema, 'strict $.**.const ? (@.type() == "object" || @.type() == "array")', '{}', true)`
and the same over `$.**.enum[*]`. Find the longest `const` or `enum` string, in JSON-escaped
bytes, with
`SELECT max(octet_length(v::text) - 2) FROM jsonb_path_query(schema, 'strict $.**.const ? (@.type() == "string")', '{}', true) v`
and the same over `$.**.enum[*] ? (@.type() == "string")`; past 256 fails. These over-report
(`.**` also reaches data positions and property names), so a hit calls for a look at the schema,
not for an amendment. A shape that fails needs amending first. A self-hosted server's 25 MiB body
limit still applies on the other gated routes, on `/api/query` and on `/mcp`.

Rollback. The new compile is the old compile plus refusals, so the previous release accepts every
schema this one does, and a shape declared under this release is never stranded by rolling back. If
a deploy leaves shapes uncompilable and the release is rolled back, clear their records: delete the
`kb_shape_reconcile_uncheckable` rows with `reason = 'schema_uncompilable'` and
`recorded_at >= <deploy instant>`, then enqueue reconcile for the affected homes. A row recorded in
that window for a shape that fails an older rule is harmless to delete; the next pass records it
again.

The node and object caps (12,288 and 3,072) and the declare body limit (512 KiB) are this
release's values; a later release may revise them. Bounding what one request can make the server
parse across many shapes, and measuring other routes' bodies before they are parsed, are separate
changes. No migration.

Who observes: shape authors and the agents and CLIs declaring through the doors above, writers
committing to an `enforcing` family, and agents asking at a path below a declared value. Release
relevance: signal-only.
'''
