title    = "A soft-deleted team confers nothing: no authority over its contexts, connections or machines, its contexts read as retired, and nothing is written onto it"
pr       = "self"
classes  = ["behavioral"]
surfaces = ["http", "mcp", "cli-stdout", "clients"]
status   = "signal-only"
body = '''
Soft-deleting a team now takes away everything the team conferred. Migration `20261110000100`.

- A former owner or maintainer of a soft-deleted team no longer administers its contexts: share,
  unshare, reassign, rename, retire and restore answer as for any non-administrator (`403` from the
  share and reassign doors, `404` from rename, retire and restore). They no longer control its
  connections or machine clients either: `POST /api/connections/{id}/reach` is refused, and machine
  client get, revoke and secret rotation answer `404`, as for a missing id. Subscriptions authored by
  the team, and blob deletes in its contexts, are refused the same way.
- A context owned by a soft-deleted team reads as retired. Shares to other teams and grants on the
  context no longer reach it, and write grants on it no longer author it. A resource's home owner
  keeps their resource, and a grant on the resource itself still answers. A system admin can still
  reassign the context to a live team, after which it is live again.
- Nothing is written onto a soft-deleted team, by a system admin either: adding or changing a
  member, sharing or reassigning a context into it, granting it reach or registering a machine onto
  it, approving a join request for it and `promote_admin --team` on it are refused (`404`; `400` for
  `promote_admin`). Auto-join skips it. SAML provisioning skips a group mapped to it rather than
  failing the login.

Who observes: former managers of soft-deleted teams, and people who reached a soft-deleted team's
contexts through a share or a grant. Release relevance: signal-only.
'''
