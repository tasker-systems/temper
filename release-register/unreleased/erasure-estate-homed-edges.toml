title    = "Person erasure erases the relationships homed in the erased person's estate, under an edge erasure authority"
pr       = "self"
classes  = ["additive", "behavioral"]
surfaces = ["schema", "erasure-policy"]
status   = "signal-only"
body = '''
Migration 20261201000050 adds the admin event type edge_erased and the redaction authority `edge`:
an edge_erased record lets an act rewrite the ledger trail of one edge that is folded and homed in a
context of the estate the record names, to the sentinels resource erasure writes. The ledger guard,
the trail trigger and the sweep's place closure each read the new authority. The resource act's
ledger derivation now runs through one shared loop, _erasure_trail_payload_redaction, whose output for
a resource is unchanged. Migration 20261201000060 adds edge_erasure_execute, which erases one edge
homed in the estate: it folds the edge if it is live (relationship_folded, reason estate_erased),
appends one edge_erased record, nulls the edge's label, sets every property the edge owns to its
sentinels, and rewrites the edge's labels, properties, earlier fold reasons and corrections, and
the authorship metadata on its events, to their sentinels on the ledger; the estate_erased reason of
the fold it appends is kept. The person act runs it for each edge homed in the estate that no
resource erasure reached, whatever the edge points at. Once it commits, a property write
(property_set, facet_set, a keyed assert, property_retracted), relationship_retype,
relationship_reweight or relationship_fold of the edge is refused; one in flight while the unit
holds the edge waits for the act and is then refused. The sweep's findings on its label and
properties give up their digests as an erased resource's do.
TODO(open ruling): the sentence naming which estate-homed edges the person act reaches: live ones only,
or also those folded before the act.
Replay projects edge_erased as it projects resource_erased. The erasure policy binds kb_edges'
unit, and kb_properties' path through kb_edges, to edge_erasure_execute, declares edge_erased's
payload paths structural, and records as gaps the regions, lenses and data-artifact schemas homed in
an estate context. Who observes: an admin reading the ledger sees one edge_erased per erased edge,
and anyone reading such an edge, its properties or its ledger trail finds its label and properties
gone or at their sentinels, whoever wrote them. Witnesses: crates/temper-services/tests/edge_erasure_authority_test.rs,
edge_erasure_trail_test.rs, edge_erasure_unit_test.rs, edge_erasure_replay_test.rs and
sensitivity_edge_erasure_bridge_test.rs. Release
relevance: additive in schema; behavioral for person erasure, which now reaches these edges.
'''
