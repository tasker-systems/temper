title    = "Restoring a team under the root or the gating team, and bringing a pool below a dead team under a parent, are a system admin's acts"
pr       = "self"
classes  = ["behavioral"]
surfaces = ["http", "mcp"]
status   = "signal-only"
body = '''
Two refusals for a non-admin, in team_service. Restore refuses (403) when the team keeps a link to
a live root (temper-system) or gating parent, as attach already refuses a root or gating parent; a
personal team, whose only parent is the root, is still restored by its owner. Attach, reparent and
restore count an auto-join or gating team anywhere below the child, live or dead, as a pool (403
unless a system admin): a pool below a dead team confers nothing yet, but an admin's later restore
would hand the parent, and everything above it, to the whole instance. Both are decided again under
the act's locks, which already covered dead descendants.

Who observes: a non-admin owner restoring such a team, or attaching or reparenting a subtree with a
dead team above a pool; a system admin is unaffected. Response shapes are unchanged. Witnesses:
`a_dead_pool_below_counts`, `restoring_a_subtree_that_holds_a_pool_is_an_admins_act`,
`restoring_under_the_root_or_the_gating_team_is_an_admins_act` and
`a_parent_made_the_gating_team_while_the_restore_waits_is_seen` in
`crates/temper-services/tests/team_subtree_pool_authority_test.rs`. Release relevance: signal-only.
'''
