title    = "The evidence read's contradiction balance and band count only edges the caller can see"
pr       = "self"
classes  = ["additive", "behavioral"]
surfaces = ["http", "mcp", "schema"]
status   = "signal-only"
body = '''
Migration 20261119000040. GET /api/resources/{id}/evidence (resource_standing_shape) scored
`contradiction_balance` over every live supports, corroborates and contradicts edge on the
finding, including edges the caller could not see. The shape now calls
_resource_contradiction_balance, which counts only edges edges_visible_to admits for the caller.
`band`, which takes the balance, follows. The other five components are unchanged and stay
reader-independent. The kb_resource_standing memo and its producer are unchanged; the memo is not a
read surface.

Who observes: a reader of a finding with a support or contradiction edge homed where they cannot
read, or from a resource they cannot read. That edge no longer moves their balance or band.
Response shapes are unchanged. Witness: `the_balance_and_band_ignore_an_edge_the_reader_cannot_see`
in `crates/temper-api/tests/evidence_handler_test.rs`. Release relevance: signal-only.
'''
