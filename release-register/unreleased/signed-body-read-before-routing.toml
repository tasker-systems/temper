title    = "A request carrying the signature headers has its body read before routing, on every path"
pr       = "self"
classes  = ["behavioral"]
surfaces = ["http", "internal"]
status   = "signal-only"
body = '''
What changed: a request carrying all three X-Temper-* signature headers (X-Temper-Timestamp,
X-Temper-Nonce, X-Temper-Signature-V2) now has its body read into memory, up to 64 KiB, before
routing, on every path, and the router sees that buffered body. Before, only the signature doors
read it, so a request declaring a body it never sent stalled only at a door, and
Expect: 100-continue drew 100 Continue only at a door. Now both happen alike on every path for the
same request.

A signed request whose body is over 64 KiB, by its declared length or as read, or whose body cannot
be read, is answered the uniform pre-identity 401 on every path, including public routes such as
/api/health. Its cause is logged as hmac_body on the "auth error" line with the request id. The
64 KiB cap moved to temper_core::internal_sig::MAX_BODY_BYTES, which both sides of the read use.

Unchanged: a request without all three signature headers is not read early. A validly signed
request reaches its door's handler with the same body, with or without Expect: 100-continue. No
response bytes changed.
'''
