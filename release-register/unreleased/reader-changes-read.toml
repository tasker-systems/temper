title    = "A reader can list the work they changed, most recent first, and read when they last changed something in each context"
pr       = "self"
classes  = ["additive", "behavioral"]
surfaces = ["http", "clients", "cli-stdout", "schema"]
status   = "signal-only"
body = '''
`GET /api/resources` gains `changed_by` and the sort field `changed_by_me`.
- `changed_by=@me` narrows the list to resources the caller changed. A change counts when the resource's own element trail holds an authored event the caller's profile emitted: by the caller themselves, or by an agent writing under their profile, on any surface.
- Events the system computes (`region_materialized`, `salience_refreshed`, `relationship_decayed`) never count, even though a region job carries the emitter of whoever's write queued it.
- An admin's erasures and scrubs never count: `blob_erased`, `context_erased`, and every ordinary event such an act writes (an erasure's `relationship_folded` per edge, a field scrub's `resource_updated` and property events), which the act ties to its own record by correlation id and emitter, so an agent's or another surface's writes under the same id still count. Only an admin runs these, and they have surfaces of their own. Any other fold is a soft delete and counts.
- Acts that run or route work rather than change it never count: `invocation_closed`, `delegated_launch`, `subscription_delivery_disposed`, `citation_audited`.
- A machine client is its own profile, and its changes are not the caller's, even when the caller registered it. A teammate's change to the caller's resource does not count; the caller's change to a teammate's resource does. That is how this differs from `owner=@me`.
- The filter composes with every other filter as one more AND, under the same visibility join, so a resource the caller changed and can no longer read is absent from the rows, from `total` and from the facet histograms.
- `sort=changed_by_me` orders by the caller's own latest change to each resource, not by the resource's `updated`.
- An empty `changed_by` is no filter, as for `tags` and `ids`. Any other value except `@me` is a `400`, because naming another principal would make this a read of their activity. `sort=changed_by_me` without `changed_by=@me` is a `400`, because the rows would have no such time.

New route `GET /api/me/context-activity` (`list_my_context_activity`, tag `Me`): one `ContextActivity { context_id, last_changed_at }` per context the caller changed something in and can still read, newest first. Only the caller's own authored changes set it, and a retired context has no row. It is a profile-scoped read of its own, rather than a field of `GET /api/contexts`, so the contexts list every page loads does not pay for a scan of the caller's history. `GET /api/contexts` is unchanged. `temperkb-client` gains `me().context_activity()`, and the CLI gains `temper context activity`, which prints each row with the context's `ref` and `name` beside its id and time.

Both are read through new SQL functions in migration `20261107000000_reader_changes.sql` (additive):
- `resources_changed_by(uuid)` and `contexts_changed_by(uuid)`, each gated by the profile's own read predicate;
- a private events helper both of them read, so "your change" has one definition.

Reading either answer records nothing.

Who observes it: HTTP callers, `temperkb-client`, the CLI (`temper context activity`), and the three SDKs. Their list parameters and sort enum grow, and they gain the new route. A request that sends neither parameter is unchanged. The CLI's `resource list` and MCP do not expose `changed_by` yet.

Release relevance: signal-only. Additive (a query parameter, an enum value, a route and its row type, three functions) and behavioral (a new read of the caller's own activity).
'''
