title    = "The ask walk reads only field trees, and its work budget is gone"
pr       = "self"
classes  = ["additive", "behavioral"]
surfaces = ["http", "mcp", "cli-stdout", "clients"]
status   = "signal-only"
body = '''
Hardening. The schema walk behind an ask and a shape's vocabulary (`GET /api/shapes/{id}`'s
`askable`, the MCP `get_data_artifact_shape` tool, `temper data-artifact schema show`) now reads
only what a field tree may hold. A schema holding any other construct, or an `enum` or `type` in a
form the walk does not read, is walked as `false` — it declares nothing, so every path is refused
`path_outside_shape` and the vocabulary is empty — and is logged at error with the shape's id. It
is never read as unconstrained; a `const`, or an `enum` member, that is an object, an array or a
string past 256 JSON-escaped bytes is such a form. No shape reaches it: the loader compiles every
stored shape before it is asked, and the compile refuses anything outside a field tree, which a test holds to the
walk's own list. No wire value is added: `BoundKind` keeps its four members, and OpenAPI, ts-rs
and the three generated SDKs change only in description text.

The walk has no work budget: with no `$ref` or combinator each schema node is read once, so the
walk is linear in a schema held to 256 KiB and to 12,288 JSON values (measured under 1 ms to
enumerate at 256 KiB, release build). A shape whose declared values would have spent a work budget
cannot be stored: the compile refuses a schema past the value budget, and every `const` and `enum`
member is a scalar.

`beyond_bound: work` now means only that the request's `contains` values spent its membership
steps, and its sentence says so. The path refusal's rule now reads "only `properties` chains are
walked", no longer naming `$ref` or the combinators. The declare refusal's fixed sentence now names
the accepted `$schema` spelling. No migration.

Who observes: agents and CLIs reading a refusal's sentence or a shape's vocabulary. Release
relevance: signal-only.
'''
