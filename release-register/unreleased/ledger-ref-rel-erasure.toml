title    = "Admin-ledger pages holding a person erasure that ran resource erasures read again; the `erasure` reference is withheld from the wire"
pr       = "self"
classes  = ["behavioral"]
surfaces = ["http"]
status   = "signal-only"
body = '''
Behind an unchanged shape (`GET /api/admin/ledger`): since 20261021100000 (unreleased) the
person-erasure writers store one `rel: "erasure"` reference per resource erasure on
`principal_erased`, and the service could not decode it, so every ledger page holding such a row
answered 500 — on the subject axis for the erased profile and on the actor axis for the operator
who ran it. The service now decodes it, and those pages answer 200.

The `erasure` reference is withheld from the response's `references`: `LedgerRefRel` does not name
it at the 0.6 pin, and a pinned client's exhaustive parse would reject a new member, so this is the
deprecation path (D-C2), not an enum change. Nothing is lost — the entry's payload names each
resource erasure's event in `resource_erasures[].event`. The `erasure` member joins `LedgerRefRel`
on the retirement train. No released server shipped the 500: it existed only on main.

Who observes: system admins reading the ledger, and operators reading their own history.
Release relevance: behavioral fix of unreleased behavior; no wire shape moved.
'''
