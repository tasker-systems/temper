title    = "Attaching a connection's credential answers fixed sentences and logs the broker's error"
pr       = "self"
classes  = ["behavioral"]
surfaces = ["http", "clients", "cli-stdout"]
status   = "signal-only"
body = '''
`POST /api/connections/{id}/credential` mints once to verify the connector, as before. When the
broker rejects the credential, the `400` now reads `connector rejected the credential`. When the
broker fails for a reason that says nothing about the credential, the attach still succeeds and
`verification.note` reads `could not verify the credential; the broker's error is in the server
log`. In both cases the broker's own error text goes to the server log at `warn`
(`credential attach: …`, field `broker_error`). The consent-pending and no-broker notes, including
the authorize URL, are unchanged. Request and response shapes are unchanged; no migration and no
`openapi.json` movement. Who observes: connection managers attaching a credential, and operators
reading the API log. Witnesses, in `connection_service`:
`a_rejected_attach_answers_a_fixed_sentence_and_logs_the_brokers_error` and
`an_unverified_attach_notes_a_fixed_sentence_and_logs_the_brokers_error`. Release relevance: signal-only; rides 0.6.1.
'''
