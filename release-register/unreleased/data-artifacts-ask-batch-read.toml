title    = "One artifact ask returns the matching artifacts themselves, whole, in bounded pages: `POST /api/data-artifacts/ask`, MCP `ask_data_artifacts` and `temper data-artifact ask`"
pr       = "self"
classes  = ["additive"]
surfaces = ["http", "clients", "mcp", "cli-stdout", "schema"]
status   = "signal-only"
body = '''
A new read, `POST /api/data-artifacts/ask` (operation `ask_data_artifacts`), takes `AskRequest { ask, limit?, after? }` and answers `AskResponse`: `shape` (the row the ask was validated against), `artifacts` (each an `ArtifactView` with its content whole, in `(created, id)` order; an artifact committed with no content carries no `content` field), `oversized` (in order, each matching artifact that does not fit the page's byte budget alone, named by id, resource and size and fetchable by id), `population` (an `ArtifactAskPopulation` on the first page, `null` on every continuation), `ordered_by: "created"`, `next` (an `ArtifactCursor`; only `null` ends the enumeration) and `amended_since` (a `ShapeSuccessor` when a continuation's pinned shape has been amended since the first page, else `null`). `population`, `next` and `amended_since` are always written and are required, nullable keys in the schema. `AskRequest`, `AskResponse`, `AskedShape`, `OversizedArtifact` and `AskOrder` are new OpenAPI components. `limit` counts the matching rows a page examines, served or oversized; absent, it is `ARTIFACT_DRAIN_PAGE_ROWS` (50), and 0 or above `MAX_ARTIFACT_PAGE_ROWS` (200) is refused with the new `RefusalReason` `page_limit_out_of_range`, beside any refusal of the ask itself.

The byte budget bounds the whole page, not only its content: every row a page examines is charged against it — a served row its `content_bytes` plus its metadata (each text field it carries at the length of its JSON string, so a long family name is paid for on every row, plus a fixed per-row charge for its ids, numbers and keys), an oversized row the fixed charge. A row that fits the budget alone but not what is left of the page ends the page and opens the next. A page is also bounded in what it reads to find its rows: each candidate is charged its `content_bytes` plus a fixed per-candidate charge, the first is always read, and once the charge before a candidate reaches the read budget the page ends at the last candidate it read, matched or not, and answers `next` there — so a page can carry no artifacts and a non-null `next`. The earliest of the row limit, the byte budget and the read budget ends a page. The first page's `population` is not under the read budget: it is the ask's exact counts over the whole counted set, which match every governed artifact of the home. A continuation is validated against the same shape row as its first page even after that row is folded, but each row's `shape_state`, and any `shape_states` narrowing, are read against the version now in force (`amended_since`), so an ask narrowed by `shape_states` should start again from a first page when `amended_since` appears; a first page (no `after`) naming a folded row is still refused `shape_superseded`. Every refusal is a `PlanRefusal` with no stage under `error.details.refusals` (code `PLAN_REFUSED`); a body the route cannot read — malformed JSON, a wrong type, an unknown field, an `after` missing half its position, or an `after` whose `created` is before the first instant the store holds — answers the existing `UNREADABLE_PLAN` code with a bounded message, never the framework's plain-text rejection or a server fault. A `GET` to the path meets the route's caller checks first: `401` without credentials, `403` without system access, and `405` to a caller with both, because the static segment is matched ahead of `GET /api/data-artifacts/{artifact_id}`.

The read runs through migration `20261106000000`: the counted set's body becomes `__temper_ungated_artifact_ask_rows`, which also takes a keyset position, a row limit, matched-only and a read budget, and `__temper_ungated_artifact_ask_population` delegates to it at its unchanged signature with no read budget, so `find-resources-with` and the trace's counts answer as before. New gated functions `artifacts_matching_ask` (a page) and `artifact_ask_counts` (the first page's population) apply `resources_visible_to` themselves.

Who observes it: callers of the new route; the three SDKs and temperkb-client (`DataArtifactsClient::ask`, new request and response types, and the new refusal reason, which also appears in every `RefusalReason` schema); MCP clients, through the new read-only tool `ask_data_artifacts`, whose input schema is `AskRequest`'s, which relays the request unread, answers the page as compact JSON in one text block, and carries a refusal's list, `teaches` included, in the error's `data` (`run_query` now renders its refusals through the same code, unchanged); and `temper data-artifact ask` (`--ask <json|@file|->`, or `--shape` with repeatable `--where <predicate JSON>`; `--limit`; `--after <cursor JSON>`), whose JSON or TOON output carries the response and whose refusal, under the JSON format, carries the refusals in the error payload's `details`. The skill's data-artifacts guidance teaches asking on both arms, the enum refusal's route and the enumeration floor; the MCP tool reference counts the new tool. `ArtifactView.shape_state`'s documentation now says what the field carries, and `ArtifactView.content`'s that it is absent, not `null`, for an artifact with no content.

Release relevance: signal-only. A new route, tool, command, client method and refusal reason; no existing request, route or response changes.
'''
