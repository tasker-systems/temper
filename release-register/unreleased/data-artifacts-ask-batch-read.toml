title    = "One artifact ask returns the matching artifacts themselves, whole, in bounded pages: `POST /api/data-artifacts/ask`, MCP `ask_data_artifacts` and `temper data-artifact ask`"
pr       = "self"
classes  = ["additive"]
surfaces = ["http", "clients", "mcp", "cli-stdout", "schema"]
status   = "signal-only"
body = '''
A new read, `POST /api/data-artifacts/ask` (operation `ask_data_artifacts`), takes `AskRequest { ask, limit?, after? }` and answers `AskResponse`: `shape` (the row the ask was validated against), `artifacts` (each an `ArtifactView` with its content whole, in `(created, id)` order; an artifact committed with no content carries no `content` field), `oversized` (in order, each matching artifact that does not fit the page's byte budget alone, named by id, resource and size and fetchable by id), `population` (an `ArtifactAskPopulation` on the first page, `null` on every continuation), `ordered_by: "created"`, `next` (an `ArtifactCursor`, `null` on the last page) and `amended_since` (a `ShapeSuccessor` when a continuation's pinned shape has been amended since the first page, else `null`). `AskRequest`, `AskResponse`, `AskedShape`, `OversizedArtifact` and `AskOrder` are new OpenAPI components. `limit` counts the matching rows a page examines, served or oversized; absent, it is `ARTIFACT_DRAIN_PAGE_ROWS` (50), and 0 or above `MAX_ARTIFACT_PAGE_ROWS` (200) is refused with the new `RefusalReason` `page_limit_out_of_range`, beside any refusal of the ask itself.

The byte budget bounds the whole page, not only its content: every row a page examines is charged against it — a served row its `content_bytes` plus its metadata (each text field it carries at the length of its JSON string, so a long family name is paid for on every row, plus a fixed per-row charge for its ids, numbers and keys), an oversized row the fixed charge. A row that fits the budget alone but not what is left of the page ends the page and opens the next. A continuation is validated against the same shape row as its first page even after that row is folded; a fresh ask naming a folded row is still refused `shape_superseded`. Every refusal is a `PlanRefusal` with no stage under `error.details.refusals` (code `PLAN_REFUSED`); a body the route cannot read — malformed JSON, a wrong type, an unknown field, an `after` missing half its position — answers the existing `UNREADABLE_PLAN` code with a bounded message, never the framework's plain-text rejection. A `GET` to the path answers `405`: the static segment is matched ahead of `GET /api/data-artifacts/{artifact_id}`.

The read runs through migration `20261106000000`: the counted set's body becomes `__temper_ungated_artifact_ask_rows`, which also takes a keyset position, a row limit and matched-only, and `__temper_ungated_artifact_ask_population` delegates to it at its unchanged signature, so `find-resources-with` and the trace's counts answer as before. New gated functions `artifacts_matching_ask` (a page) and `artifact_ask_counts` (the first page's population) apply `resources_visible_to` themselves.

Who observes it: callers of the new route; the three SDKs and temperkb-client (`DataArtifactsClient::ask`, new request and response types, and the new refusal reason, which also appears in every `RefusalReason` schema); MCP clients, through the new read-only tool `ask_data_artifacts`, whose input schema is `AskRequest`'s, which relays the request unread, answers the page as compact JSON in one text block, and carries a refusal's list, `teaches` included, in the error's `data` (`run_query` now renders its refusals through the same code, unchanged); and `temper data-artifact ask` (`--ask <json|@file|->`, or `--shape` with repeatable `--where <predicate JSON>`; `--limit`; `--after <cursor JSON>`), whose JSON or TOON output carries the response and whose refusal, under the JSON format, carries the refusals in the error payload's `details`. The skill's data-artifacts guidance teaches asking on both arms, the enum refusal's route and the enumeration floor; the MCP tool reference counts the new tool. `ArtifactView.shape_state`'s documentation now says what the field carries.

Release relevance: signal-only. A new route, tool, command, client method and refusal reason; no existing request, route or response changes.
'''
