title    = "One artifact ask returns the matching artifacts themselves, whole, in bounded pages: `POST /api/data-artifacts/ask`, MCP `ask_data_artifacts` and `temper data-artifact ask`"
pr       = "self"
classes  = ["additive", "behavioral"]
surfaces = ["http", "clients", "mcp", "cli-stdout", "schema"]
status   = "signal-only"
body = '''
A new read, `POST /api/data-artifacts/ask` (operation `ask_data_artifacts`), takes `AskRequest { ask, limit?, after? }` and answers `AskResponse`: `shape` (the row the ask was validated against), `artifacts` (each an `ArtifactView` with its content whole, in `(created, id)` order; an artifact committed with no content carries no `content` field), `oversized` (in order, each matching artifact that does not fit the page's byte budget alone or nests too deeply for a page, named by id, resource and size, and read whole by id), `population` (an `ArtifactAskPopulation` on the first page, `null` on every continuation), `ordered_by: "created"`, `next` (an `ArtifactCursor`; only `null` ends the enumeration) and `amended_since` (a `ShapeSuccessor` when a continuation's pinned shape has been amended since the first page, else `null`). `population`, `next` and `amended_since` are always written and are required, nullable keys in the schema. `AskRequest`, `AskResponse`, `AskedShape`, `OversizedArtifact` and `AskOrder` are new OpenAPI components. `limit` counts the matching rows a page examines, served or oversized; absent, it is `ARTIFACT_DRAIN_PAGE_ROWS` (50), and 0 or above `MAX_ARTIFACT_PAGE_ROWS` (200) is refused with the new `RefusalReason` `page_limit_out_of_range`, beside any refusal of the ask itself.

The byte budget bounds the whole page, not only its content, and it is held on the bytes the page writes. The page's SQL decides from an estimate: every row a page examines is charged — a served row its `content_bytes` plus its metadata (each text field it carries at the length of its JSON string, so a long family name is paid for on every row, plus a fixed per-row charge for its ids, numbers and keys), an oversized row the fixed charge. The service then measures each served row as it writes it, because served content can be longer than its `content_bytes`: storage prints a number from 1e16 up to the 64-bit integer limits in full (`1e19`, committed as the five bytes `1e+19`, is served as twenty). A row longer than the budget alone is named in `oversized` in its place, with its stored `content_bytes`, and so is a row whose content nests more than 96 arrays or objects deep, the most the strictest first-party client (the generated Ruby SDK, under Ruby's default nesting limit) parses on a page. A read by id is held to neither bound: a client's own nesting limit can refuse it, and on the hosted deployment it is refused when the content, as storage serves it, is longer than the platform's response cap, which content committed within the request cap can reach through the numbers storage reprints. The route, the DTO docs, the MCP tool, the CLI's help and the skill say so; the stored-form mismatch behind it is carried by the task *A data artifact's stored content re-reads with the length and hash it was committed with*. A row that fits the budget alone but not what is left of the page ends the page, with `next` at the last row kept, and opens the next. A page is also bounded in what it reads to find its rows: each candidate is charged its `content_bytes` plus a fixed per-candidate charge, the first is always read, and once the charge before a candidate reaches the read budget the page ends at the last candidate it read, matched or not, and answers `next` there — so a page can carry no artifacts and a non-null `next`. The earliest of the row limit, the byte budget and the read budget ends a page. The first page's `population` is not under the read budget: it is the ask's exact counts over the whole counted set, which match every governed artifact of the home. A continuation is validated against the same shape row as its first page even after that row is folded, but each row's `shape_state`, and any `shape_states` narrowing, are read against the version now in force (`amended_since`), so an ask narrowed by `shape_states` should start again from a first page when `amended_since` appears; a first page (no `after`) naming a folded row is still refused `shape_superseded`. Every refusal is a `PlanRefusal` with no stage under `error.details.refusals` (code `PLAN_REFUSED`); a body the route cannot read — malformed JSON, a wrong type, an unknown field, an `after` missing half its position, or an `after` whose `created` is before the first instant the store holds — answers the existing `UNREADABLE_PLAN` code with a bounded message, never the framework's plain-text rejection or a server fault. A `GET` to the path meets the route's caller checks first: `401` without credentials, `403` without system access, and `405` to a caller with both, because the static segment is matched ahead of `GET /api/data-artifacts/{artifact_id}`.

The read runs through migration `20261106000000`: the counted set's body becomes `__temper_ungated_artifact_ask_rows`, which also takes a keyset position, a row limit, matched-only and a read budget (a matched-only call without a read budget raises), and `__temper_ungated_artifact_ask_population` delegates to it at its unchanged signature with no read budget, so `find-resources-with` and the trace's counts answer as before. New gated functions `artifacts_matching_ask` (a page) and `artifact_ask_counts` (the first page's population) apply `resources_visible_to` themselves.

Who observes it: callers of the new route; the three SDKs and temperkb-client (`DataArtifactsClient::ask`, new request and response types, and the new refusal reason, which also appears in every `RefusalReason` schema); MCP clients, through the new read-only tool `ask_data_artifacts`, whose input schema is `AskRequest`'s, which relays the request unread, answers the page as compact JSON in one text block, and carries a refusal's list, `teaches` included, in the error's `data` (`run_query` now renders its refusals through the same code, unchanged); and `temper data-artifact ask` (`--ask <json|@file|->`, or `--shape` with repeatable `--where <predicate JSON>`; `--limit`; `--after <cursor JSON>`), whose JSON or TOON output carries the response and whose refusal, under the JSON format, carries the refusals in the error payload's `details`. The skill's data-artifacts guidance teaches asking on both arms, the enum refusal's route and the enumeration floor; the MCP tool reference counts the new tool. `ArtifactView.shape_state`'s documentation now says what the field carries, and `ArtifactView.content`'s that it is absent, not `null`, for an artifact with no content.

Two existing doors change what they answer, without a shape change. A commit (`POST /api/resources/{id}/artifacts`, MCP `commit_data_artifact`, `temper data-artifact commit`) whose content holds U+0000 in a string or an object key, or whose `kind` holds it, and a shape declaration (`POST /api/contexts/{id}/shapes` and `POST /api/cognitive-maps/{id}/shapes`, MCP `declare_data_artifact_shape`, `temper data-artifact schema declare`) whose `schema` or `kind` holds it, are refused before anything is stored, as `DATA_ARTIFACT_REFUSAL` (400) naming the field and never quoting the value; the MCP tools carry it as `invalid_params`. Postgres stores no U+0000, so such a request was never stored: it reached the database and answered a 500 `INTERNAL_ERROR`. The ask door's own check (`unstorable_value`) is the same one. And the generated Ruby SDK writes every `date-time` it sends, in a body or a query parameter, as RFC 3339 to the microsecond (`2026-10-25T09:58:12.123456Z`), where it wrote Ruby's `Time#to_s` (`2026-10-25 09:58:12 UTC`), which dropped the sub-seconds and is not RFC 3339: an `AskResponse.next` passed back as `after` names the row the server named, and a `Time` given as `list_artifacts`' `after_created` is read. The contract's two request-side `date-time` fields are those: `ArtifactCursor.created` in `AskRequest.after`, and `after_created` on `GET /api/resources/{id}/artifacts`. A string a caller passes is sent as it is, as before. The patch is hand-written in the gem (`lib/temper/wire_time.rb`), outside the generated core, so a regeneration keeps it.

Release relevance: signal-only. A new route, tool, command, client method and refusal reason. Of the existing doors, only answers that were a 500 change, to a typed 400 refusal, and the Ruby SDK's request timestamps change to the form the contract declares; no request or response shape changes.
'''
