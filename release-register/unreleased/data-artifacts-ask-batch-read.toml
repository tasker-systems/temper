title    = "One artifact ask returns the matching artifacts themselves, whole, in bounded pages: `POST /api/data-artifacts/ask`, MCP `ask_data_artifacts` and `temper data-artifact ask`"
pr       = "self"
classes  = ["additive"]
surfaces = ["http", "clients", "mcp", "cli-stdout", "schema"]
status   = "signal-only"
body = '''
A new read takes `AskRequest { ask, limit?, after? }` and answers `AskResponse`: `shape` (the row the ask was validated against), `artifacts` (each an `ArtifactView` with its content whole, in `(created, id)` order), `oversized` (in order, each matched artifact whose content alone exceeds the page's content budget, named by id, resource and size and fetchable by id), `population` (an `ArtifactAskPopulation` on the first page, `null` on every continuation), `ordered_by: "created"`, `next` (an `ArtifactCursor`, `null` on the last page) and `amended_since` (a `ShapeSuccessor` when a continuation's pinned shape has been amended since the first page, else `null`). `limit` counts the matched rows a page examines, served or oversized; absent, it is `ARTIFACT_DRAIN_PAGE_ROWS`, and 0 or above `MAX_ARTIFACT_PAGE_ROWS` is refused with the new `RefusalReason` `page_limit_out_of_range`, beside any refusal of the ask itself. A row that fits the content budget alone but not what is left of the page ends the page and opens the next. A continuation is validated against the same shape row as its first page even after that row is folded; a fresh ask naming a folded row is still refused `shape_superseded`. Every refusal is a `PlanRefusal` with no stage, under `error.details.refusals`.

The read runs through migration `20261106000000`: the counted set's body becomes `__temper_ungated_artifact_ask_rows`, which also takes a keyset position, a row limit and matched-only, and `__temper_ungated_artifact_ask_population` delegates to it at its unchanged signature, so `find-resources-with` and the trace's counts answer as before. New gated functions `artifacts_matching_ask` (a page) and `artifact_ask_counts` (the first page's population) apply `resources_visible_to` themselves.

Who observes it: callers of the new route and the three SDKs (new request and response types, and the new refusal reason, which also appears in every `RefusalReason` schema), MCP clients (a new tool), and `temper data-artifact ask`, whose JSON or TOON output carries the response. The skill's data-artifacts guidance teaches asking. `ArtifactView.shape_state`'s documentation now says what the field carries.

Release relevance: signal-only. A new route, tool, command and refusal reason; no existing request, route or response changes.
'''
