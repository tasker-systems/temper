title    = "`find-resources-with` selects resources by what their data artifacts hold, through `artifact_filter` on every door"
pr       = "self"
classes  = ["additive"]
surfaces = ["http", "clients", "mcp", "cli-stdout", "schema"]
status   = "signal-only"
body = '''
`ActInvocation` gains `artifact_filter`, a list of artifact asks, defaulted and skipped when empty, and `find-resources-with` admits it beside `resource_filter`. Each ask names a data-artifact shape by id and predicates over the paths that shape declares; a resource is selected when, for every ask, one of its live artifacts satisfies all of that ask's predicates. Every other act refuses a non-empty `artifact_filter` with `filter_not_applicable`. `POST /api/query` loads the shapes a plan's asks name before its gate, so an ask outside its shape, a shape the caller cannot read (answered exactly as an absent one, `shape_not_askable`), or `include_folded: true` is refused before anything runs, in the existing `PLAN_REFUSED` 400 with `teaches`. Two additive wire members ride with it: the refusal reason `unstorable_value` (a predicate value holding U+0000, which no stored content can hold), and `RefusalTeaching.homes`, a list of `ShapeHome` (`anchor_table`, `anchor_id`) naming the homes an `ask_scope_conflict` involves; an older client reads the first as an unknown reason and skips the second. A stage that repeats an ask is refused `duplicate_set_member` — by the server only, as `include_folded` is: two asks are the same when they validate to the same bind, which needs the loaded shape, so `--check` cannot decide it. A selection that asked names each ask's shape in its trace's `narrowed_by` (`artifact_shape`), as it names every other narrowing it applied. A plan carrying no asks validates, compiles and answers as before.

Who observes it: callers of `POST /api/query` and the three SDKs (the request schema grows the field), MCP `run_query` (its input schema grows the field, and its description now names `artifact_filter`, the `survey` act, and the refusals in error `data`), and `temper query`, whose `--check` report gains `shapes_not_checked` (always present; empty when a plan asks nothing) and a longer disclosure. `include_folded` is refused by the server and not by `--check`, since serving it is a server capability. The schema migration `20261104000000` adds a 14-argument `__temper_ungated_find_resources_with`, a 13-argument `query_find_resources_with`, the counted set `__temper_ungated_artifact_ask_population` and value-taking forms of the two governance relations, re-points the incumbent arities to delegate with no asks, and re-points the by-id governance relations to delegate to their value-taking forms; no deployed binary's call changes its answer.

Same-release partner: `query-trace-discloses-artifact-population`. Between them an empty composable stage reads as one of three things — nothing governed in what you can see, governed but unmatched, or narrowed by verdict state while reconciliation lags — and that entry's per-ask population disclosure is what tells them apart, so this entry must not ship without it.

Release relevance: signal-only. Additive fields, an additive `--check` field, and new functions. Not declared `behavioral`: the `--check` disclosure string grows one sentence on every report, but for a plan that asks nothing that sentence is vacuously true and the report means what it meant; every other existing response is unchanged for a request that does not use the new field.
'''
