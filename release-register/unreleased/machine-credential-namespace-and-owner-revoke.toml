title    = "A machine is never registered under a client id temper mints, and a team owner's revoke stops at the credential"
pr       = "self"
classes  = ["behavioral"]
surfaces = ["http"]
status   = "signal-only"
body = '''
`POST /api/machine-clients` (provision) and `POST /api/machine-clients/{id}/rebind` now refuse a
`client_id` beginning `conn_` or `tmpr_` with a 400 naming the id. Those are the namespaces temper's
own Authorization Server mints into: DCR clients and temper-issued machine credentials. The machine
gate looks a machine up by client id alone, so a machine registered under a DCR client's id would
have received every token issued to that client. Production held no such row.

`DELETE /api/machine-clients/{id}` called by the owner of the machine's team, who is not a system
admin, now revokes the login credential only. It no longer also revokes the machine's standing,
which is an admin act. A system admin's revoke still does both. Who observes: a team owner revoking
a machine (its standing stays as an admin set it, and admits nothing while every credential is
dead) and anyone provisioning under those prefixes. Release relevance: behavioral.
'''
