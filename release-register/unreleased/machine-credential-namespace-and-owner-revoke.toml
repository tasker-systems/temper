title    = "A machine is never registered under a client id temper mints, and only an admin's revoke of a machine's last credential revokes its standing"
pr       = "self"
classes  = ["additive", "behavioral"]
surfaces = ["http", "schema"]
status   = "signal-only"
body = '''
`POST /api/machine-clients` (provision) and `POST /api/machine-clients/{id}/rebind` now refuse a
`client_id` beginning `conn_` or `tmpr_` with a 400 naming the id. Those are the namespaces temper's
own Authorization Server mints into: DCR clients and temper-issued machine credentials. The machine
gate looks a machine up by client id alone, so a machine registered under a DCR client's id would
have received every token issued to that client. Migration 20261029100000 adds the same separation
as CHECK constraints on kb_machine_clients and kb_oauth_dcr_clients, and refuses to apply over a row
that already breaks it. Production held no such row.

`DELETE /api/machine-clients/{id}` now changes the machine's standing only when a system admin
revokes the profile's last live credential. A team owner's revoke kills the credential only:
revoking standing is an admin act. An admin's revoke inside a rebind overlap window
(`--no-revoke-old`) leaves standing alone, so the surviving credential stays admitted; before, it
was cut off too. To shut out a machine that still holds two live credentials, revoke both, or run
`temper admin access revoke` on its profile. Who observes: admins and team owners revoking machine
credentials, and anyone provisioning under those prefixes. Release relevance: additive (the
constraints), behavioral (the refusals and the revoke change).
'''
