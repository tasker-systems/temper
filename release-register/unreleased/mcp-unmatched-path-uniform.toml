title    = "temper-mcp answers an unmatched path outside its discovery and OAuth families with temper-api's uniform 401"
pr       = "self"
classes  = ["behavioral"]
surfaces = ["mcp"]
status   = "signal-only"
body = '''
What changed: temper-mcp's fallback. An unmatched path answered the structured 404 everywhere.
Outside the discovery and OAuth families (any path not under /.well-known/ or /oauth/, and not
/mcp or under it, which the door's nested service takes) it now answers the pre-identity refusal
temper-api answers: 401, the same ApiError::Unauthenticated render, so the same body bytes. It is
the refusal whoever asks, a validly signed bearer included: this surface resolves no profile.
Unmatched paths under /.well-known/ and /oauth/ keep the 404 (RFC 8615, and MCP clients' discovery
fallback). /mcp keeps its edge 401 with WWW-Authenticate; discovery, /oauth/register and
/mcp/health are unchanged.

Who observes it: a caller of a path no MCP client uses, such as the function's own edge path
/api/mcp, or a case variant of a door (/MCP, /OAUTH/register) if the platform matches routes
without regard to case. Those were the MCP 404 and are now the 401 temper-api gives the same
caller, so an unauthenticated caller can no longer tell them from temper-api's paths. No
first-party client calls them; the documented MCP URL is /mcp.

Why behavioral: no shape moved; the status and body of one class of answer changed. Review-owned.

Witnesses: crates/temper-mcp-server/tests/unmatched_fallback_test.rs (the bytes against the
render and the pinned literal on every method, with and without a valid bearer; the families'
404s including the MCP discovery probes; the /mcp challenge; the OPTIONS residue).
Release relevance: signal-only.
'''
