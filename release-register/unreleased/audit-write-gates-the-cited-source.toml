title    = "Recording a citation audit requires read on the cited source as well as the finding"
pr       = "self"
classes  = ["behavioral"]
surfaces = ["http", "mcp"]
status   = "signal-only"
body = '''
`AuditAuthority` now asks `readback::is_resource_visible` about the cited source after the finding,
through the same predicate. A caller who can read the finding but not the source is refused with the
same `404` and the same `FINDING_REFUSAL` body as every other finding-shaped refusal, so the
response carries nothing a caller could not already learn. The admitting arm is unchanged for a
caller who reads both.

This matches the auditor's queue, which since `20261101400000` offers only citations whose source
the principal can read. The auditor's instructions now say to write no verdict for an entry whose
source does not resolve.

Who observes: callers of `POST /api/resources/{id}/citation-audits`, `POST /api/citation-audits`,
and the `record_citation_audit` tool. Request and response shapes are unchanged; no migration and no
`openapi.json` movement. Witnesses:
`a_reader_of_the_finding_who_cannot_read_the_source_is_refused` (`authz/audit_gate.rs`) and
`posting_when_the_cited_source_is_unreadable_returns_404` plus the byte-identical refusal set in
`crates/temper-api/tests/citation_audit_handler_test.rs`. Release relevance: signal-only; rides
0.6.1.
'''
