title    = "A webhook attestation repeated within ten seconds of its first acceptance is a burst, not a replay"
pr       = "self"
classes  = ["additive", "behavioral"]
surfaces = ["http", "schema"]
status   = "signal-only"
body = '''
Refines the attestation binding described in `webhook-attestation-binding.toml`, in the same
release. Connect sends one attestation for several distinct deliveries sent close together (a
merge-queue merge's `pull_request` `closed` and `dequeued`), so a repeat within ten seconds of the
attestation's first acceptance is recorded and logged (`repeated within its burst window`) as part
of the burst. A later repeat is a replay: refused once `VERCEL_CONNECT_ENFORCE_ATTESTATION_BINDING` is
set, otherwise logged with `reason = replayed` and `age_secs`. Migration 20261031100000 adds
`first_seen_at`, with a default, to `kb_inbound_attestations_seen`. Request and response shapes are
unchanged. Who observes: an operator who sets the variable, or who counts `replayed` log lines
before setting it. Release relevance: additive (the column), behavioral (the window).
'''
