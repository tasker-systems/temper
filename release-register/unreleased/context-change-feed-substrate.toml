title    = "The ledger records the order its events were committed in, and a context's changes can be read after a position"
pr       = "self"
classes  = ["additive"]
surfaces = ["schema"]
status   = "signal-only"
body = '''
Migration 20261116000010 adds two nullable kb_events columns: xact_id, the writing transaction's id,
and seq, the append order. Column defaults fill both, so no inserter changes, and rows written before
the migration keep NULL. A BEFORE INSERT trigger refuses a new row whose order is missing or names
another transaction, except under replay. The new function context_changes_after(profile, context,
position, bound, kinds) returns a context's domain changes after a position. It serves only settled
rows, so a later commit never lands behind a position already passed. Each entry is withheld unless
the reader can read its subject now: a resource (the soft-delete floor included), an edge's home and
both endpoints, a blob. No surface calls the function yet; the HTTP, CLI and MCP doors come in a later
change. Who observes: nobody, until those doors ship. Release relevance: additive (schema only).
'''
