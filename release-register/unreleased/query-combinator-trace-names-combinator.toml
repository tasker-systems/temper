title    = "A combinator stage's trace names its combinator, never admit, and carries a typed combinator field"
pr       = "self"
classes  = ["additive", "behavioral"]
surfaces = ["http", "mcp", "cli-stdout", "clients", "schema"]
status   = "signal-only"
body = '''
What changed: a `union`, `intersect` or `difference` stage's entry in a query response's
`trace.stages` now reads `"act": "union"` (or `"intersect"`, `"difference"`), the combinator's
request spelling, where it read `"act": "admit"`, the registry's declared anti-act. A new optional
field `combinator` carries the same op, typed as `CombineOp`; it is absent on every act stage.

Who observes: any reader of a query response's trace over POST /api/query, the MCP query tool and
`temper query`. A reader that read `act` to know what ran now sees the combinator, not the
anti-act; the UI's trace readout shows the combinator's name. A reader that branched on
`act == "admit"` to find a combinator stage should branch on `combinator` instead.

Why additive + behavioral (ruling 32, decision 01a21d95-1e3d-70bb-a01f-c3b2d3e9e658): no declared
shape moves. `act` stays required and stays an `ActName`, which is open (a plain-string arm), so the
three names parse on every client; inside Rust they are `ActName::Other(..)`, outside the act
vocabulary. `combinator` is one new optional field (openapi.json, the three SDKs, the ts-rs tree,
the query JSON-Schema snapshots); a trace without it reads back as absent. The behavioral half is
the value of `act` on a combinator stage. Witnesses:
`a_combinator_stage_names_its_combinator_never_admit`
(crates/temper-api/tests/query_combinator_trace_test.rs, which fails against the `admit` label) and
`the_combinator_key_is_absent_on_an_act_stage_and_names_the_op_on_a_combinator_stage` (temper-core
trace tests). Release relevance: signal-only.
'''
