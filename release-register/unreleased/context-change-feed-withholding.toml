title    = "The context change feed serves an edge only while the reader can read both its endpoints, and never serves a connection's traffic"
pr       = "self"
classes  = ["behavioral"]
surfaces = ["http", "mcp", "cli-stdout", "schema"]
status   = "signal-only"
body = '''
context_changes_after (replaced by 20261117000020, signature unchanged) withholds two things a
context reader could not learn through any other door:
- An entry whose subject is an edge (relationship_* kinds and edge-owned property_* kinds) is served
  only when both endpoints are readable by the reader now, by edges_visible_to's per-endpoint rule.
  Before, the feed named an edge whose endpoint the reader cannot read, from its birth, with every
  later change, its actor, time and liveness, though every edge door denies such an edge exists.
  A fold of a visible edge is still served. An edge whose endpoint has since left the reader's view
  is withheld for its whole history; when that endpoint lived in the context, its own departure
  is still served.
- A connection's traffic, webhook_received and subscription_delivery_disposed, is never served.
  Naming either in `kinds` is refused as an unknown kind (400), as admin kinds are.
  _feed_withholds_kind(text) is the one definition both use.
Resources, blocks and blobs are not filtered, so departures stay served. Both filters run before the
page bound, so `has_more`/`through` count only what is served.
- One read scans at most 10,000 of the context's events past its position (_feed_scan_budget()).
  When that runs out before the page fills, the page is short, `has_more` is true, and `through` is
  the last event scanned. Below the budget a page is never short. Without the budget, a writer who
  made many hidden edges made every other reader's read scan all of them.

Who observes it: a reader of a context that homes an edge to something they cannot read, or that is
a connection's home. Fewer entries, never different ones. openapi.json is unchanged.
Witnesses: crates/temper-substrate/tests/context_change_feed.rs
(an_edge_is_served_only_while_the_reader_can_read_both_endpoints,
an_edge_to_an_unreadable_cogmap_or_blob_is_withheld, a_page_is_never_short_for_what_it_withholds,
a_connections_traffic_is_no_change_to_the_context),
crates/temper-services/tests/context_change_doors_test.rs.
Release relevance: disclosure narrowing on a read surface shipped in the same unreleased window.
'''
