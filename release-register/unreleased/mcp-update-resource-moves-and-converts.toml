title    = "MCP update_resource takes context_to and type_to, so an MCP caller can move a resource between contexts or convert its type, as the CLI can"
pr       = "self"
classes  = ["additive", "behavioral"]
surfaces = ["mcp"]
status   = "signal-only"
body = '''
What changed: update_resource's input gains two optional fields, context_to (a context ref:
@owner/slug, +team/slug or a UUID) and type_to (a doc-type name). Both are forwarded to
PATCH /api/resources/{id}, which already carried them for the CLI's --context-to and --type-to.
Before, the tool sent both as None, so a move or a conversion asked through MCP did nothing.

Refusals: a bare context name is the server's 400, naming the input. A destination the caller can
read but not write is the server's 403, which this tool renders as invalid_params, the kind it gives
every 403. When the call carried context_to, that refusal's sentence also names the destination as a
possible cause. Without context_to, the sentence is unchanged. An unknown type_to is refused before
the write with the CLI's own parse ("type_to: unknown doctype ..."). update_resource_meta stays
meta-only, as its description now says.

Who observes: MCP callers that send context_to or type_to. Before, those fields were ignored with no
error; now they act. Witnesses, each failing on the prior main:
tests/e2e/tests/mcp_update_resource_move_e2e.rs. Release relevance: signal-only.
'''
