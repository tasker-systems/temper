title    = "The public_within machine fence asks the shared machine test (is_machine_profile) instead of its own copy"
pr       = "self"
classes  = ["additive"]
surfaces = ["internal"]
status   = "signal-only"
body = '''
public_within_reading, the predicate that keeps machine principals from reading through
public_within, now answers "is this profile a machine?" by calling is_machine_profile, the one
machine test the caller classification and the machine-role triggers already share, instead of its
own inline lookup of kb_machine_clients (migration 20261123100000). Its search_path is pinned.

Same signature and the same answer for every profile: is_machine_profile is exactly the lookup it
replaces. The human-link clause and the connection-agent exclusion are unchanged. No table, column,
row, route or response shape changes, and no principal gains or loses reach.

The one test suffices because its set is closed: a client_credentials token signs in only through
an unrevoked machine-client row (a dynamically registered client has none and is refused before
any profile exists), and a client row is never deleted or moved to another profile.

Who observes: nobody, by design; a later change to the machine test now moves the fence with it.
Cost: the read arm still calls the fence only once a public_within row is anchored in the caller's
closure, so a read with no such row costs what it did. Each fence call costs about 2 microseconds
more (it now runs the shared function), paid once per read with a candidate row, once per team view
and once per member counted for a row's audience.
Witnesses: crates/temper-services/tests/public_within_fence_test.rs (every machine shape fenced,
the machine test and the connection exclusion each deciding alone, a person reading, and a guard
that fails if the fence stops calling the shared test) and profile_service's refusal of a
dynamically registered client. Release relevance: none beyond the migration; signal-only.
'''
