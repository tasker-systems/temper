# cargo-audit configuration — https://github.com/rustsec/rustsec/tree/main/cargo-audit
#
# The `cargo audit` step in .github/workflows/code-quality.yml is BLOCKING (no
# continue-on-error). An advisory gate that can never fail is decorative — a PR
# tripling the crypto surface would pass an audit that cannot report it. So the
# gate fails the build on any NEW advisory, and this file is the ONLY escape
# hatch: a short, reviewed ignore list, each entry justified.
#
# ── Rules for this list ────────────────────────────────────────────────────
#   * Every id needs a one-line reason AND a status: UNFIXABLE, or FIX-PENDING
#     (a patched version exists but adopting it is its own change — a dep bump
#     that may cross a semver-major and must be validated against the full
#     DB-backed suite, so it does not ride this quality-of-life PR).
#   * When a FIX-PENDING dep is bumped, DELETE its line here — do not leave a
#     stale ignore. cargo audit reports ignores that no longer match, so a dead
#     entry is visible.
#   * Adding an id is a security decision. It belongs in review, not in a rush
#     to green a build. Warnings (unmaintained / yanked / unsound) are NOT
#     ignored here — cargo audit does not fail the build on them by default, so
#     they stay visible as advisories without gating.
#
# Snapshot when this list was written: `cargo audit` reported 10 vulnerabilities
# (1 unfixable, 9 fix-pending) + 13 informational warnings.

[advisories]
ignore = [
    # ── UNFIXABLE, and NOT LINKED — a lockfile artifact ──────────────────────
    # rsa: Marvin timing side-channel, with no released fix in any `rsa` version.
    # Crucially it is NOT actually compiled into temper: `rsa` is a dependency of
    # `sqlx-mysql` ONLY, and we enable sqlx's `postgres` backend and no other, so
    # `cargo tree -i rsa` reports it unreachable. It survives in Cargo.lock
    # because Cargo records the full resolution graph (mysql included) and
    # `cargo audit` scans the lock rather than the feature-resolved build graph.
    # A sqlx version bump does NOT drop it (it is sqlx-mysql's optional dep,
    # present whenever sqlx resolves its mysql backend). So: no real exposure, no
    # available fix, no clean way to evict it from the lock — the textbook case
    # for a permanent, documented ignore. This is the standing "we can't control
    # it", and the ignore is exactly what keeps the gate from blocking on it.
    "RUSTSEC-2023-0071",

    # ── FIX-PENDING — a patched version exists; adopting it is a tracked bump ─
    # crossbeam-epoch 0.9.18 → >=0.9.20 (invalid-pointer deref in Debug impl).
    "RUSTSEC-2026-0204",
    # lopdf 0.40.0 → >=0.42.0 (stack overflow on deeply nested PDF objects).
    "RUSTSEC-2026-0187",
    # quick-xml 0.39.4 → >=0.41.0 (quadratic duplicate-attr check) — crosses a
    # 0.x-major, may need a direct-dep edit.
    "RUSTSEC-2026-0194",
    # quick-xml 0.39.4 → >=0.41.0 (unbounded namespace-decl allocation, DoS).
    "RUSTSEC-2026-0195",
    # quinn-proto 0.11.14 → >=0.11.15 (remote memory exhaustion, transitive
    # under the HTTP stack).
    "RUSTSEC-2026-0185",
    # rmcp 1.3.0 → >=1.4.0 (DNS-rebinding in the Streamable-HTTP server
    # transport) — the MCP server surface; bump + re-test the MCP handlers.
    "RUSTSEC-2026-0189",
    # rustls-webpki 0.103.10 → >=0.103.12 (name constraints wrongly accepted for
    # a wildcard name), transitive under rustls.
    "RUSTSEC-2026-0099",
    # rustls-webpki 0.103.10 → >=0.103.13 (reachable panic parsing a CRL).
    "RUSTSEC-2026-0104",
    # rustls-webpki 0.103.10 → >=0.103.12 (URI-name name constraints wrongly
    # accepted).
    "RUSTSEC-2026-0098",
]
