# cargo-audit configuration — https://github.com/rustsec/rustsec/tree/main/cargo-audit
#
# The `cargo audit` step in .github/workflows/quality-gate.yml is BLOCKING (no
# continue-on-error). An advisory gate that can never fail is decorative — a PR
# tripling the crypto surface would pass an audit that cannot report it. So the
# gate fails the build on any NEW advisory, and this file is the ONLY escape
# hatch: a short, reviewed ignore list, each entry justified.
#
# ── Rules for this list ────────────────────────────────────────────────────
#   * Every id needs a one-line reason AND a status: UNFIXABLE, or FIX-PENDING
#     (a patched version exists but adopting it is its own change — a dep bump
#     that may cross a semver-major and must be validated against the full
#     DB-backed suite, so it does not ride this quality-of-life PR).
#   * When a FIX-PENDING dep is bumped, DELETE its line here — do not leave a
#     stale ignore. cargo audit reports ignores that no longer match, so a dead
#     entry is visible.
#   * Adding an id is a security decision. It belongs in review, not in a rush
#     to green a build. Warnings (unmaintained / yanked / unsound) are NOT
#     ignored here — cargo audit does not fail the build on them by default, so
#     they stay visible as advisories without gating.
#
# Last reconciled 2026-11-09 (cargo audit 0.22.2, advisory DB 899077d9 of
# 2026-11-09): with no ignores, cargo audit reports exactly the five ids below.
# RUSTSEC-2026-0462 (rmcp) is not among them: rmcp is now 3.9.0, the fixed
# version. Reconciled before that on 2026-10-31, when zip (0367/0368/0369, lock
# now zip 9.0.5), lopdf (0187, now 0.45.0), quinn-proto (0185, now 0.11.19) and
# webpki-roots (0381 — the advisory lists the 0.26.11 shim as unaffected) were
# removed as matching nothing.

[advisories]
ignore = [
    # ── UNFIXABLE, and NOT LINKED — a lockfile artifact ──────────────────────
    # rsa: Marvin timing side-channel, with no released fix in any `rsa` version.
    # Crucially it is NOT actually compiled into temper: `rsa` is a dependency of
    # `sqlx-mysql` ONLY, and we enable sqlx's `postgres` backend and no other, so
    # `cargo tree -i rsa` reports it unreachable. It survives in Cargo.lock
    # because Cargo records the full resolution graph (mysql included) and
    # `cargo audit` scans the lock rather than the feature-resolved build graph.
    # A sqlx version bump does NOT drop it (it is sqlx-mysql's optional dep,
    # present whenever sqlx resolves its mysql backend). So: no real exposure, no
    # available fix, no clean way to evict it from the lock — the textbook case
    # for a permanent, documented ignore. This is the standing "we can't control
    # it", and the ignore is exactly what keeps the gate from blocking on it.
    "RUSTSEC-2023-0071",

    # libsqlite3-sys 0.30.1 (RUSTSEC-2026-0459, the C SQLite CVE it bundles; fixed in >=0.39.0).
    # Not compiled into temper: it is a dependency of `sqlx-sqlite` only, and we enable sqlx's
    # `postgres` backend and no other, so `cargo tree -i libsqlite3-sys --workspace --all-features
    # --target all` reports nothing. It survives in Cargo.lock the way `rsa` does: Cargo records
    # sqlx's full resolution graph and `cargo audit` scans the lock. A sqlx bump does not evict or
    # fix it: the newest sqlx (0.9.0) has `sqlx-sqlite` require libsqlite3-sys >=0.30.1, <0.38.0,
    # so no released sqlx reaches 0.39.0. No real exposure, and the fix is unreachable from any
    # released sqlx: a standing ignore, until a sqlx release admits libsqlite3-sys >=0.39.0.
    "RUSTSEC-2026-0459",

    # ── FIX-PENDING — a patched version exists; adopting it is a tracked bump ─
    # Reachability below is read from Cargo.lock and each crate's declared
    # features, not from a `cargo tree -i` run.
    #
    # crossbeam-epoch 0.9.18 → >=0.9.20 (invalid-pointer deref in the
    # `fmt::Pointer` / `fmt::Display` impls of `Atomic` and `Shared`; `Debug` is
    # unaffected). LINKED into the deployed server: temper-substrate and
    # temper-services enable temper-ingest's `embed`, whose `tokenizers` takes
    # `rayon` unconditionally → rayon-core → crossbeam-deque → crossbeam-epoch.
    # Also in the CLI (the same path, plus kreuzberg and toon-format → arboard →
    # image). The affected impls are NOT CALLED: crossbeam-deque is the only crate
    # in the lock that depends on crossbeam-epoch, and it never formats an
    # `Atomic` or `Shared` (its Debug impls print fixed strings); no temper crate
    # depends on crossbeam-epoch directly.
    "RUSTSEC-2026-0204",
    # quick-xml 0.39.4 → >=0.41.0 (quadratic duplicate-attr check) — crosses a
    # 0.x-major, may need a direct-dep edit. CLI ONLY, never in a deployed
    # binary: its single dependent is plist ← syntect ← toon-format, whose
    # default `cli` feature temper-cli enables. NOT CALLED: temper-cli uses only
    # `toon_format::encode_default` / `decode_default`, and toon-format's source
    # never calls syntect, so syntect's plist theme loading (the only XML parse)
    # never runs.
    "RUSTSEC-2026-0194",
    # quick-xml 0.39.4 → >=0.41.0 (unbounded namespace-decl allocation in
    # `NsReader`, DoS). Same crate and path as RUSTSEC-2026-0194: CLI only, not
    # called.
    "RUSTSEC-2026-0195",
]
