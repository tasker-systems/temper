<!doctype html>
<html lang="en" data-theme="quiet-instrument">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<link rel="icon" href="%sveltekit.assets%/favicon.svg" />
		<title>temper — a knowledge base for builders</title>
		<meta property="og:title" content="temper — clarify your intention" />
		<meta property="og:description" content="Know what was decided, what's deferred, and what comes next. Every session builds on the last. Temper your context." />
		<meta property="og:type" content="website" />
		<meta property="og:url" content="https://temperkb.io" />
		<meta name="twitter:card" content="summary_large_image" />
		<meta name="twitter:title" content="temper — clarify your intention" />
		<meta name="twitter:description" content="Know what was decided, what's deferred, and what comes next. Every session builds on the last. Temper your context." />
		<!-- Fonts are self-hosted (@fontsource-variable, imported in +layout.svelte):
		     no third-party font origin, so no IP/User-Agent egress on page load. -->
		<!-- The reader follows the system's appearance and the server cannot know it: the root
		     carries the light candidate ($lib/theme), and this picks it before first paint so a
		     light reader never sees dark. It runs only when that candidate is present. -->
		<script nonce="%sveltekit.nonce%">
			(function () {
				var root = document.documentElement;
				var light = root.getAttribute('data-theme-light');
				if (light && matchMedia('(prefers-color-scheme: light)').matches) {
					root.setAttribute('data-theme', light);
				}
			})();
		</script>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
