[workspace]
resolver = "2"
members = ["crates/*", "tests/e2e"]

# Shared package metadata. `version` is the workspace's lockstep version: every
# member inherits it, so a release bumps exactly one line. The crates published
# to crates.io (the `temperkb-*` client closure) additionally inherit `license`
# and `repository`; everything else carries `publish = false` so server-side
# internals cannot reach the registry by accident.
[workspace.package]
version = "0.6.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/tasker-systems/temper"

# The client closure, published to crates.io under the temperkb- prefix. Dependency
# specs cannot inherit [workspace.package] fields, so the version is spelled here —
# bump it TOGETHER with [workspace.package].version; the publish script's
# version-agreement guard fails the release if the two disagree.
#
# temperkb-client is declared WITHOUT its default `telemetry` feature so a published dependent
# (temperkb-mcp) can carry the opt-out through to its own consumers; a member that wants the
# client's trace-context propagation names `features = ["telemetry"]` itself. temperkb-mcp is
# the tool layer, publish-ready but not yet in publish-crates.sh's lane: its name is claimed
# by a one-time local publish before a trusted publisher can attach (see that script's header).
[workspace.dependencies]
temperkb-auth = { path = "crates/temper-auth", version = "0.6.0" }
temperkb-client = { path = "crates/temper-client", version = "0.6.0", default-features = false }
temperkb-core = { path = "crates/temper-core", version = "0.6.0" }
temperkb-mcp = { path = "crates/temper-mcp", version = "0.6.0" }
temperkb-principal = { path = "crates/temper-principal", version = "0.6.0" }
temperkb-telemetry = { path = "crates/temper-telemetry", version = "0.6.0" }
temperkb-workflow = { path = "crates/temper-workflow", version = "0.6.0" }

[package]
name = "temper-cloud"
version.workspace = true
edition.workspace = true
description = "Vercel deployment adapter for temper-api"
publish = false

[[bin]]
name = "axum"
path = "api/axum.rs"

[[bin]]
name = "mcp"
path = "api/mcp.rs"

[[bin]]
name = "internal"
path = "api/internal.rs"

[dependencies]
temper-api = { path = "crates/temper-api" }
temper-services = { path = "crates/temper-services" }
temper-mcp-server = { path = "crates/temper-mcp-server" }
temperkb-telemetry.workspace = true
vercel_runtime = { version = "2", features = ["axum"] }
tokio = { version = "1", features = ["full"] }
tower = "0.5"
tracing = "0.1"
sqlx = { version = "0.8", features = ["postgres", "runtime-tokio-rustls"] }
