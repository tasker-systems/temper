[workspace]
resolver = "2"
members = ["crates/*", "tests/e2e"]

# Shared package metadata. `version` is the workspace's lockstep version: every
# member inherits it, so a release bumps exactly one line. The crates published
# to crates.io (the `temperkb-*` client closure) additionally inherit `license`
# and `repository`; everything else carries `publish = false` so server-side
# internals cannot reach the registry by accident.
[workspace.package]
version = "0.5.3"
edition = "2021"
license = "MIT"
repository = "https://github.com/tasker-systems/temper"

[package]
name = "temper-cloud"
version.workspace = true
edition.workspace = true
description = "Vercel deployment adapter for temper-api"
publish = false

[[bin]]
name = "axum"
path = "api/axum.rs"

[[bin]]
name = "mcp"
path = "api/mcp.rs"

[[bin]]
name = "internal"
path = "api/internal.rs"

[dependencies]
temper-api = { path = "crates/temper-api" }
temper-services = { path = "crates/temper-services" }
temper-mcp = { path = "crates/temper-mcp" }
temper-telemetry = { path = "crates/temper-telemetry" }
vercel_runtime = { version = "2", features = ["axum"] }
tokio = { version = "1", features = ["full"] }
tower = "0.5"
tracing = "0.1"
sqlx = { version = "0.8", features = ["postgres", "runtime-tokio-rustls"] }
