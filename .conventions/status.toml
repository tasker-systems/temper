# This repository's status for each baseline rule, in the register's vocabulary:
# gated: <path>[#job], partial: …, practiced, convention: …, uncovered, unexamined, n/a.
#
# Read from temper's own gates and tree (.github/workflows, .github/scripts, the configs), never
# from the register: the register's temper column is generated from this file. `gated` names the
# job whose step fails on a violation; the comment above each line is the evidence. Jobs in a
# reusable workflow are named in that file (quality-gate.yml, code-quality.yml, test-*.yml), all of
# which fan into `CI Success` in ci.yml.
#
# Adoption is in steps (audit-before-enforce): this step adopts deny.toml, .cargo/audit.toml,
# clippy.toml and ruff.toml. The Rust workspace lint table and the TypeScript configs are the next
# two; their rules read `uncovered` here until they land.
#
# `reviewed_at` is the baseline revision these statuses were reviewed against (check F).
reviewed_at = "af5ffd124e3f0b80d003cc11a3bb96031523eb48"
[rules]

# --- Rust ----------------------------------------------------------------------------------------
# No [workspace.lints] table and no member sets `[lints] workspace = true` (the next adoption step).
RUST-LINT-1 = "uncovered: no workspace lint table yet; adopting the canonical one is the next step"
# code-quality.yml clippy --workspace --all-targets --all-features -D warnings; cargo doc with RUSTDOCFLAGS=-D warnings.
RUST-LINT-2 = "gated: .github/workflows/code-quality.yml#rust-quality"
# 43 #[allow] (none with a reason) and 3 reasonless #[expect]; allow_attributes(_without_reason) arrive with the lint table.
RUST-LINT-3 = "uncovered: 43 #[allow] without a reason; the lints that refuse them arrive with the lint table"
RUST-LINT-4 = "convention: a review practice; the lint table's adoption is measured first (266 findings) and lands as its own change"
# No lint table: clippy runs its default groups, so there is no held-off group to open yet.
RUST-LINT-5 = "n/a: no lint table yet; clippy runs its default groups"
RUST-API-1 = "convention: whether a crate is a library or an application is judged in review"
# quality-gate.yml cargo fmt --all -- --check.
RUST-FMT-1 = "gated: .github/workflows/quality-gate.yml#rust-gate"
# wildcard_imports is held off in the canonical table; ~7 non-test glob imports.
RUST-ORG-1 = "uncovered: about 7 non-test glob imports; wildcard_imports is not enabled"
RUST-ORG-2 = "convention: file naming and module layout are judged in review"
# grep 'forbid(unsafe_code)' over the crate roots: 0 of 20.
RUST-UNSAFE-1 = "uncovered: no crate root declares #![forbid(unsafe_code)]"
# Production unsafe in temper-ingest (cpu.rs) and temper-cli (body_source.rs, commands/update.rs); no register or tripwire.
RUST-UNSAFE-2 = "uncovered: unsafe in temper-ingest and temper-cli is not a registered exception"
RUST-UNSAFE-3 = "n/a: no FFI bindings; the SDKs are generated HTTP clients"
# thiserror in the published library crates; anyhow only in the unpublished edges.
RUST-ERR-1 = "practiced"
RUST-ERR-2 = "convention: whether a default stands in for a required value is judged in review"
RUST-ERR-3 = "convention: panic-or-Result and # Panics docs are judged in review"
# unwrap_used is held off in the canonical table; ~10 non-test unwrap() sites.
RUST-ERR-4 = "uncovered: about 10 non-test unwrap() sites; unwrap_used is not enabled"
# No `panic =` in any profile; the one production catch_unwind observes and resumes.
RUST-PANIC-1 = "practiced"
# missing_debug_implementations arrives with the lint table (70 findings measured).
RUST-TYPE-1 = "uncovered: missing_debug_implementations is not enabled (70 types)"
RUST-TYPE-2 = "convention: newtype and enum-over-bool choices are judged in review"
RUST-API-2 = "convention: open versus closed sets are judged in review"
# should_implement_trait, new_without_default, len_without_is_empty, derivable_impls: default clippy groups, under -D warnings.
RUST-API-3 = "gated: .github/workflows/code-quality.yml#rust-quality"
# ptr_arg and borrowed_box: default clippy groups, under -D warnings.
RUST-API-4 = "gated: .github/workflows/code-quality.yml#rust-quality"
RUST-API-5 = "partial: wrong_self_convention fails under default clippy -D warnings; constructor and getter naming is review"
RUST-API-6 = "convention: where ignoring a value is a bug is judged in review"
# CI floats on stable (dtolnay/rust-toolchain@stable); no rust-version anywhere.
RUST-TC-1 = "uncovered: floats on stable but declares no rust-version"
# [workspace.package] edition, inherited by every member.
RUST-TC-2 = "practiced"
# CI builds on stable, which refuses #![feature].
RUST-TC-3 = "gated: .github/workflows/code-quality.yml#rust-quality"
RUST-DOC-1 = "uncovered: the published library crates do not warn on missing docs"
RUST-READ-1 = "convention: readability is judged in review"
RUST-MACRO-1 = "convention: macro or function is judged in review"
# Cargo.lock has no ctor, inventory, linkme or static_init.
RUST-INIT-1 = "practiced"
