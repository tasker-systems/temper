# Published to crates.io as `temperkb-client`; the LIBRARY keeps the `temper_client`
# name (see temperkb-core's manifest for the convention).
[package]
name = "temperkb-client"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Auth-aware HTTP client for the temper cloud API"

[lib]
name = "temper_client"

[dependencies]
temperkb-core = { path = "../temper-core" }
temperkb-principal = { path = "../temper-principal" }
temperkb-workflow = { path = "../temper-workflow" }
temperkb-auth = { path = "../temper-auth" }
temperkb-telemetry = { path = "../temper-telemetry" }
reqwest = { version = "0.12", features = ["json", "multipart", "rustls-tls", "cookies"], default-features = false }
# The in-process transport: prepared requests are driven through an assembled API router
# (`Router::oneshot`) with no socket, so the per-route constraints at that router apply once.
axum = "0.8"
tower = { version = "0.5", features = ["util"] }
tokio = { version = "1", features = ["rt", "macros", "sync", "net"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v7", "serde"] }
thiserror = "2"
tracing = "0.1"
url = "2"
open = "5"
sha2 = "0.10"
base64 = "0.22"
dirs = "5"
secrecy = { version = "0.10", features = ["serde"] }

[features]
integration-tests = []

[dev-dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
tempfile = "3"
temp-env = "0.3"
wiremock = "0.6"
