# Published to crates.io as `temperkb-client`; the LIBRARY keeps the `temper_client`
# name (see temperkb-core's manifest for the convention).
[package]
name = "temperkb-client"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Auth-aware HTTP client for the temper cloud API"

[lib]
name = "temper_client"

[dependencies]
temperkb-core.workspace = true
temperkb-principal.workspace = true
temperkb-workflow.workspace = true
temperkb-auth.workspace = true
# OPTIONAL, default-on via the `telemetry` feature. Redaction and the outbound span
# do NOT ride it — both are plain `tracing`/`temper-core` surface — so a consumer
# that opts out (`default-features = false`) loses trace-context propagation only:
# no `traceparent` header is emitted and no export stack is inherited. temper's own
# surfaces keep the default and are unchanged. Removing this optionality later
# would be a breaking change; widening it is not.
temperkb-telemetry = { workspace = true, optional = true }
reqwest = { version = "0.12", features = ["json", "multipart", "rustls-tls", "cookies"], default-features = false }
# The in-process transport: prepared requests are driven through an assembled API router
# (`Router::oneshot`) with no socket, so the per-route constraints at that router apply once.
axum = "0.8"
tower = { version = "0.5", features = ["util"] }
tokio = { version = "1", features = ["rt", "macros", "sync", "net"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v7", "serde"] }
thiserror = "2"
tracing = "0.1"
url = "2"
open = "5"
sha2 = "0.10"
base64 = "0.22"
dirs = "5"
secrecy = { version = "0.10", features = ["serde"] }

[features]
default = ["telemetry"]
integration-tests = []
# Gates the OTel export stack (`temperkb-telemetry`) behind an opt-out rather than a
# hard dependency: the motivation is an external consumer — temper-desktop first —
# that needs the client's auth, retry, and redaction machinery without inheriting
# opentelemetry. Trace-context propagation is the only casualty of opting out, and
# only because a `traceparent` naming a span that is never exported is worse than
# none — see `send_inner`.
telemetry = ["dep:temperkb-telemetry"]

[dev-dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
tempfile = "3"
temp-env = "0.3"
wiremock = "0.6"
