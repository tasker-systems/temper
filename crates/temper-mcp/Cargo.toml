[package]
name = "temper-mcp"
version.workspace = true
edition.workspace = true
description = "MCP server for agent access to the temper knowledge base"
publish = false

[features]
# Gates the `#[sqlx::test]` suites in `tests/` — without it, `cargo make test`
# (no database) compiles them out entirely. Same pattern as temper-api/temper-services.
test-db = []

[dependencies]
# The network door: the resources family's tools execute through the DEPLOYED API as a
# temper-client HTTP relay (beat G3a-prime). Execution only — declaration, schemas and
# inventory stay fixed.
#
# temper-client is the door; temper-api is deliberately ABSENT. The service ends
# stateless (design §D6/§8): nothing in temper-mcp may construct or host the API —
# including in tests, where the harness binds a real listener serving `create_app` in
# the TEST process. Keeping the crate out of this dependency graph makes that property
# structural: a future `temper_api::create_app` call here cannot compile.
temperkb-client = { path = "../temper-client" }
# Only for the shared connection pool's type; the feature set mirrors temper-client's
# so workspace unification builds one reqwest.
reqwest = { version = "0.12", default-features = false }
temper-services = { path = "../temper-services" }

temperkb-principal = { path = "../temper-principal" }
temperkb-core = { path = "../temper-core", features = ["web-api", "mcp"] }
temper-substrate = { path = "../temper-substrate" }
temperkb-workflow = { path = "../temper-workflow", features = ["web-api", "mcp"] }
temperkb-telemetry = { path = "../temper-telemetry" }

# Blob commit/read carry bytes over the JSON-only MCP transport as base64.
base64 = "0.22"
# Collecting the read-through `ByteStream` into a whole tool result.
futures = "0.3"

rmcp = { version = "3.4.1", features = [
    "server",
    "transport-streamable-http-server",
] }

axum = { version = "0.8", features = ["json", "query"] }
chrono = { version = "0.4", features = ["serde"] }
http = "1"
jsonwebtoken = "9"
sqlx = { version = "0.8", features = ["postgres", "runtime-tokio-rustls"] }
tokio = { version = "1", features = ["full"] }
tower-http = { version = "0.6", features = ["limit"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
schemars = { version = "1", features = ["uuid1"] }
tracing = "0.1"
# Host-exact localhost checks in DCR — the prefix match it replaced blessed
# "http://localhost.evil.com/…" as a loopback callback.
url = "2"
uuid = { version = "1", features = ["v7", "serde"] }

[dev-dependencies]
# The tests' in-process JWKS and the harness's static-key store need the cfg-gated
# constructor; the dev-dep enables temper-services' NARROW `test-harness` (never
# `test-db` — that gate compiles the crate's own #[sqlx::test] bodies, which the DB-less
# unit lane would then run).
temper-services = { path = "../temper-services", features = ["test-harness"] }
# `ServiceExt::oneshot` — drives a request through the assembled router without binding a port.
tower = { version = "0.5", features = ["util"] }
# Builds the gzip body that witnesses the request-decompression layer.
flate2 = "1"
