[package]
name = "temper-mcp"
version.workspace = true
edition.workspace = true
description = "MCP tool layer for agent access to the temper knowledge base"
publish = false

[features]
# Kept so `--features test-db` across the workspace still resolves; temper-mcp itself has no
# database suites (it holds no pool).
test-db = []

[dependencies]
# The network door: the resources family's tools execute through the DEPLOYED API as a
# temper-client HTTP relay (beat G3a-prime). Execution only — declaration, schemas and
# inventory stay fixed.
#
# temper-client is the door; temper-api is deliberately ABSENT. The service ends
# stateless (design §D6/§8): nothing in temper-mcp may construct or host the API —
# including in tests, where the harness binds a real listener serving `create_app` in
# the TEST process. Keeping the crate out of this dependency graph makes that property
# structural: a future `temper_api::create_app` call here cannot compile.
temperkb-client.workspace = true
# Only for the shared connection pool's type; the feature set mirrors temper-client's
# so workspace unification builds one reqwest.
reqwest = { version = "0.12", default-features = false }
# temper-services is deliberately ABSENT from [dependencies] (a dev-dependency only, for the
# `AuthzError` witness): the tool layer holds no pool, no key store and no server config. The
# deployed edge is `temper-mcp-server`, which hands this crate plain values (`host.rs`). A
# source gate (`src/source_gates.rs`) and the manifest check beside it keep both absent.

temperkb-core = { workspace = true, features = ["web-api", "mcp"] }
temperkb-workflow = { workspace = true, features = ["web-api", "mcp"] }

# Blob commit/read carry bytes over the JSON-only MCP transport as base64.
base64 = "0.22"
# Collecting the read-through `ByteStream` into a whole tool result.
futures = "0.3"

rmcp = { version = "3.4.1", features = [
    "server",
    "transport-streamable-http-server",
] }

axum = { version = "0.8", features = ["json", "query"] }
chrono = { version = "0.4", features = ["serde"] }
http = "1"
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
schemars = { version = "1", features = ["uuid1"] }
tracing = "0.1"
uuid = { version = "1", features = ["v7", "serde"] }

[dev-dependencies]
# Test-only: the exhaustive `AuthzError` witness (`service.rs`) mirrors the API's wire body for
# each variant, so it names the services' error types. Never a runtime dependency (see above).
temper-services = { path = "../temper-services" }
# The source gates (`src/source_gates.rs`) parse the crate's own tool modules: real function
# bodies, real `#[cfg(test)]` attributes and real call/await chains instead of a hand lexer.
syn = { version = "2", features = ["full", "visit"] }
# Macro bodies are token streams; the gates read their identifiers.
proc-macro2 = "1"
# The exhaustive `AuthzError` witness constructs a typed `Refusal` for the system-access arm.
temperkb-principal.workspace = true
