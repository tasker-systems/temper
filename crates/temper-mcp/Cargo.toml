[package]
name = "temper-mcp"
version.workspace = true
edition.workspace = true
description = "MCP tool layer for agent access to the temper knowledge base"
publish = false

[features]
# Kept so `--features test-db` across the workspace still resolves; temper-mcp itself has no
# database suites (it holds no pool).
test-db = []

[dependencies]
# The network door: the resources family's tools execute through the DEPLOYED API as a
# temper-client HTTP relay (beat G3a-prime). Execution only — declaration, schemas and
# inventory stay fixed.
#
# temper-client is the door; temper-api is deliberately ABSENT. The service ends
# stateless (design §D6/§8): nothing in temper-mcp may construct or host the API —
# including in tests, where the harness binds a real listener serving `create_app` in
# the TEST process. Keeping the crate out of this dependency graph makes that property
# structural: a future `temper_api::create_app` call here cannot compile.
temperkb-client.workspace = true
# The shared connection pool, and the blob read's byte stream (`Response::bytes_stream`, behind
# `stream`). Declared here, not borrowed from workspace unification: built alone (as a published
# crate is), the blob read did not compile without it.
reqwest = { version = "0.12", default-features = false, features = ["stream"] }
# temper-services is deliberately ABSENT, from every dependency table: the tool layer holds no
# pool, no key store and no server config, and the `AuthzError` witness lives in the deployed
# host (`temper-mcp-server`), where the services' error types and this crate's refusal mapping
# are both legitimately visible. A source gate (`src/source_gates.rs`) and the manifest check
# beside it keep it absent.

# Without `web-api`: the MCP server neither exposes nor expresses utoipa, and `cargo tree -p
# temper-mcp -e normal` must show none (temperkb-client depends on both crates the same way).
temperkb-core = { workspace = true, features = ["mcp"] }
temperkb-workflow = { workspace = true, features = ["mcp"] }

# Blob commit/read carry bytes over the JSON-only MCP transport as base64.
base64 = "0.22"
# Collecting the read-through `ByteStream` into a whole tool result.
futures = "0.3"

rmcp = { version = "3.4.1", features = [
    "server",
    "transport-streamable-http-server",
] }

chrono = { version = "0.4", features = ["serde"] }
http = "1"
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
schemars = { version = "1", features = ["uuid1"] }
tracing = "0.1"
uuid = { version = "1", features = ["v7", "serde"] }

[dev-dependencies]
# The source gates (`src/source_gates.rs`) parse the crate's own tool modules: real function
# bodies, real `#[cfg(test)]` attributes and real call/await chains instead of a hand lexer.
syn = { version = "2", features = ["full", "visit"] }
# Macro bodies are token streams; the gates read their identifiers.
proc-macro2 = "1"
# The manifest gate reads this crate's own Cargo.toml.
toml = "0.8"
# `resources_read_error_test` serves a canned answer from a real listener.
axum = "0.8"
