[package]
name = "temper-cli"
version.workspace = true
edition.workspace = true
description = "Developer workflow tool for agent-assisted development"
publish = false

[package.metadata.cargo-machete]
ignored = ["indicatif"]

[[bin]]
name = "temper"
path = "src/main.rs"

[dependencies]
anstream = "1.0"
anstyle = "1"
askama = "0.12"
async-trait = "0.1"
base64 = "0.23"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4", features = ["derive", "env"] }
dialoguer = "0.12"
dirs = "7"
# `pem` turns on `alloc`, which 3.x dropped from its defaults; without it `SigningKey` loses
# `EncodePrivateKey` and `to_pkcs8_pem` disappears. `pkcs8` below must track the same 0.x line.
ed25519-dalek = { version = "3", features = ["pem", "rand_core"] }
filetime = "0.2"
hex = "0.4"
indicatif = "0.18"
libc = "0.2"
pkcs8 = { version = "0.11", features = ["pem"] }
rand = "0.10"
reqwest = { version = "0.12", default-features = false, features = [
  "rustls-tls"
] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
sha2 = "0.11"
shell-words = "1"
sigstore-trust-root = "0.15"
sigstore-types = "0.15"
sigstore-verify = "0.15"
similar = "3"
temperkb-client = { workspace = true, features = ["telemetry"] }
temperkb-core.workspace = true
temperkb-principal.workspace = true
temperkb-workflow.workspace = true
temper-ingest = { path = "../temper-ingest" }
temperkb-telemetry.workspace = true
tempfile = "3"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time"] }
toon-format = "0.7"
toml = "1.1"
tracing = "0.1"
url = "2"
uuid = { version = "1", features = ["serde", "v7"] }
validator = { version = "0.21", features = ["derive"] }

[dev-dependencies]
# Builds the stub router `show_cache`'s tests drive through `TemperClient::in_process_with_token`
# — the same in-process door temper-client's own tests use, so no socket and no mock server.
axum = "0.8"
# Splits an advertised command string the way a user's shell would, so the
# access-gate test can hand clap the exact argv the user would have typed.
shlex = "2"
temp-env = "0.3"
# A real socket for the OAuth token endpoint: the refresh grant goes over plain reqwest, not the
# client's in-process door.
wiremock = "0.6"

[features]
default = ["embed", "extract"]
embed = ["temper-ingest/embed-download"]
extract = ["temper-ingest/extract"]
test-db = []
test-embed = ["embed", "temper-ingest/test-embed"]
