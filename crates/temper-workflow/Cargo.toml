# Published to crates.io as `temperkb-workflow`; the LIBRARY keeps the
# `temper_workflow` name (see temperkb-core's manifest for the convention).
[package]
name = "temperkb-workflow"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Doc-type-aware workflow vocabulary for the temper knowledge base: resource rows, frontmatter, schema validation, and the operations command layer"

[lib]
name = "temper_workflow"

[dependencies]
temperkb-core.workspace = true
async-trait = "0.1"
chrono = { version = "0.4", features = ["serde"] }
jsonschema = "0.45"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
thiserror = "2"
tracing = "0.1"
uuid = { version = "1", features = ["serde", "v7"] }

[dev-dependencies]
tempfile = "3"

[features]
# Each forwards to temper-core, where the wire types and their derives now live.
mcp = ["temperkb-core/mcp"]
typescript = ["temperkb-core/typescript"]
web-api = ["temperkb-core/web-api"]
