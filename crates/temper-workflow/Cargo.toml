# Published to crates.io as `temperkb-workflow`; the LIBRARY keeps the
# `temper_workflow` name (see temperkb-core's manifest for the convention).
[package]
name = "temperkb-workflow"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Doc-type-aware workflow vocabulary for the temper knowledge base: resource rows, frontmatter, schema validation, and the operations command layer"

[lib]
name = "temper_workflow"

[dependencies]
temperkb-core = { path = "../temper-core" }
async-trait = "0.1"
chrono = { version = "0.4", features = ["serde"] }
jsonschema = "0.45"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
sqlx = { version = "0.8", features = ["chrono", "json", "macros", "postgres", "runtime-tokio-rustls", "uuid"] }
thiserror = "2"
tracing = "0.1"
uuid = { version = "1", features = ["serde", "v7"] }
schemars = { version = "1", features = ["chrono04", "uuid1"], optional = true }
ts-rs = { version = "10", features = ["chrono-impl", "serde-json-impl", "uuid-impl"], optional = true }
utoipa = { version = "5", features = ["uuid"], optional = true }

[dev-dependencies]
tempfile = "3"

[features]
mcp = ["schemars", "temperkb-core/mcp"]
typescript = ["ts-rs", "temperkb-core/typescript"]
web-api = ["utoipa", "utoipa/chrono", "temperkb-core/web-api"]
