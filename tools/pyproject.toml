[project]
name = "temper-tools"
version = "0.1.0"
description = "Repo-local Python tooling for the temper workspace."
requires-python = ">=3.11"
dependencies = [
    "PyYAML>=6.0",
]

# The single Python home for this workspace. Everything Python-side lives under `tools/` and is run
# with `uv run --project tools ...` so there is no ambient interpreter or global install to drift
# against. Added 2026-08-17 with `register_projection`; intended to hold whatever comes next rather
# than to be one script's private scaffolding.
#
# `scripts/register-coverage.py` predates this and is deliberately NOT moved here: it is a
# stdlib-only terminal report with its own lifecycle, and relocating it would be an unrelated change
# riding along. Its clause-parsing lineage is carried forward by `register_projection.registers`.

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[project.scripts]
register-projection = "register_projection.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["register_projection"]

[tool.pytest.ini_options]
testpaths = ["tests"]
