# tools/cargo-make/release-tasks.toml
#
# Release preparation tasks. Wires the scripts under
# tools/scripts/release/ into cargo-make for easy invocation.
#
# Primary entrypoints:
#   cargo make release-check    — dry-run: what would release-prepare do?
#   cargo make release-prepare  — real run: bump version, open release PR
#
# See: temper-artifacts:specs/2026-04-17-temper-cli-binary-release-design.md

[tasks.release-check]
description = "Dry-run release preparation — detect changes, show next version"
category = "Release"
script = [
    "./tools/scripts/release/release-prepare.sh --dry-run"
]

[tasks.release-prepare]
description = "Bump version, create release branch, and open release PR. Patch bump; packages float independently — to align them, invoke tools/scripts/release/release-prepare.sh directly with leaf flags (--rb --py --ts --telemetry --ui --cloud); cargo-make tasks cannot forward extra args."
category = "Release"
script = [
    "./tools/scripts/release/release-prepare.sh"
]

[tasks.release-prepare-minor]
description = "Release-prepare with a raised minor (0.5.0 -> 0.6.0) — required when the register window carries retirement-train rows: M is the reserved era level and moves only in the retirement release. A minor is a wire-moving release, so the WHOLE FLEET rides: every wire-dependent package aligns to the new VERSION (the policy this hardwiring encodes after the 0.5.0 cut left every package behind)."
category = "Release"
script = [
    "./tools/scripts/release/release-prepare.sh --minor --rb --py --ts --telemetry --ui --cloud"
]

[tasks.release-prepare-major]
description = "Release-prepare with a hand-raised major (0.5.x -> 1.0.0). The whole fleet rides, as with the minor."
category = "Release"
script = [
    "./tools/scripts/release/release-prepare.sh --major --rb --py --ts --telemetry --ui --cloud"
]

[tasks.skill-package]
description = "Package the MCP skill tree as an uploadable Agent Skill bundle (dist/temper-skill-v<ver>.zip)"
category = "Release"
# Same script the release workflow runs, for the same reason `generate-temper-rb.sh` is shared by
# cargo-make and CI: one definition of what the artifact is. Re-emits first, so packaging a stale
# tree is not possible — the emit is cheap and idempotent.
script = [
    "cargo run -q -p temper-cli -- skill emit --path agent-skills/temper-knowledge-base",
    "VERSION=$(cat ${CARGO_MAKE_WORKING_DIRECTORY}/VERSION) bash ${CARGO_MAKE_WORKING_DIRECTORY}/.github/scripts/release/package-skill.sh"
]
