# =============================================================================
# Temper — Workspace-Level cargo-make Tasks
# =============================================================================
# Composite tasks that operate across the entire workspace.
# Extended by the root Makefile.toml.

extend = [
    { path = "./base-tasks.toml" },
    { path = "./release-tasks.toml" },
]

# =============================================================================
# Composite Tasks
# =============================================================================

[tasks.check]
description = "Run all quality checks (Rust + TypeScript)"
# Mirrors the `code-quality / Rust Quality` CI job. The OpenAPI gates belong here for the same
# reason the rest do: openapi.json is a committed *product of the router*, so a new route — or merely
# a new field on a response DTO — leaves the committed artifact stale, and nothing else notices.
# Omitting them meant a green local `check` followed by a red CI job; that is what bit PR #348.
# `openapi-rb-drift` extends that same reasoning to the temper-rb generated gem (a product of
# openapi.json), whose drift gate is otherwise CI-only — the exact gap that bit #354. It needs
# Docker and skips without it (the test-ruby CI job is the never-skipping backstop).
# `openapi-ts-drift` does the same for temper-ts's generated schema.ts, and unlike the
# gem's gate it never skips: openapi-typescript needs only Node.
dependencies = [
  "rust-fmt-check",
  "rust-clippy",
  "rust-docs",
  "rust-machete",
  "openapi-check",
  "openapi-routes-check",
  "tripwires",
  "openapi-rb-drift",
  "openapi-ts-drift",
  "ts-rs-drift",
  "skills-drift",
  "ts-check"
]

[tasks.skills-drift]
description = "Fail if the committed agent-skills/ projection has drifted from the templates that produce it"
# `agent-skills/temper-knowledge-base/` is an installable skill for MCP-only clients, and it is now
# a committed PROJECTION of shared templates plus schema-derived content rather than a
# hand-maintained copy. Hand-maintained it drifted past staleness into being wrong about the system
# — teaching primitives temper has never shipped — and nothing could notice, because nothing
# connected the prose to the thing it described.
#
# Like ts-rs-drift, this NEVER skips: it needs only cargo, which every other task in this list
# already requires. It builds from source rather than shelling out to `temper` so that it compares
# against the tree under review — in CI there is no installed `temper` at all.
#
# `[corrected — 2026-08-17, Pete]` This said the repo "deliberately keeps STALE" an installed
# `temper` "for parity validation". Not true: the PATH binary is rebuilt from the working branch and
# is current. See the fuller correction in check-skills-drift.sh.
script = ["bash ${CARGO_MAKE_WORKING_DIRECTORY}/.github/scripts/check-skills-drift.sh"]

[tasks.register-coverage-drift]
description = "Fail if internal/registers/coverage.yaml has drifted from the projection that produces it"
# DELIBERATELY NOT a dependency of `check`, and the reason is a standing goal of this repo: CI paying
# for work nobody asked for. This gate makes ~60 network round trips to the knowledge base and takes
# about a minute, which is not a cost every local `cargo make check` should carry.
#
# It is also the ONLY drift gate here whose source is not this repository, so it is the only one that
# can go red without any commit being at fault — a register edited elsewhere moves the artifact. That
# makes it a poor fit for a blocking pre-merge gate and a good fit for a deliberate run.
#
# Wiring it into CI is a separate decision and an operator act. The goal it serves says so explicitly:
# "CI answers did it regress; a map answers where are we and how did we get here."
script = ["bash ${CARGO_MAKE_WORKING_DIRECTORY}/.github/scripts/check-register-coverage-drift.sh"]

[tasks.ts-rs-drift]
description = "Fail if any committed ts-rs generated type has drifted from the Rust that produces it"
# The cross-LANGUAGE gate. Every other check here lives inside one language — clippy, tsc, biome —
# so a Rust type and its TypeScript mirror can disagree while both sides stay green. That is not
# hypothetical: PR #498 merged with tsc clean and 79/79 tests passing while the mention agent
# spoke a mint contract the server had stopped emitting.
#
# Like openapi-ts-drift and unlike openapi-rb-drift, this NEVER skips: it needs only cargo, which
# is already required by every other task in this list.
script = ["bash ${CARGO_MAKE_WORKING_DIRECTORY}/.github/scripts/check-ts-rs-drift.sh"]

[tasks.tripwires]
description = "Run every .github/scripts/audit-*.sh tripwire, and fail if CI runs one this task does not"
# These pin reviewed sets — grant write-sites, unauthenticated routes, handler-side authz calls,
# signature-secret distinctness, credential types deriving Debug, ungated fragments, migration
# declarations, sqlx macro exceptions, ignored tests, contract cross-refs, attestation subject
# paths, and unattributed decision-voiced prose — against baselines a human approved.
#
# `[renamed from security-tripwires — 2026-08-15]` The name had stopped being true: half the set is
# not security. `audit-unattributed-decisions` is prose hygiene, `audit-ignored-tests` is test
# hygiene, `audit-contract-crossrefs` is documentation. Kept as an alias below so anything invoking
# the old name still works.
#
# # THE SET IS DERIVED, BECAUSE THE HAND-MAINTAINED ONE ROTTED
#
# This task's whole purpose is to remove the green-local-then-red-CI round-trip, and it said so:
# *"They lived ONLY in the `code-quality / Rust Quality` CI job, so a new grant sink … passed a
# green local `cargo make check` and failed in CI — exactly the round-trip this task removes."*
#
# It then stopped doing that for more than half of them. It listed FIVE scripts by name; CI ran
# TWELVE `[measured — 2026-08-15]`. The seven it never gained — ungated-fragments,
# unattributed-decisions, ignored-tests, contract-crossrefs, attest-subject-path,
# sqlx-macro-exceptions, migration-declarations — were exactly as CI-only as the original five had
# been, and the task that existed to close that gap read as though it had.
#
# Found the way it was always going to be found: `audit-unattributed-decisions` failed in CI on
# PR #682 after a fully green local `cargo make check`.
#
# So the set is now GLOBBED rather than listed. That is this repo's own lesson, applied to the file
# that needed it — `assert_every_compiled_in_doc_is_vetoed` derives its set by grepping for
# `include_str!` rather than trusting a list to stay complete, and `audit-ungated-fragments.sh`'s
# header states the principle outright: *"a hand-maintained enumeration rots while a derived set
# does not."* A tripwire added tomorrow is covered here with no edit, which is the only version of
# this that stays true.
#
# Two failure modes are closed explicitly, because both are silent:
#
#   * **An empty glob FAILS.** A loop over zero scripts passes while asserting nothing, and the
#     causes are mundane — a moved directory, a renamed prefix. `audit-ungated-fragments.sh` makes
#     the same rule: *"A scan that finds NOTHING must fail, not pass."*
#   * **A tripwire CI does not run FAILS.** The glob covers "local is missing one"; this covers the
#     opposite and more dangerous direction, since CI is the enforcing gate and a tripwire it never
#     invokes is decoration. Checked by grepping the workflow for each script this task found.
#
# `test-audit-*.sh` — the meta-tests that prove each tripwire can FAIL — are deliberately not run
# here. They are a different question (does the guard bite) from the one `check` asks (does the tree
# pass), they are slower, and CI runs them in their own steps. Named so their absence reads as a
# decision rather than as the same oversight one level down.
#
# Delegates to the same scripts CI runs, so local and CI logic are identical (CI cannot call
# cargo-make: the root Makefile.toml needs a ./.env no runner has).
script = '''
set -u
cd "${CARGO_MAKE_WORKING_DIRECTORY}"

# The one seam the bite-probe needs, and it is not reachable in normal use: both default to the
# real paths, and nothing sets them. Mirrors `audit-unattributed-decisions.sh`'s `BASELINE_FILE`
# and `audit-ungated-fragments.sh`'s `MIGRATIONS_DIR` — a guard nobody can make FAIL on purpose is
# a guard nobody has checked.
scripts_dir="${TRIPWIRE_SCRIPTS_DIR:-.github/scripts}"
workflow="${TRIPWIRE_WORKFLOW:-.github/workflows/code-quality.yml}"
found=0
fail=0
missing_in_ci=""

for path in "${scripts_dir}"/audit-*.sh; do
  [ -e "${path}" ] || continue
  found=$((found + 1))
  name=$(basename "${path}" .sh)
  echo "--- tripwire: ${name} ---"
  if ! bash "${path}"; then fail=1; fi
  if ! grep -q "bash .github/scripts/${name}.sh" "${workflow}"; then
    missing_in_ci="${missing_in_ci} ${name}"
  fi
done

if [ "${found}" -eq 0 ]; then
  echo "tripwires: FOUND NO SCRIPTS matching ${scripts_dir}/audit-*.sh." >&2
  echo "  A loop over zero scripts passes while asserting nothing. Either the directory moved or" >&2
  echo "  the naming prefix changed; until that is fixed this task checks nothing." >&2
  exit 1
fi

if [ -n "${missing_in_ci}" ]; then
  echo "" >&2
  echo "tripwires: these exist and CI does not run them:${missing_in_ci}" >&2
  echo "  ${workflow} is the ENFORCING gate — a tripwire it never invokes is decoration, however" >&2
  echo "  green it is here. Add a step for each, or delete the script." >&2
  fail=1
fi

if [ "${fail}" -ne 0 ]; then
  echo "tripwires: one or more failed (see above)." >&2
  exit 1
fi
echo "tripwires: all ${found} passed, and CI runs every one of them."
'''

# `[2026-08-15]` The old name, kept so anything invoking it still resolves. The set it runs is no
# longer only security, which is why the canonical name moved.
[tasks.security-tripwires]
description = "Deprecated alias for `tripwires`"
alias = "tripwires"

[tasks.test-schema-substrate]
description = "Run the payload JSON-Schema snapshot gate (no database, no ONNX). Regenerate: UPDATE_SCHEMA=1 cargo make test-schema-substrate"
# PACKAGE-SCOPED ON PURPOSE — do NOT fold this into the `--workspace` run below.
#
# The emitted schema DEPENDS ON FEATURE UNIFICATION. Under `--workspace`, temper-core's `mcp` feature
# (schemars derives) unifies in and the id newtypes emit INLINE; under `-p temper-substrate` they
# emit as `$ref`s into `$defs`. Same structs, two different schemas, decided by the cargo invocation.
#
# `-p` is the authoritative shape because it is what the boot-seed stamps into
# `kb_event_types.payload_schema` and what the regen command emits. Gating the workspace shape would
# gate a schema nothing ever stamps.
#
# This ran NOWHERE before 2026-07-16 — no job, no task enabled `scenario-schema` — so it sat RED on
# `main` while three payload fields (`segmented`, `telos_centroid`, `TelosConstants`) shipped with no
# schema and prod's registry described an older payload than the code writes.
command = "cargo"
args = [
  "nextest",
  "run",
  "-p",
  "temper-substrate",
  "--features",
  "scenario-schema",
  "--no-fail-fast"
]

[tasks.test-schema-core]
description = "Run the query-contract JSON-Schema snapshot gate. Regenerate: UPDATE_SCHEMA=1 cargo make test-schema-core"
# FEATURE-PINNED for the same reason as test-schema-substrate: the emitted schema depends on
# feature unification. `mcp` is the authoritative shape because it is what an MCP tool schema
# carries — the id newtypes must emit INLINE there, since a `$ref` reaches the Anthropic tool-use
# layer with no type signal and comes back as `null`.
#
# The two gates pin DIFFERENT features on purpose, each right for its own artifact: substrate pins
# `scenario-schema` because that is what the boot-seed stamps into `kb_event_types.payload_schema`.
#
# UNLIKE test-schema-substrate, this gate ALSO runs under the `--workspace` invocation below,
# because temper-mcp enables `temper-core/mcp` — so its `#![cfg(feature = "mcp")]` is satisfied
# there, where substrate's `scenario-schema` is not. That is why `tests/query_schema.rs`
# canonicalizes key order before comparing: `toon-format` enables `serde_json/preserve_order`,
# which under `--workspace` unifies in and reorders schemars' property map. Without the
# canonicalization this task passes and `cargo make test` fails on the same snapshots
# `[verified — 2026-08-03]`. Read the header comment in that file before changing either.
command = "cargo"
args = [
  "nextest",
  "run",
  "-p",
  "temper-core",
  "--features",
  "mcp",
  "--test",
  "query_schema",
  "--no-fail-fast"
]

[tasks.test-schema]
description = "All JSON-Schema snapshot gates (payload + query contract)"
dependencies = ["test-schema-substrate", "test-schema-core"]

[tasks.test]
description = "Run tests (unit tests, no feature flags) + the payload- and query-schema snapshot gates"
dependencies = ["test-schema"]
command = "cargo"
args = ["nextest", "run", "--workspace", "--no-fail-fast"]

[tasks.test-db]
description = "Run tests including database integration tests (requires Docker Postgres)"
command = "cargo"
args = [
  "nextest",
  "run",
  "--workspace",
  "--features",
  "test-db",
  "--no-fail-fast"
]

[tasks.coverage]
description = "Generate code coverage via llvm-cov + nextest, incl. DB tests (requires Docker Postgres + the llvm-tools-preview rustup component)"
command = "cargo"
args = [
  "llvm-cov",
  "nextest",
  "--workspace",
  "--features",
  "test-db",
  "--no-fail-fast"
]

[tasks.test-all]
description = "Run all test tiers including embedder and TypeScript tests"
dependencies = ["test-all-rust", "ts-test", "ts-test-integration"]

[tasks.test-e2e]
description = "Run E2E tests only (requires Docker Postgres)"
command = "cargo"
args = [
  "nextest",
  "run",
  "--manifest-path",
  "tests/e2e/Cargo.toml",
  "--features",
  "test-db",
  "--no-fail-fast"
]

[tasks.test-e2e-embed]
description = "Run E2E tests with embed pipeline gated on (requires Docker Postgres + ONNX runtime); matches CI's Embed job"
command = "cargo"
args = [
  "nextest",
  "run",
  "--manifest-path",
  "tests/e2e/Cargo.toml",
  "--features",
  "test-db,test-embed",
  "--no-fail-fast"
]

[tasks.test-all-rust]
description = "Run all Rust test tiers"
command = "cargo"
args = [
  "nextest",
  "run",
  "--workspace",
  "--features",
  "test-db,test-embed",
  "--no-fail-fast"
]

[tasks.fix]
description = "Auto-fix formatting and lint issues (Rust + TypeScript)"
dependencies = ["rust-fmt-fix", "rust-clippy-fix", "ts-fix"]

[tasks.build]
description = "Build all workspace crates"
command = "cargo"
args = ["build", "--workspace", "--all-features"]

[tasks.audit]
description = "Run security audit on dependencies"
command = "cargo"
args = ["audit"]

[tasks.run]
description = "Run the temper-api server locally"
command = "cargo"
args = ["run", "-p", "temper-api"]

# =============================================================================
# Sub-Tasks
# =============================================================================

[tasks.rust-fmt-check]
description = "Check Rust formatting"
command = "cargo"
args = ["fmt", "--all", "--", "--check"]

[tasks.rust-fmt-fix]
description = "Fix Rust formatting"
command = "cargo"
args = ["fmt", "--all"]

[tasks.rust-clippy]
description = "Run Clippy lints"
command = "cargo"
args = ["clippy", "--workspace", "--all-targets", "--all-features", "--", "-D", "warnings"]

[tasks.rust-clippy-fix]
description = "Fix Clippy issues"
command = "cargo"
args = [
  "clippy",
  "--workspace",
  "--all-targets",
  "--all-features",
  "--fix",
  "--allow-dirty",
  "--allow-staged"
]

[tasks.rust-docs]
description = "Check documentation builds (RUSTDOCFLAGS=-D warnings, matching CI)"
command = "cargo"
args = ["doc", "--workspace", "--no-deps", "--document-private-items"]
# Match CI's code-quality job: rustdoc warnings (broken intra-doc links, bare
# URLs, etc.) fail the build locally before they reach CI. The global
# SQLX_OFFLINE=true keeps temper-substrate's namespaced macros resolving from its
# per-crate .sqlx cache, so a single --workspace pass suffices (mirrors how
# rust-clippy is run locally; CI splits temper-substrate only to avoid double-linting).
env = { RUSTDOCFLAGS = "-D warnings" }

[tasks.rust-machete]
description = "Check for unused Cargo dependencies"
command = "cargo"
args = ["machete", "--with-metadata"]

# =============================================================================
# TypeScript Tasks (packages/temper-cloud)
# =============================================================================

[tasks.ts-check]
description = "Run TypeScript quality checks (typecheck + biome)"
dependencies = ["ts-typecheck", "ts-lint"]

[tasks.ts-typecheck]
description = "TypeScript type checking"
cwd = "packages/temper-cloud"
command = "bun"
args = ["run", "typecheck"]

[tasks.ts-lint]
description = "TypeScript lint and format check (biome)"
cwd = "packages/temper-cloud"
command = "bun"
args = ["run", "check"]

[tasks.ts-fix]
description = "Auto-fix TypeScript formatting and lint issues"
cwd = "packages/temper-cloud"
command = "bun"
args = ["run", "check:fix"]

[tasks.ts-test]
description = "Run TypeScript unit tests"
cwd = "packages/temper-cloud"
command = "bun"
args = ["run", "test"]

[tasks.ts-test-integration]
description = "Run TypeScript integration tests (requires Docker Postgres)"
cwd = "packages/temper-cloud"
command = "bun"
args = ["run", "test:integration"]

# =============================================================================
# Code Generation Tasks
# =============================================================================

[tasks.generate-ts-types]
description = "Generate TypeScript types from temper-core Rust structs via ts-rs"
script = [
  "mkdir -p ${CARGO_MAKE_WORKING_DIRECTORY}/packages/temper-ui/src/lib/types/generated",
  "TS_RS_EXPORT_DIR=${CARGO_MAKE_WORKING_DIRECTORY}/packages/temper-ui/src/lib/types/generated cargo test -p temper-core --features typescript",
  "TS_RS_EXPORT_DIR=${CARGO_MAKE_WORKING_DIRECTORY}/packages/temper-ui/src/lib/types/generated cargo test -p temper-workflow --features typescript",
  "TS_RS_EXPORT_DIR=${CARGO_MAKE_WORKING_DIRECTORY}/packages/temper-ui/src/lib/types/generated cargo test -p temper-agents --features typescript",
  # ts-rs emits one export test per crate, so a crate absent from this list contributes nothing —
  # temper-principal owns `Refusal`/`Standing`/`ActorAuthority`, which `SystemAccessDetails` imports.
  "TS_RS_EXPORT_DIR=${CARGO_MAKE_WORKING_DIRECTORY}/packages/temper-ui/src/lib/types/generated cargo test -p temper-principal --features typescript",
  "generated=$(ls ${CARGO_MAKE_WORKING_DIRECTORY}/packages/temper-ui/src/lib/types/generated/*.ts 2>/dev/null | wc -l | tr -d ' ')",
  "if [ \"$generated\" -eq 0 ]; then echo 'ERROR: No TypeScript files were generated'; exit 1; fi",
  "echo \"TypeScript types generated: $generated file(s) in packages/temper-ui/src/lib/types/generated/\"",
  "ls ${CARGO_MAKE_WORKING_DIRECTORY}/packages/temper-ui/src/lib/types/generated/*.ts",

  # ---------------------------------------------------------------------------
  # Second output tree: the @temper mention agent.
  #
  # It gets its OWN copy rather than importing temper-ui's because it is
  # workspace-isolated by design — "deliberately NOT a bun `workspaces` member"
  # (packages/agent-workflows/mention/CLAUDE.md), so no import path reaches
  # temper-ui's tree. Two trees is the cost of that isolation, and the drift gate
  # below is what keeps them honest.
  #
  # FILTERED to `export_bindings_linkrefusal`, not a whole-crate export. ts-rs
  # emits one test per type and exports each type's TRANSITIVE CLOSURE, so this
  # single filter yields exactly `slack_link.ts` (LinkRefusal) plus the
  # `admission.ts` it imports (Refusal/Standing/ActorAuthority) — 2 files, where
  # an unfiltered `-p temper-core` would deposit 36, most of them types this
  # agent has no relationship to (graph, cognitive maps, resources).
  #
  # The closure is why there is no hand-maintained file list here: give
  # LinkRefusal a new dependency and ts-rs emits that file too, automatically.
  #
  # NOTE the crate is temper-CORE. `LinkRefusal` lives in temper-core
  # (crates/temper-core/src/types/slack.rs), NOT temper-principal — exporting
  # temper-principal alone would produce `admission.ts` and no `slack_link.ts`,
  # i.e. everything except the type the agent actually branches on.
  # `ts-rs/import-esm` is enabled for THIS invocation only, and it is load-bearing.
  # Without it ts-rs emits `from "./admission"`, and the mention package compiles
  # under `"moduleResolution": "NodeNext"` (tsconfig.json) where an extensionless
  # relative ESM import is error TS2835. With it, `from "./admission.js"`.
  #
  # NOT enabled repo-wide: temper-ui resolves via its bundler and does not need
  # the suffix, so flipping the feature globally would rewrite the import line of
  # every generated file in its tree — 36 files of churn, and a change to the UI
  # build, to fix a problem only this consumer has. The two trees therefore differ
  # in import style by design. That is not drift: each tree is regenerated and
  # diffed against ITSELF by the gate below, with the emit style its consumer
  # requires.
  "mkdir -p ${CARGO_MAKE_WORKING_DIRECTORY}/packages/agent-workflows/mention/agent/generated",
  "TS_RS_EXPORT_DIR=${CARGO_MAKE_WORKING_DIRECTORY}/packages/agent-workflows/mention/agent/generated cargo test -p temper-core --features typescript,ts-rs/import-esm export_bindings_linkrefusal",

  # This dir gets its OWN assertion. The count above covers only temper-ui, so
  # without this a filter that matches NOTHING — the failure mode of a renamed
  # type, since `cargo test` exits 0 when zero tests match — would leave this
  # tree empty and still pass. Name the files rather than counting them: the
  # closure is small and known, and "2 files" would also be satisfied by the
  # wrong two.
  "for f in slack_link.ts admission.ts; do if [ ! -s \"${CARGO_MAKE_WORKING_DIRECTORY}/packages/agent-workflows/mention/agent/generated/$f\" ]; then echo \"ERROR: mention agent types missing $f — did the ts-rs test filter stop matching (renamed type)?\"; exit 1; fi; done",
  "echo \"TypeScript types generated: slack_link.ts, admission.ts in packages/agent-workflows/mention/agent/generated/\""
]

[tasks.openapi]
description = "Emit the OpenAPI contract + regenerate the temper-rb gem and temper-ts schema (all products of the router)"
# openapi.json, the temper-rb generated core, AND temper-ts's generated schema.ts are
# all products of the router: a new DTO field restales all three. Regenerating them
# together is what keeps them in lockstep, so following openapi-check's "run cargo make
# openapi" remedy fixes both SDKs too (the exact gap that bit #354). Gem regen needs
# Docker; when it is absent this still emits the spec and the TS schema, and points at
# `cargo make openapi-rb` for later. The TS schema needs only Node, so it never skips.
script = [
  "out=${CARGO_MAKE_WORKING_DIRECTORY}/openapi.json",
  "cargo run --quiet -p temper-api --bin emit-openapi > \"$out\"",
  "if [ ! -s \"$out\" ]; then echo 'ERROR: openapi.json is missing or empty'; exit 1; fi",
  "echo \"OpenAPI spec written: $out ($(wc -c < \"$out\" | tr -d ' ') bytes)\"",
  "if docker info >/dev/null 2>&1; then bash ${CARGO_MAKE_WORKING_DIRECTORY}/.github/scripts/generate-temper-rb.sh && echo 'temper-rb gem regenerated'; else echo 'NOTE: Docker unavailable — skipped temper-rb gem regen; run cargo make openapi-rb once Docker is up.'; fi",
  "bash ${CARGO_MAKE_WORKING_DIRECTORY}/.github/scripts/generate-temper-ts.sh && echo 'temper-ts schema regenerated'"
]

[tasks.openapi-rb]
description = "Regenerate the temper-rb gem from openapi.json (requires Docker)"
script = ["bash ${CARGO_MAKE_WORKING_DIRECTORY}/.github/scripts/generate-temper-rb.sh"]

[tasks.openapi-rb-drift]
description = "Fail if the committed temper-rb generated core drifts from openapi.json (skips without Docker)"
# The local mirror of the test-ruby CI job's `rake drift`. In `check` so a DTO
# change cannot pass a green local gate and then redden Ruby CI. Skips (does not
# fail) when Docker is absent; the CI ruby job is the never-skipping backstop.
script = ["bash ${CARGO_MAKE_WORKING_DIRECTORY}/.github/scripts/check-temper-rb-drift.sh"]

[tasks.openapi-ts]
description = "Regenerate temper-ts's schema.ts from openapi.json (needs Node)"
script = ["bash ${CARGO_MAKE_WORKING_DIRECTORY}/.github/scripts/generate-temper-ts.sh"]

[tasks.openapi-ts-drift]
description = "Fail if the committed temper-ts schema drifts from openapi.json"
# The local mirror of the temper-ts CI job's drift step, and the sibling of
# openapi-rb-drift. Unlike that one it NEVER skips: openapi-typescript needs only
# Node, so there is no environment in which we would rather guess than check.
script = ["bash ${CARGO_MAKE_WORKING_DIRECTORY}/.github/scripts/check-temper-ts-drift.sh"]

[tasks.openapi-check]
description = "Verify the committed openapi.json matches a fresh emission from the router"
# Delegates to the script so CI and local dev run identical logic. CI cannot call
# cargo-make at all: the root Makefile.toml requires a ./.env that no runner has.
script = ["bash ${CARGO_MAKE_WORKING_DIRECTORY}/.github/scripts/check-openapi-spec.sh"]

[tasks.openapi-routes-check]
description = "Verify every plain .route(...) mount is on the operator-only allowlist"
script = ["bash ${CARGO_MAKE_WORKING_DIRECTORY}/.github/scripts/check-openapi-routes.sh"]

[tasks.openapi-validate]
description = "Validate the committed openapi.json with openapi-generator (requires Docker)"
# Deliberately NOT a CI gate. It pulls a ~1GB image for the same signal that
# `openapi::tests::every_schema_ref_resolves` and
# `openapi::tests::operation_ids_are_present_and_unique` give in milliseconds --
# those two tests guard the defects we know about (dangling $refs, duplicate
# operationIds). This task catches the ones we don't: run it when changing the
# shape of the contract, and before cutting a client SDK.
script = [
  "docker run --rm -v ${CARGO_MAKE_WORKING_DIRECTORY}:/local openapitools/openapi-generator-cli validate -i /local/openapi.json"
]

# =============================================================================
# Docker Tasks
# =============================================================================

[tasks.db-migrate]
description = "Apply any pending sqlx migrations to the development database (idempotent)"
# Kept separately callable so a `git pull` that lands migrations can be reconciled without
# cycling the container.
# Runs the `temper-migrate` binary, not `sqlx migrate run`. The applying is still sqlx's
# `Migrator` — the runner is a `Migrate` decorator, not a reimplementation — but it brackets each
# apply so a migration that FAILS leaves a `failed` entry in `kb_migration_ledger` and one that
# CRASHES leaves a `pending` that blocks the next run. Neither is recordable from inside a
# migration: sqlx wraps the body and its bookkeeping in one transaction, so a failure rolls back
# anything that transaction wrote. See crates/temper-migrate/src/ledger.rs.
script = ['''
cargo run -q -p temper-migrate --bin temper-migrate
''']

[tasks.docker-up]
description = "Start PostgreSQL development database and bring its schema up to date"
# `--wait` blocks until the compose healthcheck passes; without it the migrate step races the
# container and fails on a connection refused.
#
# Migrating here rather than leaving it to the caller fixes a trap that cost real time more than
# once. `sqlx`'s compile-time `query!` macros read `.env` (sqlx-macros-core depends on dotenvy), so
# a **bare** `cargo check`/`cargo nextest` picks up `DATABASE_URL` and verifies queries against the
# LIVE dev database — the committed `.sqlx` cache is bypassed. (`cargo make` tasks are immune: this
# repo sets `SQLX_OFFLINE = "true"` globally in Makefile.toml, which is why the failure only ever
# shows up outside cargo-make.) So the moment the dev DB drifts behind `migrations/`, every query!
# touching a new column fails with:
#
#     error[E0282]: type annotations needed ... cannot infer type
#
# which names neither sqlx nor migrations, and reads like a stale-query-cache problem. It is not —
# regenerating the cache will not fix it. A container that is running but a migration behind is the
# whole cause, so starting it and migrating it are one step.
dependencies = ["docker-start", "db-migrate"]

[tasks.docker-start]
private = true
description = "Start the compose stack and block until Postgres reports healthy"
script = ["docker compose up -d --wait"]

[tasks.docker-down]
description = "Stop PostgreSQL development database"
script = ["docker compose down"]

[tasks.docker-down-volumes]
description = "Stop PostgreSQL and remove data volumes"
script = ["docker compose down -v"]
