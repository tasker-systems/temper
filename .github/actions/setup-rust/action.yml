name: "Setup Rust"
description: "Rust toolchain + build cache + the cargo tools a job actually needs. One place, so cache keys and tool versions cannot drift between jobs."
author: "Tasker Systems"

# Why this exists as a composite action:
#
# The toolchain / cache / tool-install preamble was repeated in every Rust job, and the cache
# `prefix-key` was hand-copied — which means two jobs that SHOULD share a warm cache silently stop
# sharing one the moment somebody edits a key in only one place.
#
# `tools` is an explicit input rather than "install everything", because installing llvm-cov in a job
# that never measures coverage is pure wall-clock.
#
# `mold` and `debuginfo` are ON by default: every job that compiles through here links with mold and
# builds `line-tables-only` debuginfo. Both are scoped to the JOB. Neither may move into
# `.cargo/config.toml` or `[profile.dev]`, which developers, Vercel's Rust build and the release jobs
# all share. tasker-core set mold globally (`22cf5c82`) and broke its release matrix and every
# Docker build.
#
# Measured (task 01a10ec4-bc50-7400-b5d3-ccd1563ff1f0; research Finding 9):
#   * `line-tables-only` keeps backtrace frames with file:line (7 frames in place, the same as
#     debug = 2), and cuts the Integration selection's target/ from 70.1 to 55.3 GB.
#   * `debug = 0` would cut more, and loses every frame's file:line. Do not "optimize" to it.
# The debuginfo export happens BEFORE the cache step, because rust-cache keys on CARGO_* env: a
# change of level is a new cache, never a stale one.

inputs:
  cache-prefix:
    description: "Build-cache key prefix. Jobs with the SAME feature set should share a prefix; jobs with different feature sets must not (their target/ dirs differ)."
    required: false
    default: "test-v2"
  tools:
    description: "Comma-separated cargo tools for taiki-e/install-action (e.g. `nextest`, `nextest,sqlx-cli`, `nextest,sqlx-cli,cargo-llvm-cov`)."
    required: false
    default: "nextest"
  mold:
    description: "Link with mold for this job (`rui314/setup-mold` makes it the job's default linker). \"true\" or \"false\"."
    required: false
    default: "true"
  debuginfo:
    description: "Exported as CARGO_PROFILE_DEV_DEBUG for this job. Empty keeps the committed [profile.dev] (debug = 2)."
    required: false
    default: "line-tables-only"

runs:
  using: "composite"
  steps:
    - name: Setup Rust toolchain
      uses: dtolnay/rust-toolchain@stable

    - name: Set CI debuginfo
      if: inputs.debuginfo != ''
      shell: bash
      env:
        LEVEL: ${{ inputs.debuginfo }}
      run: echo "CARGO_PROFILE_DEV_DEBUG=${LEVEL}" >> "$GITHUB_ENV"

    - name: Link with mold
      if: inputs.mold == 'true'
      uses: rui314/setup-mold@v1

    - name: Setup Rust build cache
      uses: Swatinem/rust-cache@v2
      with:
        prefix-key: ${{ inputs.cache-prefix }}

    # One install-action call, not one per tool: it resolves prebuilt binaries, so this is seconds
    # rather than the minutes a `cargo install` would cost.
    - name: Install cargo tools
      uses: taiki-e/install-action@v2
      with:
        tool: ${{ inputs.tools }}
