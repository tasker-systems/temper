name: "Tune test Postgres"
description: "Turn off durability (fsync, synchronous_commit, full_page_writes) and raise max_locks_per_transaction to 256 on a CI Postgres service container, then verify all four."
author: "Tasker Systems"

# Why: a CI Postgres is disposable, so durability buys nothing, while every #[sqlx::test] (~2,600 of
# them) creates, migrates and drops its own database, and each of those commits pays for an fsync.
# A service container takes no command-line flags in GitHub Actions, which is why this is an ALTER
# SYSTEM rather than `-c fsync=off`.
#
# `max_locks_per_transaction = 256` is the value `docker-compose.yml` runs locally, so CI and a local
# run have the same shared lock table: `max_locks_per_transaction × max_connections` locks, 6,400 at the
# default 64. Every test runs the migration chain in parallel, and the reset fixtures drop and rebuild
# it; a transaction that finds the table full fails with `53200 out of shared memory`. The fixtures are
# kept inside the default as well (`temper_substrate::test_schema`, which states the measured peaks),
# so this is headroom, not what keeps them green. The setting is read only at server start, so this
# step restarts the container; the durability settings, written by the same ALTER SYSTEM, survive the
# restart.
#
# NEVER for anything but a throwaway CI container: with these off, a crash can corrupt the cluster.
#
# The verify step is what makes this fail loud. Without it, a silently ignored ALTER (wrong
# container, wrong user) would read as "the lever did nothing", and a lost lock setting as a
# `53200` in whichever tests happened to overlap.
#
# Usage: `with: { container: ${{ job.services.postgres.id }} }`

inputs:
  container:
    description: "The service container id: `job.services.postgres.id`."
    required: true
  user:
    description: "A superuser in that container."
    required: false
    default: "temper"

runs:
  using: "composite"
  steps:
    - name: Turn off durability, raise the lock table, then verify
      shell: bash
      env:
        CONTAINER: ${{ inputs.container }}
        PGUSER_NAME: ${{ inputs.user }}
      run: |
        set -euo pipefail
        psql() { docker exec "$CONTAINER" psql -U "$PGUSER_NAME" -d postgres -v ON_ERROR_STOP=1 -Atc "$1"; }
        for setting in fsync synchronous_commit full_page_writes; do
          psql "ALTER SYSTEM SET ${setting} = off"
        done
        psql "ALTER SYSTEM SET max_locks_per_transaction = 256"
        docker restart "$CONTAINER" >/dev/null
        ready=""
        for _ in $(seq 1 30); do
          if docker exec "$CONTAINER" pg_isready -U "$PGUSER_NAME" -d postgres >/dev/null 2>&1; then
            ready=yes
            break
          fi
          sleep 1
        done
        if [ -z "$ready" ]; then
          echo "::error title=Test Postgres not tuned::the container did not accept connections within 30s of its restart"
          exit 1
        fi
        verify() {
          local value
          value=$(psql "SHOW $1")
          echo "$1 = ${value}"
          if [ "$value" != "$2" ]; then
            echo "::error title=Test Postgres not tuned::$1 is '${value}' after ALTER SYSTEM + restart, not '$2'"
            exit 1
          fi
        }
        for setting in fsync synchronous_commit full_page_writes; do
          verify "$setting" off
        done
        verify max_locks_per_transaction 256
