name: CI Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Least privilege. The org default is `default_workflow_permissions: write`,
# which grants EVERY scope — including `actions: write` and `contents: write` —
# to any job that does not say otherwise. This repo now publishes SIGNED
# release artifacts, so a compromised action or build.rs in a test job would
# reach a signing oracle: create a tag at an attacker commit, then
# workflow_dispatch release.yml against it, and the backdoor is attested.
# (A tag pushed with GITHUB_TOKEN does not itself trigger release.yml — GitHub
# suppresses workflow runs from GITHUB_TOKEN-authored events — which is why the
# dispatch step matters and why `actions: write` is the scope that completes
# the chain.) Declaring any permissions block zeroes every unlisted scope.
permissions:
  contents: read

# Supersede in-flight PR runs; never supersede a run on main.
#
# WHY THE TWO HALVES DIFFER, AND WHY THIS IS NOT ONE SETTING
#   A PR gets pushed to repeatedly, and every push started a fresh full pipeline while the
#   previous one kept running to completion. Measured on PR #761: six pushes 3-5 minutes
#   apart produced SIX complete runs (32608585885, 32608795218, 32608948684, 32609109218,
#   32609251193, 32609474823), and only the last one's verdict gated anything. At ~67
#   minutes of compute per run that is ~400 minutes to answer one question.
#
#   The post-merge run on main is the OPPOSITE case and must never be cancelled. It is the
#   only thing that catches semantic merge skew — a PR that was green against its own base
#   but is wrong against the main it landed on — and each merge commit's run is the only
#   run that commit will ever get. Cancelling one because the next merge arrived would
#   leave a commit on main with no verdict at all.
#
#   `cancel-in-progress` therefore reads the event rather than being a constant, and the
#   group keys on the PR number so two PRs never contend, falling back to the ref for
#   pushes so main has a group of its own.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # ==========================================================================
  # Stage 0: Detect change scope
  # Analyzes changed files so a change with nothing load-bearing in it — pure
  # docs, or a non-product tree like scripts/wayfind-spike — skips the whole
  # pipeline.
  # Everything else runs the full pipeline. ~15s.
  # ==========================================================================
  detect-scope:
    name: Detect CI Scope
    runs-on: ubuntu-latest
    outputs:
      docs-only: ${{ steps.detect.outputs.docs-only }}
      skip-all: ${{ steps.detect.outputs.skip-all }}
      non-product: ${{ steps.detect.outputs.non-product }}
      rust-inert: ${{ steps.detect.outputs.rust-inert }}
      run-code-quality: ${{ steps.detect.outputs.run-code-quality }}
      run-rust-quality: ${{ steps.detect.outputs.run-rust-quality }}
      run-test-rust: ${{ steps.detect.outputs.run-test-rust }}
      run-test-typescript: ${{ steps.detect.outputs.run-test-typescript }}
      run-test-ruby: ${{ steps.detect.outputs.run-test-ruby }}
      run-test-python: ${{ steps.detect.outputs.run-test-python }}
      run-test-agents-ts: ${{ steps.detect.outputs.run-test-agents-ts }}
      scope-summary: ${{ steps.detect.outputs.scope-summary }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Detect change scope
        id: detect
        run: |
          chmod +x .github/scripts/detect-ci-scope.sh
          .github/scripts/detect-ci-scope.sh --github-output --verbose

      - name: Annotate scope
        run: echo "::notice title=CI Scope::${{ steps.detect.outputs.scope-summary }}"

  # ==========================================================================
  # Stage 1: Parallel quality + test jobs (skipped on docs-only changes)
  # ==========================================================================
  # code-quality is INVOKED for every change that owes it anything at all — which
  # includes a docs-only change, because the docs/ publish-safety gate lives in
  # its pure-bash guard-tests job. Both heavy jobs inside it are separately
  # gated, so being invoked is cheap: rust-quality by run-rust-quality (off for a
  # rust-inert change, one whose every non-doc file is in a Rust-inert tree), and
  # typescript-quality by run-typescript-quality, which rides the existing
  # run-test-typescript output. A docs-only change therefore turns BOTH off and
  # runs guard-tests alone. See detect-ci-scope.sh.
  code-quality:
    needs: detect-scope
    if: needs.detect-scope.outputs.run-code-quality == 'true'
    uses: ./.github/workflows/code-quality.yml
    with:
      run-rust-quality: ${{ needs.detect-scope.outputs.run-rust-quality }}
      run-typescript-quality: ${{ needs.detect-scope.outputs.run-test-typescript }}

  test-rust:
    needs: detect-scope
    if: needs.detect-scope.outputs.run-test-rust == 'true'
    uses: ./.github/workflows/test-rust.yml

  test-typescript:
    needs: detect-scope
    if: needs.detect-scope.outputs.run-test-typescript == 'true'
    uses: ./.github/workflows/test-typescript.yml

  # Path-scoped: runs only for clients/temper-rb/**, openapi.json, and its own
  # workflow. See detect-ci-scope.sh for why that scoping is safe.
  test-ruby:
    needs: detect-scope
    if: needs.detect-scope.outputs.run-test-ruby == 'true'
    uses: ./.github/workflows/test-ruby.yml

  # Path-scoped: runs only for clients/temper-py/**, openapi.json, and its own
  # workflow + gate scripts. Inert to cargo and to bun, exactly as the gem is, and
  # scoped for the same reason: nothing outside that set can move its outcome.
  #
  # `[corrected — measured on the first run]` This claimed the job pulls no container
  # image because the generator runs from the runner's JDK. It does not: the runner has
  # a Docker daemon and generate-temper-py.sh prefers it, so this job takes the same
  # container path test-ruby does. See the note in test-python.yml.
  test-python:
    needs: detect-scope
    if: needs.detect-scope.outputs.run-test-python == 'true'
    uses: ./.github/workflows/test-python.yml

  # Path-scoped: runs only for clients/temper-ts/**, packages/agent-workflows/**,
  # tests/contracts/**, and its own workflow. Both projects are inert to cargo and
  # to bun, so nothing else can reach them. See detect-ci-scope.sh.
  test-agents-ts:
    needs: detect-scope
    if: needs.detect-scope.outputs.run-test-agents-ts == 'true'
    uses: ./.github/workflows/test-agents-ts.yml

  # ==========================================================================
  # Stage 2: CI Success Gate
  # The single check meant for branch protection. Always runs and validates
  # each job's result against whether scope said it should run — so a
  # correctly-skipped job (docs-only, or a path-scoped job like test-ruby that
  # the change cannot affect) still yields a green gate, while a failed or
  # cancelled in-scope job fails it.
  # ==========================================================================
  ci-success:
    name: CI Success
    needs: [detect-scope, code-quality, test-rust, test-typescript, test-ruby, test-python, test-agents-ts]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Validate CI results against scope
        run: |
          echo "=== CI Scope: ${{ needs.detect-scope.outputs.scope-summary }} ==="
          echo ""

          if [ "${{ needs.detect-scope.result }}" != "success" ]; then
            echo "FATAL: detect-scope failed (result=${{ needs.detect-scope.result }})"
            exit 1
          fi

          FAILED=""

          # check_job <name> <result> <should-run>
          check_job() {
            name="$1"; result="$2"; should_run="$3"
            if [ "$should_run" = "true" ]; then
              if [ "$result" = "success" ]; then
                echo "  PASS: ${name} (ran and succeeded)"
              else
                echo "  FAIL: ${name} (expected success, got ${result})"
                FAILED="${FAILED} ${name}"
              fi
            else
              if [ "$result" = "skipped" ]; then
                echo "  SKIP: ${name} (out of scope, correctly skipped)"
              elif [ "$result" = "success" ]; then
                echo "  PASS: ${name} (not in scope but succeeded anyway)"
              else
                echo "  SKIP: ${name} (not in scope, result=${result})"
              fi
            fi
          }

          check_job "code-quality" \
            "${{ needs.code-quality.result }}" \
            "${{ needs.detect-scope.outputs.run-code-quality }}"

          check_job "test-rust" \
            "${{ needs.test-rust.result }}" \
            "${{ needs.detect-scope.outputs.run-test-rust }}"

          check_job "test-typescript" \
            "${{ needs.test-typescript.result }}" \
            "${{ needs.detect-scope.outputs.run-test-typescript }}"

          check_job "test-ruby" \
            "${{ needs.test-ruby.result }}" \
            "${{ needs.detect-scope.outputs.run-test-ruby }}"

          check_job "test-python" \
            "${{ needs.test-python.result }}" \
            "${{ needs.detect-scope.outputs.run-test-python }}"

          check_job "test-agents-ts" \
            "${{ needs.test-agents-ts.result }}" \
            "${{ needs.detect-scope.outputs.run-test-agents-ts }}"

          echo ""
          if [ -n "$FAILED" ]; then
            echo "FAILED jobs:${FAILED}"
            exit 1
          fi
          echo "All required CI checks passed."
