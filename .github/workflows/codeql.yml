name: CodeQL

# CodeQL, uniform across every run.
#
# ## Why this exists instead of default setup
#
# Default setup offered no control surface for any of what this workflow needs: the fan-in
# described below; wall-clock timeouts that convert a stalled analysis into a failure the
# `codeql-override` label can release (a stall on a required gate blocks a PR forever, because
# pending is not failed and an override cannot act on a check that never reported); the
# threat-model exclusions in .github/codeql/codeql-config.yml; and tag-pinned actions.
#
# ## Why the language set is UNIFORM — every run analyzes all five
#
# This workflow originally scoped languages to what a change could reach (2026-08-28: a
# docs-only PR paid for no Rust analysis). The `code_scanning` rule on the `no-merge-main`
# ruleset (2026-08-30) made that shape unsound: the rule determines "alerts introduced by this
# pull request" by diffing each PR analysis configuration against the default branch's LATEST
# analysis for that same configuration — and that set is the UNION of whatever recent merges
# happened to analyze. Any PR narrower than the union is unmergeable, with "code scanning
# cannot determine the alerts introduced by this pull request", because a configuration
# present on the base is missing from the head. The first PR to hit it carried a workflows-and-
# docs-only change against a base whose python and ruby analyses were hours old.
#
# Scoped analysis and findings-blocking cannot coexist; findings-blocking won. The wall-clock
# cost is absorbed by parallelism on code PRs (the test shards run longer than any analysis),
# so the real cost is a docs-only PR paying ~12 minutes it used to skip — priced, and paid.
#
# Do not reintroduce scoping as an optimization without revisiting the rule: the two designs
# are mutually exclusive, and it was the second one landing that discovered it.
#
# ## Why it is NOT a required status check of its own
#
# It fans into `CI Success` (`ci.yml`) like every other job, and that is load-bearing rather
# than stylistic. **A required check that does not run is pending forever, not passing** — and
# while uniformity has removed the skip case, routing through the fan-in also keeps the
# ruleset at exactly one required context, leaves `bypass_actors: []` intact, and gives the
# `codeql-override` label one place to act.
#
# ## Deltas from the default setup this replaces, stated so they are choices and not drift
#
# - **Query suite stays `default`**, not `security-extended`. Changing the suite in the same change
#   that makes CodeQL blocking would mix "we now gate on this" with "we now find more", and a jump
#   in alert volume would be indistinguishable from the gate misbehaving.
# - **Threat model is left unset**, which is `remote` — what default setup reported.
# - **The seven configured languages collapse to five.** `javascript`, `typescript` and
#   `javascript-typescript` are one analysis; the first two were aliases.
# - **The weekly scan is preserved** by the `schedule` trigger below — with uniformity it is no
#   longer the only run covering python and ruby, but it still refreshes the default branch's
#   analyses on a week with no merges, which is exactly the week the union would otherwise go
#   stale.
# - **Actions are tag-pinned** (`@v3`), matching ordinary CI here. The SHA pinning elsewhere in this
#   repo guards the release-signing path specifically; this workflow holds `security-events: write`
#   and nothing that reaches a signing oracle.

on:
  workflow_call:
    inputs:
      rust-timeout-minutes:
        description: >-
          Wall-clock ceiling for the Rust analysis. UNMEASURED first cut — set generously on purpose.
          A stalled analysis on a required gate blocks a PR forever, because pending is not failed
          and an override cannot act on a check that never reported; the timeout is what converts a
          stall into a failure the `codeql-override` label can release. Too LOW is the expensive
          direction, since it fails legitimate runs and teaches people to reach for the override.
          Re-set this from the first ten real runs rather than leaving the guess in place.
        type: number
        required: false
        default: 45
      other-timeout-minutes:
        description: Wall-clock ceiling for every non-Rust analysis. Same reasoning, smaller surface.
        type: number
        required: false
        default: 20

  # Weekly default-branch sweep. On this trigger the inputs are unset; the `||` fallbacks in the
  # timeout expression carry the defaults so a scheduled run is bounded exactly like a PR run.
  schedule:
    - cron: "24 5 * * 1"

permissions:
  contents: read

jobs:
  analyze:
    name: Analyze
    runs-on: ubuntu-latest
    # Granted here rather than at workflow level so only the job that writes alerts holds the scope.
    # NOTE: a reusable workflow can never exceed its CALLER's permissions, so `ci.yml`'s `codeql`
    # job grants the same three; without that this is silently downgraded and the upload 403s.
    permissions:
      contents: read
      security-events: write
      actions: read
    # `||` fallbacks, not bare inputs: on the schedule trigger inputs are unset and a bare
    # reference would leave the job unbounded — the timeout is the thing that turns a stall
    # into a releasable failure, so it must exist on every trigger.
    timeout-minutes: ${{ matrix.language == 'rust' && (inputs.rust-timeout-minutes || 45) || (inputs.other-timeout-minutes || 20) }}
    strategy:
      # One language failing must not cancel the others: a partial result still files real alerts,
      # and cancelling siblings would make one flaky analysis look like four broken ones.
      fail-fast: false
      matrix:
        # The uniformity invariant, one line: every run analyzes exactly this set. The header's
        # "Why the language set is UNIFORM" is why this must not become conditional.
        language: [actions, javascript-typescript, python, ruby, rust]
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          # No compilation for any language here. Rust supports it, and requiring a build would put
          # a full cargo compile — plus whatever a build.rs wants — inside a job holding
          # `security-events: write`, on every PR that touches Rust.
          #
          # It is now load-bearing for a SECOND reason: `paths-ignore` in the config file below is
          # only honored for interpreted languages and for compiled languages analyzed WITHOUT
          # building. Restoring a build mode here silently disables that file.
          build-mode: none
          # Excludes the test and example trees, where CodeQL's `remote` threat model is false by
          # construction. The file carries the alert-by-alert reasoning and the cost.
          config-file: .github/codeql/codeql-config.yml

      - name: Analyze
        uses: github/codeql-action/analyze@v4
        with:
          category: /language:${{ matrix.language }}
