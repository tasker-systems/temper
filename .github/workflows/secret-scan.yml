# Secret scan — the in-tree secret scanner's CI half.
#
# FIELD OF VIEW, stated so green is never mistaken for more than it checked:
#   Watches: the tracked content of the checked-out tree (on a PR event, the
#   merge commit GitHub builds). The `.gitleaks.toml` allowlist beside this
#   workflow names every exception and carries its reason.
#   Does NOT watch: git history. A secret that already landed is a server-side
#   problem — GitHub push protection is that layer, and it must be enabled in
#   repo settings; this job cannot retroactively decline it. A local scan of
#   your own machine may also flag your gitignored `.env` files; CI sees only
#   what a fresh checkout contains.
#
# UNCONDITIONAL BY CONSTRUCTION, like CodeQL: this job is invoked for every
# change with no scope gate, because the docs-only skip that lets pure-docs
# changes bypass the rest of the pipeline must not apply here — a key pasted
# into a `.md` is exactly a leak. The ci-success gate reports this job as
# should-run "true" for the same reason.
#
# BLOCKING BY DECISION (2026-08-31): the tree is clean at HEAD once the
# allowlist names the committed fixture keys, and the CodeQL precedent here is
# findings-blocking. There is no eject label; if this job ever needs one, that
# is a decision to make explicitly, not a flake to absorb silently.
#
# The binary is pinned by version AND checksum — a compromised release asset
# or a changed tarball fails the download step instead of scanning.

name: Secret Scan

on:
  workflow_call:

permissions:
  contents: read

env:
  GITLEAKS_VERSION: v8.30.1

jobs:
  secret-scan:
    name: Gitleaks (tracked content)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install gitleaks (${{ env.GITLEAKS_VERSION }}, checksum-verified)
        run: |
          cd /tmp
          curl -fsSLO "https://github.com/gitleaks/gitleaks/releases/download/${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION#v}_linux_x64.tar.gz"
          curl -fsSLO "https://github.com/gitleaks/gitleaks/releases/download/${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION#v}_checksums.txt"
          grep "gitleaks_${GITLEAKS_VERSION#v}_linux_x64.tar.gz" "gitleaks_${GITLEAKS_VERSION#v}_checksums.txt" | sha256sum -c -
          tar -xzf "gitleaks_${GITLEAKS_VERSION#v}_linux_x64.tar.gz" gitleaks
          sudo install -m 0755 gitleaks /usr/local/bin/gitleaks
          gitleaks version

      - name: Scan tracked content
        run: gitleaks dir . -c .gitleaks.toml --no-banner --redact -v
