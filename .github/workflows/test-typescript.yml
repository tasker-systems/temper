name: TypeScript Tests

on:
  workflow_call:

# Least privilege. The org default is `default_workflow_permissions: write`,
# which grants EVERY scope — including `actions: write` and `contents: write` —
# to any job that does not say otherwise. This repo now publishes SIGNED
# release artifacts, so a compromised action or build.rs in a test job would
# reach a signing oracle: create a tag at an attacker commit, then
# workflow_dispatch release.yml against it, and the backdoor is attested.
# (A tag pushed with GITHUB_TOKEN does not itself trigger release.yml — GitHub
# suppresses workflow runs from GITHUB_TOKEN-authored events — which is why the
# dispatch step matters and why `actions: write` is the scope that completes
# the chain.) Declaring any permissions block zeroes every unlisted scope.
#
# Declared here and not only in ci.yml: a workflow_call'd workflow inherits the
# CALLER's permissions when it declares none, so a second caller — or a direct
# dispatch — would silently reopen this. Each file states its own floor.
permissions:
  contents: read

jobs:
  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: cd packages/temper-cloud && bun install --frozen-lockfile

      - name: Run tests
        run: cd packages/temper-cloud && bun run test

  ui-tests:
    name: UI Tests
    runs-on: ubuntu-latest
    timeout-minutes: 10

    # `svelte-kit sync` generates the `$env/static/private` module from the env vars present at
    # sync time; svelte-check then requires the imported members (DATABASE_URL, SESSION_SECRET) to
    # exist. Only their presence matters for static analysis + the unit suite — the values are
    # inert placeholders (no DB connection or session signing happens in these checks).
    env:
      DATABASE_URL: postgres://ci:ci@localhost:5432/ci
      SESSION_SECRET: ci-placeholder-session-secret

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: cd packages/temper-ui && bun install --frozen-lockfile

      - name: Type-check (svelte-check)
        run: cd packages/temper-ui && bun run check

      - name: Lint & format (Biome)
        run: cd packages/temper-ui && bun run biome

      - name: Run tests
        run: cd packages/temper-ui && bun run test

      # The web resolves the toolchain majors the design package declares, read from this working
      # tree: a web major cannot move unless packages/temper-design/toolchain/majors.json moves in
      # the same change, and the desktop takes it with its next pin of the package.
      - name: Toolchain on the declared majors
        run: cd packages/temper-ui && bun run toolchain

  # The theme contract every surface paints from (packages/temper-design): the contract is
  # valid, every theme clears the legibility floors and stays distinct, the generated CSS and
  # themes.json agree with their sources, and every broken fixture is refused. A refused
  # fixture that passes is the failure this job exists to catch.
  design-contract:
    name: Design Contract
    runs-on: ubuntu-latest
    timeout-minutes: 5

    defaults:
      run:
        working-directory: packages/temper-design

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      # uv via pipx, as test-python.yml does: one fewer third-party pin, and the interpreter
      # comes from this package's `.python-version`.
      - name: Install uv
        run: pipx install uv

      - name: Install the checker's dependencies
        run: uv sync --frozen

      - name: Self-check the contract
        run: scripts/themes.sh --self-check

      # Node from the runner image; the check and its harness need nothing installed.
      - name: The toolchain check refuses what it must
        run: node --test toolchain/check.test.mjs

      # `shared-never-binds-a-runtime`: the published modules import neither surface's runtime,
      # and the harness proves each forbidden import is refused. Nothing installed either.
      - name: The shared modules bind no runtime
        run: |
          node scripts/no-runtime.mjs
          node --test scripts/no-runtime.test.mjs

      # `web-paints-only-roles` / `no-private-colour-names`: the guard every surface runs over the
      # paths it has moved onto roles; the harness proves each class of colour is refused.
      - name: The colour guard refuses what it must
        run: node --test guard/colours.test.mjs

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: "24"

      # npm, not bun: like the TS clients, this package is not a bun workspace member. It ships
      # compiled `dist/`, consumed by temper-ui as a `file:` dependency, which bun copies rather
      # than builds — so dist/ is committed, and a src/ change that forgot to rebuild it fails here.
      - name: Install the modules' dependencies
        run: npm ci

      - name: Type-check and lint the shared modules
        run: |
          npm run typecheck
          npm run lint

      # From an empty dist/: tsc never removes the output of a deleted module (git diff sees the
      # deletion), and output that was never committed shows up as untracked.
      - name: Build and verify committed dist is current
        run: |
          rm -rf dist
          npm run build
          git diff --exit-code --stat -- dist && [ -z "$(git ls-files --others -- dist)" ] \
            || { git ls-files --others -- dist; echo "::error::dist/ is stale — run 'rm -rf dist && npm ci && npm run build' in packages/temper-design and commit the result"; exit 1; }

      # The sanitize battery is `rendering-agrees`: every surface renders through this one pass.
      - name: The shared modules' tests
        run: npm test

  integration-tests:
    name: Integration Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: pgvector/pgvector:0.8.2-pg18-trixie
        env:
          POSTGRES_DB: temper_development
          POSTGRES_USER: temper
          POSTGRES_PASSWORD: temper
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5437:5432
        options: >-
          --health-cmd "pg_isready -U temper -d temper_development"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://temper:temper@localhost:5437/temper_development
      TEST_DATABASE_URL: postgresql://temper:temper@localhost:5437/temper_development

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Install Tesseract OCR
        run: sudo apt-get update && sudo apt-get install -y tesseract-ocr tesseract-ocr-eng

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Setup Rust build cache
        uses: Swatinem/rust-cache@v2
        with:
          prefix-key: ts-integration-v1

      - name: Install cargo-sqlx
        uses: taiki-e/install-action@v2.87.29
        with:
          tool: sqlx-cli

      - name: Run database migrations
        run: cargo sqlx migrate run

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: cd packages/temper-cloud && bun install --frozen-lockfile

      - name: Run integration tests
        run: cd packages/temper-cloud && bun run test:integration
