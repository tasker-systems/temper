name: Code Quality

on:
  workflow_call:
    inputs:
      # Gate the heavy rust-quality job WITHOUT gating the whole workflow: a
      # rust-inert change (every non-doc file in a Rust-inert tree — see
      # detect-ci-scope.sh) still needs the typescript-quality and guard-tests
      # jobs below, so ci.yml keeps invoking this workflow and only turns
      # rust-quality off. Defaults 'true' so a direct dispatch or a second caller
      # that passes nothing runs the full job — the conservative direction.
      run-rust-quality:
        required: false
        type: string
        default: 'true'

# Least privilege. The org default is `default_workflow_permissions: write`,
# which grants EVERY scope — including `actions: write` and `contents: write` —
# to any job that does not say otherwise. This repo now publishes SIGNED
# release artifacts, so a compromised action or build.rs in a test job would
# reach a signing oracle: create a tag at an attacker commit, then
# workflow_dispatch release.yml against it, and the backdoor is attested.
# (A tag pushed with GITHUB_TOKEN does not itself trigger release.yml — GitHub
# suppresses workflow runs from GITHUB_TOKEN-authored events — which is why the
# dispatch step matters and why `actions: write` is the scope that completes
# the chain.) Declaring any permissions block zeroes every unlisted scope.
#
# Declared here and not only in ci.yml: a workflow_call'd workflow inherits the
# CALLER's permissions when it declares none, so a second caller — or a direct
# dispatch — would silently reopen this. Each file states its own floor.
permissions:
  contents: read

jobs:
  rust-quality:
    name: Rust Quality
    # Skipped for a rust-inert change (TS/SDK-only). The guard-tests and
    # typescript-quality jobs below carry NO such gate — they always run when
    # this workflow is invoked, because a TS-only change still needs them.
    if: inputs.run-rust-quality == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20

    # All `sqlx::query!()` macros here verify OFFLINE against the committed workspace .sqlx cache
    # (SQLX_OFFLINE below). The Postgres service + `cargo sqlx migrate run` step remain as a cheap
    # migrations-apply smoke check (every migration must apply cleanly).
    services:
      postgres:
        image: pgvector/pgvector:0.8.2-pg18-trixie
        env:
          POSTGRES_DB: temper_development
          POSTGRES_USER: temper
          POSTGRES_PASSWORD: temper
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5437:5432
        options: >-
          --health-cmd "pg_isready -U temper -d temper_development"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://temper:temper@localhost:5437/temper_development
      # Verify query macros against the committed .sqlx caches (see the note above the service block).
      SQLX_OFFLINE: "true"

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Setup Rust build cache
        uses: Swatinem/rust-cache@v2
        with:
          prefix-key: code-quality

      - name: Install cargo-sqlx, cargo-make, and cargo-audit
        uses: taiki-e/install-action@v2.85.11
        with:
          # cargo-make is here for the ts-rs drift gate below, which invokes
          # `cargo make generate-ts-types` — deliberately the same entry point a developer runs,
          # so the gate cannot check a different generator than the one people use.
          #
          # cargo-audit is installed here as a PINNED prebuilt binary rather than via
          # `cargo install cargo-audit --locked` (which resolves + compiles the tool unpinned on
          # every run — flagged in the 2026-07-29 supply-chain review). The advisory DATABASE is
          # still fetched fresh at audit time; only the tool binary is pinned.
          tool: sqlx-cli,cargo-make,cargo-audit

      - name: Run migrations
        run: cargo sqlx migrate run

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Run Clippy lints
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

      - name: Check OpenAPI spec is up to date with the router
        run: bash .github/scripts/check-openapi-spec.sh

      - name: Check every route is documented (OpenAPI route allowlist)
        run: bash .github/scripts/check-openapi-routes.sh

      # docs/ is synced wholesale to the public documentation site, so the safety property is
      # structural: everything under docs/ is public, and nothing else lives there. It was got
      # wrong once and published internal security audits. `cargo make check` runs this too, but
      # no CI job runs cargo-make, so until this step existed the invariant was enforced only on
      # whichever laptop happened to run the full local check. `^docs/` is in detect-ci-scope's
      # RUST_COUPLED for the other half of the same hole: the regression this catches is a tree
      # of `.md` files, which the extension test would otherwise classify docs-only and skip.
      - name: Check docs/ holds only public documentation
        run: bash .github/scripts/check-docs-public-only.sh

      # `Makefile.toml` declares `env_files = ["./.env"]`, and cargo-make treats a missing env file
      # as a HARD ERROR — there is no `required = false` (measured: the object form still fails).
      # `.env` is gitignored, so EVERY `cargo make` task fails on a fresh checkout. That has been
      # invisible until now only because no CI job ran cargo-make and every dev machine has a `.env`
      # from setup (`.env.template` → `.env`, per the comment on that line).
      #
      # An EMPTY file rather than a copy of `.env.template`: env_files are loaded into the
      # environment, so a populated one could override this job's own DATABASE_URL / SQLX_OFFLINE
      # with template values. Empty satisfies cargo-make and sets nothing.
      - name: Bootstrap an empty .env (cargo-make requires the file to exist)
        run: touch .env

      # The cross-LANGUAGE gate. Every other check in this job lives inside Rust, so a type and its
      # generated TypeScript mirror can disagree while both languages stay green — which is exactly
      # how PR #498 merged with tsc clean and 79/79 tests passing against a contract the server had
      # stopped emitting. Its harness is in the guard-tests job; it runs here because it needs cargo.
      - name: Check generated TypeScript types are up to date with the Rust (ts-rs drift)
        run: bash .github/scripts/check-ts-rs-drift.sh

      # The same shape one tier up: `agent-skills/` is a committed projection of shared templates,
      # so an edited template with an un-re-emitted tree ships a skill that disagrees with its own
      # source. Hand-maintained, that tree taught doc types temper has never had. Its harness is in
      # the guard-tests job; it runs here because the emit needs cargo.
      - name: Check the committed agent-skills projection is up to date (skills drift)
        run: bash .github/scripts/check-skills-drift.sh

      # Security tripwires (internal/development/security-audit-playbook.md). Pure static enumerators:
      # each pins a security-relevant set (grant write-sites, unauthenticated routes, handler-side
      # authz) against a reviewed baseline and fails when the set grows silently. They prove nothing
      # on their own — they force a reviewer to answer the attenuation / auth-posture question.
      - name: Security tripwire — grant write-sites (capability attenuation review)
        run: bash .github/scripts/audit-grant-sinks.sh

      - name: Security tripwire — route auth posture
        run: bash .github/scripts/audit-route-auth.sh

      - name: Security tripwire — handler-side authz drift
        run: bash .github/scripts/audit-handler-authz-drift.sh

      # Unlike the three above, this one is not only a baseline tripwire: the pairwise-distinctness
      # of the gates' secrets is computed from the source, so UPDATE_BASELINE cannot silence it.
      - name: Security tripwire — internal signature gates use distinct secrets
        run: bash .github/scripts/audit-signature-secrets.sh

      - name: Security tripwire — credential types deriving Debug
        run: bash .github/scripts/audit-credential-debug.sh

      # The `__temper_ungated_` find cores apply NO visibility gate — they are handed the RBAC
      # verdict as `p_visible_ids uuid[]` so a composition computes it once instead of once per
      # stage. For those bodies the invariant "every mechanic acts only on resources visible to the
      # principal" is held by this script and by the single compiler emitter, and by nothing else.
      # It is NOT a database permission: the app connects as the owning role, so psql can call one
      # directly. Accepted residue, stated in the script's own header.
      - name: Security tripwire — ungated find fragments and who names them
        run: bash .github/scripts/audit-ungated-fragments.sh

      # Not a security tripwire — a PROVENANCE one. Three planning sessions on the /api/query arc
      # were spent undoing "firm decisions" that no human took: an agent writes a design paragraph
      # in the first person, nothing marks it unratified because our prose voice for a decision and
      # for a proposal are identical, and it hardens — worst of all into a TEST NAME, which every
      # later agent greps and reads as settled. The discriminator already existed and cost nothing
      # to omit: every real decision in these files carries `[decided — DATE, WHO]` or an ADJ
      # number. This makes omitting it cost something. See the script header for the specimen.
      - name: Provenance tripwire — decision-voiced prose nobody signed
        run: bash .github/scripts/audit-unattributed-decisions.sh

      # Not a security tripwire — a COVERAGE one, and it sits here because it is the same shape:
      # a pinned set that makes an exception a declaration rather than a place to put things.
      #
      # "Every test must run in CI, or loudly declare why it does not" was enforced on the
      # ENABLEMENT half only. That half holds: selection is `--workspace`, and every feature gate
      # maps to a job. The DECLARATION half had nothing, and on 2026-08-05 two of the three
      # `#[ignore]` reasons that were finally checked turned out to be FALSE — both blaming a
      # search defect that no longer existed, while the real blocker was a one-line fixture fix.
      # A stale reason is worse than no reason: it is what stops anyone re-examining.
      - name: Coverage tripwire — the set of #[ignore]d tests
        run: bash .github/scripts/audit-ignored-tests.sh

      # Not a security tripwire — a CONTRACT one, and it exists to keep an argument honest.
      # PR D stopped `internal/api/query.openapi.yaml` restating 31 schemas `openapi.json` already
      # publishes, on the grounds that "a restatement can drift; a `$ref` cannot." True about
      # drift, silent about the other failure: a `$ref` whose target is renamed away does not
      # drift, it DANGLES, and nothing in this repo reads that file. Rename a Rust type — an
      # ordinary refactor `cargo make openapi` regenerates around without complaint — and the
      # contract points at nothing, forever, quietly. Without this the split would have traded 34
      # eventually-loud drift sites for 31 permanently silent ones.
      - name: Contract tripwire — hand-written $refs resolve in openapi.json
        run: bash .github/scripts/audit-contract-crossrefs.sh

      # Not a baseline tripwire either: it reads build-cli-binaries.yml directly. Deleting the
      # `.manifest.json` line from the attestation's `subject-path` is a silent one-line edit —
      # the signing job still succeeds, the archive is still attested — that defeats both
      # `temper version --verify --online` and `temper update`'s manifest attestation, which key
      # on the MANIFEST's own digest. The first symptom would otherwise be a real release failing
      # in a user's terminal.
      - name: Security tripwire — attestation covers archive AND manifest
        run: bash .github/scripts/audit-attest-subject-path.sh

      # Not a security tripwire — a correctness one, and it protects another safeguard rather than
      # the product. A runtime `sqlx::query` leaves no `.sqlx` cache entry, so it is invisible to
      # the schema/binary change detector that reads that cache. This pins the 46 queries that are
      # legitimately exempt, each against a written reason, so a 47th cannot appear silently. The
      # prose rule it enforces has existed (unenforced) in code-quality-best-practices.md for
      # months; when finally measured, 66 of 112 runtime sites had no reason at all.
      - name: Tripwire — non-macro SQL queries are declared exceptions
        run: bash .github/scripts/audit-sqlx-macro-exceptions.sh

      - name: Check documentation builds
        run: cargo doc --workspace --no-deps --document-private-items
        env:
          RUSTDOCFLAGS: -D warnings

      - name: Install cargo-machete
        run: cargo install cargo-machete --locked

      - name: Check for unused dependencies
        run: cargo machete --with-metadata

      # BLOCKING (no continue-on-error): an advisory gate that can never fail is
      # decorative. It reds the build on any NEW advisory; the ONLY escape hatch
      # is the short, reviewed ignore list in `.cargo/audit.toml`, where every
      # grandfathered id carries a reason and a status. rsa (RUSTSEC-2023-0071)
      # is ignored there and is not even compiled into temper (sqlx-mysql's dep;
      # we build only the postgres backend), so this gate never blocks on it.
      # The tool is installed pinned above; the advisory DB is still fetched
      # fresh here.
      - name: Security audit
        run: cargo audit

  # The guards' own tests. Every script above is a bash tripwire whose entire value is that it
  # FAILS when the thing it protects is broken — and nothing about a passing tripwire distinguishes
  # "the invariant holds" from "this script can no longer fail". These harnesses feed each guard a
  # deliberately broken fixture and assert it goes red, which is the only evidence that the green
  # tick above means anything.
  #
  # This job exists because two of these harnesses (test-detect-ci-scope, test-check-openapi-routes)
  # were committed with a `bash …` usage line and wired into NO job — so they ran nowhere, and the
  # guards they cover had no standing proof they still bit. Same rot as `streaming_ingest_test` and
  # the `scenario-schema` feature: a test no job runs is a test that runs nowhere.
  #
  # Pure bash, no toolchain, no services — it is deliberately cheap so there is no reason to scope
  # it away later. Adding a guard means adding its harness HERE, in the same PR.
  guard-tests:
    name: CI Guard Tests
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      # depth 2, not 0. The wire diff needs ONE base revision, not 246 commits of history — a full
      # clone is ~445 MB and this job exists to be cheap enough that nobody is ever tempted to scope
      # it away. Depth 2 covers a push (HEAD~1); a pull_request gets its base fetched explicitly
      # below, one commit deep.
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 2

      # Named, visible, and separate so that "we could not get the base" shows up as this step
      # failing rather than as a check quietly deciding nothing moved. sqlx-wire-diff.sh also
      # attempts this fetch itself; if BOTH fail it exits 2, and the cross-check turns that into a
      # failure whenever the change carries a migration. "I could not look" never renders as
      # "nothing moved".
      - name: Fetch the base revision (for the wire diff)
        if: github.event_name == 'pull_request'
        run: git fetch --depth=1 origin "${{ github.event.pull_request.base.sha }}"

      - name: Guard test — detect-ci-scope
        run: bash .github/scripts/test-detect-ci-scope.sh

      - name: Guard test — check-openapi-routes
        run: bash .github/scripts/test-check-openapi-routes.sh

      - name: Guard test — audit-route-auth (per-builder layer wiring)
        run: bash .github/scripts/test-audit-route-auth.sh

      - name: Guard test — audit-signature-secrets (distinct keys)
        run: bash .github/scripts/test-audit-signature-secrets.sh

      - name: Guard test — audit-credential-debug
        run: bash .github/scripts/test-audit-credential-debug.sh

      - name: Guard test — audit-grant-sinks (SQL half)
        run: bash .github/scripts/test-audit-grant-sinks.sh

      - name: Guard test — audit-ungated-fragments
        run: bash .github/scripts/test-audit-ungated-fragments.sh

      # Five probes, and two of them exist because the guard's own first run was green for the wrong
      # reason: `awk -v` had eaten a backslash out of the attribution pattern, and a `grep -v` on an
      # empty baseline was exiting 1 under `pipefail` before any comparison ran — so the red probe
      # was passing on a crash. Claim 1 therefore asserts the OUTPUT names the flagged file, not
      # merely that the exit code is non-zero.
      - name: Guard test — audit-unattributed-decisions
        run: bash .github/scripts/test-audit-unattributed-decisions.sh

      # Spec §1's "silence is a failure" half. The checker itself lives in this job rather than in
      # rust-quality because it parses migrations/*.sql and needs no toolchain and no database —
      # which is also what makes it cheap enough that there is never a reason to scope it away.
      # It runs BEFORE its harness so a real undeclared migration is reported as itself, not as a
      # failing test case.
      - name: Every migration declares its class (silence fails)
        run: bash .github/scripts/audit-migration-declarations.sh

      - name: Guard test — audit-migration-declarations
        run: bash .github/scripts/test-audit-migration-declarations.sh

      # Spec §3's routing half depends on reading the SAME declaration the checker above reads,
      # from a SECOND parser in a different language: the awk one runs here over migrations/*.sql,
      # and a Rust twin runs inside the migration runner over the SQL the binary carries, because a
      # PENDING migration's class is not in the database yet. The drift has teeth in one direction —
      # a Rust half reading `additive` where the call says `shape-breaking` auto-applies an
      # operator-gated migration, which is the 2026-07-30 outage re-entered through its own cure.
      # Both halves answer to scripts/migration-declaration-corpus.txt; this is the awk side of that
      # check, and migrate_ledger.rs::declaration_corpus_matches_the_shell is the Rust side.
      - name: Guard test — migration-declaration parity (awk half of the shared corpus)
        run: bash .github/scripts/test-migration-declaration-parity.sh

      # Spec §2. The cross-check runs the wire diff itself and prints its output, so there is one
      # step rather than two — but both harnesses run below, so a broken differ cannot hide behind
      # a cross-check that never reaches it.
      #
      # Deliberately asymmetric: a wire move with nothing declaring shape-breaking FAILS, while a
      # shape-breaking declaration with an empty wire diff PASSES (noted). The caches only see what
      # a compile-checked query touches, so a real break can be invisible to them, and failing an
      # honest over-declaration would train under-declaration — the behaviour that produced the
      # 2026-07-30 outage.
      - name: A migration's classification survives the compiler's record (cross-check)
        env:
          GITHUB_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: bash .github/scripts/sqlx-schema-crosscheck.sh

      - name: Guard test — sqlx-wire-diff
        run: bash .github/scripts/test-sqlx-wire-diff.sh

      - name: Guard test — sqlx-schema-crosscheck
        run: bash .github/scripts/test-sqlx-schema-crosscheck.sh

      # The Ignored Build Step's polarity is inverted (exit 0 skips, exit 1 builds), so a
      # sign error there stops production deploying while every check stays green. This
      # harness asserts both directions, and that a path merely CONTAINING "migrations"
      # does not trigger a build.
      - name: Guard test — vercel-ignore-build (polarity + migration scoping)
        run: bash .github/scripts/test-vercel-ignore-build.sh

      # Its sibling: ignore-build decides WHETHER to build, vercel-build decides what the build does
      # to the schema. Three things live only in that script and would otherwise be exercised for
      # the first time in a production deploy — which connection it migrates over (pooled would fail
      # only under concurrency), what a missing DATABASE_URL means (skip, loudly), and that a halted
      # run FAILS the deploy rather than shipping a binary ahead of its schema.
      - name: Guard test — vercel-build (connection choice, skip, and the halt)
        run: bash .github/scripts/test-vercel-build.sh

      # The gate itself needs cargo, so it runs in rust-quality; this harness stubs the generator
      # and therefore stays pure bash, which is what lets it live in this job at all.
      - name: Guard test — check-ts-rs-drift
        run: bash .github/scripts/test-check-ts-rs-drift.sh

      # Same seam, same reason: the gate needs cargo to emit, this harness stubs the emit and so
      # stays pure bash. Two of its cases are the ones that matter — an emit that succeeds while
      # writing nothing, and one whose report the gate can no longer read. Both would otherwise
      # leave the gate green having compared nothing.
      - name: Guard test — check-skills-drift
        run: bash .github/scripts/test-check-skills-drift.sh

      # The skill BUNDLE packager. Its output is consumed by two things that fail late and
      # unhelpfully — Claude's Skills uploader (exact archive layout) and create-github-release.sh
      # (whose manifest guard keys on the FILE NAME) — so the cheap checks live here rather than
      # being discovered in a release job or by a user's failed upload.
      - name: Guard test — package-skill
        run: bash .github/scripts/test-package-skill.sh

      # Release-integrity harnesses. emit-manifest produces the per-file manifest the CLI parses;
      # test-install drives install.sh with a locally-built archive. Both are pure bash and belong
      # here for the same reason as the rest: a manifest generator that silently emitted constant
      # hashes, or an installer that stopped verifying, would leave every other check green.
      #
      # The CROSS-LANGUAGE half of the manifest contract is deliberately NOT a step here. The step
      # below and the golden fixture each prove the wire format from one side only — a rename applied
      # consistently across both bash sides passes both while the Rust deserializer silently stops
      # parsing. Closing that needs real producer bytes in the real deserializer, which needs cargo:
      # `manifest.rs::producer_bytes_deserialize_and_verify_through_this_module` shells out to
      # emit-manifest.sh, and `a_renamed_producer_field_breaks_the_round_trip` is its bite. It rides
      # the `--workspace` selection in test-rust.yml's unit job rather than getting a named step —
      # naming individual tests in CI is the hand-written-list antipattern that job's header forbids.
      - name: Guard test — emit-manifest
        run: bash .github/scripts/test-emit-manifest.sh

      - name: Guard test — install.sh
        run: bash scripts/install/test-install.sh

      # The producer half of the manifest contract. install.sh deliberately
      # installs when no manifest is published (`unverifiable`, not `mismatch` —
      # pre-v0.2.7 releases have none and must stay installable), which means a
      # release that silently loses its manifest looks identical to one that
      # never had it. This is the only place that can refuse.
      - name: Guard test — create-github-release (manifest presence)
        run: bash .github/scripts/test-create-github-release.sh

      # The SHELL half of the containment-parity check. The Rust half rides the
      # `--workspace` selection in test-rust.yml's unit job
      # (`manifest.rs::containment_corpus_matches_the_shell`) — both read
      # `scripts/install/containment-corpus.txt`, so agreement with the corpus is
      # agreement between the two languages. One-sided edits to either predicate
      # now fail on the side that was edited; they used to drift in silence.
      - name: Guard test — containment parity (sh vs Rust)
        run: bash .github/scripts/test-containment-parity.sh

      - name: Guard test — audit-attest-subject-path
        run: bash .github/scripts/test-audit-attest-subject-path.sh

      # Most of what this exercises is the ENUMERATOR the tripwire shells out to, because the
      # tripwire's coverage is exactly that enumerator's coverage. Its turbofish case is a real
      # regression: `(?:::<[^>]*>)?` cannot cross `Option<String>`, which hid 10 production sites
      # and left the old script reporting exactly the allow-list's own size.
      - name: Guard test — audit-sqlx-macro-exceptions
        run: bash .github/scripts/test-audit-sqlx-macro-exceptions.sh

      # Every arm is a mutation: break one thing the tripwire claims to catch and require it to go
      # red for THAT reason. The bare-`#[ignore]` arm matters most — a bare ignore also changes the
      # counts, so a weaker script would fail with the set-changed message and the author would
      # UPDATE_BASELINE it instead of writing down why.
      - name: Guard test — audit-ignored-tests
        run: bash .github/scripts/test-audit-ignored-tests.sh

  typescript-quality:
    name: TypeScript Quality
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: cd packages/temper-cloud && bun install --frozen-lockfile

      - name: Type check
        run: cd packages/temper-cloud && bun run typecheck

      - name: Lint and format check
        run: cd packages/temper-cloud && bun run check
