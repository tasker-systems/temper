name: Code Quality

on:
  workflow_call:
    inputs:
      # Gate the heavy rust-quality job WITHOUT gating the whole workflow: a
      # rust-inert change (every non-doc file in a Rust-inert tree — see
      # detect-ci-scope.sh) still needs the typescript-quality job below, so
      # ci.yml keeps invoking this workflow and only turns rust-quality off. Defaults 'true' so a direct dispatch or a second caller
      # that passes nothing runs the full job — the conservative direction.
      run-rust-quality:
        required: false
        type: string
        default: 'true'

# Least privilege. The org default is `default_workflow_permissions: write`,
# which grants EVERY scope — including `actions: write` and `contents: write` —
# to any job that does not say otherwise. This repo now publishes SIGNED
# release artifacts, so a compromised action or build.rs in a test job would
# reach a signing oracle: create a tag at an attacker commit, then
# workflow_dispatch release.yml against it, and the backdoor is attested.
# (A tag pushed with GITHUB_TOKEN does not itself trigger release.yml — GitHub
# suppresses workflow runs from GITHUB_TOKEN-authored events — which is why the
# dispatch step matters and why `actions: write` is the scope that completes
# the chain.) Declaring any permissions block zeroes every unlisted scope.
#
# Declared here and not only in ci.yml: a workflow_call'd workflow inherits the
# CALLER's permissions when it declares none, so a second caller — or a direct
# dispatch — would silently reopen this. Each file states its own floor.
permissions:
  contents: read

jobs:
  rust-quality:
    name: Rust Quality
    # Skipped for a rust-inert change (TS/SDK-only), which still runs
    # typescript-quality below. Everything here needs a compiled crate; the
    # checks that do not live in quality-gate.yml, which ci.yml runs first.
    if: inputs.run-rust-quality == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20

    # All `sqlx::query!()` macros here verify OFFLINE against the committed workspace .sqlx cache
    # (SQLX_OFFLINE below). The Postgres service + `cargo sqlx migrate run` step remain as a cheap
    # migrations-apply smoke check (every migration must apply cleanly).
    services:
      postgres:
        image: pgvector/pgvector:0.8.2-pg18-trixie
        env:
          POSTGRES_DB: temper_development
          POSTGRES_USER: temper
          POSTGRES_PASSWORD: temper
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5437:5432
        options: >-
          --health-cmd "pg_isready -U temper -d temper_development"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://temper:temper@localhost:5437/temper_development
      # Verify query macros against the committed .sqlx caches (see the note above the service block).
      SQLX_OFFLINE: "true"
      # The same CI debuginfo level `.github/actions/setup-rust` sets for every test job (see its
      # header). Job-scoped, never `[profile.dev]`.
      CARGO_PROFILE_DEV_DEBUG: line-tables-only

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      # mold for this job only, as in `.github/actions/setup-rust` (whose header says why it must
      # never move into .cargo/config.toml).
      - name: Link with mold
        uses: rui314/setup-mold@v1

      - name: Setup Rust build cache
        uses: Swatinem/rust-cache@v2
        with:
          prefix-key: code-quality

      - name: Install cargo-sqlx and cargo-make
        uses: taiki-e/install-action@v2.87.18
        with:
          # cargo-make is here for the ts-rs drift gate below, which invokes
          # `cargo make generate-ts-types` — deliberately the same entry point a developer runs,
          # so the gate cannot check a different generator than the one people use.
          tool: sqlx-cli,cargo-make

      - name: Run migrations
        run: cargo sqlx migrate run

      - name: Run Clippy lints
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

      - name: Check OpenAPI spec is up to date with the router
        run: bash .github/scripts/check-openapi-spec.sh

      # `Makefile.toml` declares `env_files = ["./.env"]`, and cargo-make treats a missing env file
      # as a HARD ERROR — there is no `required = false` (measured: the object form still fails).
      # `.env` is gitignored, so EVERY `cargo make` task fails on a fresh checkout. That has been
      # invisible until now only because no CI job ran cargo-make and every dev machine has a `.env`
      # from setup (`.env.template` → `.env`, per the comment on that line).
      #
      # An EMPTY file rather than a copy of `.env.template`: env_files are loaded into the
      # environment, so a populated one could override this job's own DATABASE_URL / SQLX_OFFLINE
      # with template values. Empty satisfies cargo-make and sets nothing.
      - name: Bootstrap an empty .env (cargo-make requires the file to exist)
        run: touch .env

      # The cross-LANGUAGE gate. Every other check in this job lives inside Rust, so a type and its
      # generated TypeScript mirror can disagree while both languages stay green — which is exactly
      # how PR #498 merged with tsc clean and 79/79 tests passing against a contract the server had
      # stopped emitting. Its harness is in quality-gate.yml's guard-tests; it runs here because it
      # needs cargo.
      - name: Check generated TypeScript types are up to date with the Rust (ts-rs drift)
        run: bash .github/scripts/check-ts-rs-drift.sh

      # The same shape one tier up: `skills/` is a committed projection of shared templates,
      # so an edited template with an un-re-emitted tree ships a skill that disagrees with its own
      # source. Hand-maintained, that tree taught doc types temper has never had. Its harness is in
      # quality-gate.yml's guard-tests; it runs here because the emit needs cargo.
      - name: Check the committed skills/ projection is up to date (skills drift)
        run: bash .github/scripts/check-skills-drift.sh

      # And once more for `docs/reference/cli`, which is a projection of the BUILT binary's
      # `--help` tree. It runs here rather than in quality-gate.yml because the emit needs a compiled
      # temper; its harness is in guard-tests, stubbed, so the harness itself needs no toolchain.
      # This step also carries the completeness cross-check against the clap source — see the
      # script's header for why re-emitting alone cannot establish it.
      - name: Check the committed CLI reference is up to date (cli reference drift)
        run: bash .github/scripts/check-cli-reference-drift.sh

      # And the config half. Same shape, different source: this one projects the TemperConfig
      # TYPE (via a schemars JSON Schema, so the doc comments come along) rather than the CLI's
      # rendered help. It carries its own completeness cross-check for the same reason.
      - name: Check the committed config reference is up to date (config reference drift)
        run: bash .github/scripts/check-config-reference-drift.sh

      - name: Check documentation builds
        run: cargo doc --workspace --no-deps --document-private-items
        env:
          RUSTDOCFLAGS: -D warnings

  typescript-quality:
    name: TypeScript Quality
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: cd packages/temper-cloud && bun install --frozen-lockfile

      - name: Type check
        run: cd packages/temper-cloud && bun run typecheck

      - name: Lint and format check
        run: cd packages/temper-cloud && bun run check
