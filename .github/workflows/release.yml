name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to release (e.g. v0.1.0)'
        required: true
        type: string
  workflow_call:
    inputs:
      tag:
        description: 'Tag to release (e.g. v0.1.0)'
        required: true
        type: string

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  determine-version:
    name: Determine Version
    runs-on: ubuntu-22.04
    timeout-minutes: 2
    outputs:
      version: ${{ steps.version.outputs.version }}
    # This job only derives a version string. It needs no write scope — and with
    # the org default at `default_workflow_permissions: write`, saying nothing
    # grants it EVERY scope, including `contents: write` and `actions: write`.
    # That is the pair that completes the signing-oracle chain, and it is the job
    # the tag values below are expanded in.
    permissions:
      contents: read
    steps:
      - name: Extract version from tag
        id: version
        # Both tag sources arrive as environment variables, never as an
        # expression inside the script. GitHub expands expressions into the run
        # body's TEXT before bash parses it, so a crafted value executes.
        # git check-ref-format accepts all three of these tag names:
        #   v1.0.0";id;#     v1.0.0`id`     v1.0.0$(id)
        # and inputs.tag is not even constrained by that — it is a free string
        # from workflow_dispatch or from release-tag.yml's workflow_call. A shell
        # variable is never re-parsed as script text.
        env:
          INPUT_TAG: ${{ inputs.tag }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          if [[ -n "$INPUT_TAG" ]]; then
            TAG="$INPUT_TAG"
          else
            TAG="$REF_NAME"
          fi
          VERSION="${TAG#v}"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "Releasing temper v${VERSION}"

  build-cli-binaries:
    name: Build CLI Binaries
    needs: determine-version
    permissions:
      contents: read
      id-token: write
      attestations: write
    uses: ./.github/workflows/build-cli-binaries.yml
    with:
      version: ${{ needs.determine-version.outputs.version }}

  # The Agent Skill bundle a user uploads to Claude (Customize > Skills). Deliberately its OWN job
  # rather than a step in build-cli-binaries: that workflow is a matrix over three target triples,
  # and this artifact is architecture-independent, so building it there would produce three
  # identical zips racing for the same name.
  #
  # It carries a sha256 sidecar and a provenance attestation like every other published artifact.
  # It does NOT carry a per-file manifest, and correctly so: manifests exist so `install.sh` can
  # verify each extracted file before an atomic swap, and nothing installs this — a human uploads
  # it. `package-skill.sh`'s header explains why its FILE NAME is what keeps it out of the
  # manifest guard's glob in create-github-release.sh.
  build-skill-bundle:
    name: Build Skill Bundle
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    needs: determine-version
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      # Re-emit rather than trusting the committed tree. The drift gate already proves the two
      # agree on every PR, so this is belt-and-braces — but a release is the wrong place to
      # discover that someone pushed to a release branch without re-emitting.
      - name: Re-emit the skill projection
        run: cargo run -q -p temper-cli -- skill emit --path agent-skills/temper-knowledge-base

      # A release must not quietly ship a bundle that differs from what reviewers saw on main.
      - name: Fail if the emitted tree differs from what is committed
        run: |
          if [ -n "$(git status --porcelain -- agent-skills)" ]; then
            echo "::error::the committed skill tree is stale — re-emit and commit before tagging"
            git status --porcelain -- agent-skills
            exit 1
          fi

      - name: Package the skill bundle
        env:
          VERSION: ${{ needs.determine-version.outputs.version }}
        run: bash .github/scripts/release/package-skill.sh dist

      - name: Attest build provenance
        # SHA-pinned for the same reason as build-cli-binaries.yml's copy: this job holds
        # `attestations: write`, so anything it runs can obtain a genuine Sigstore signature.
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4
        with:
          subject-path: dist/temper-skill-v${{ needs.determine-version.outputs.version }}.zip

      - name: Upload artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          # Named `cli-v<version>-skill` so it is picked up by release-summary's existing
          # `pattern: cli-v<version>-*` download. The prefix is about which download step collects
          # it, not about what it contains.
          name: cli-v${{ needs.determine-version.outputs.version }}-skill
          path: |
            dist/temper-skill-v${{ needs.determine-version.outputs.version }}.zip
            dist/temper-skill-v${{ needs.determine-version.outputs.version }}.zip.sha256
          retention-days: 7
          if-no-files-found: error

  # The TS clients publish to GitHub Packages npm (@tasker-systems/* scope).
  # The script's duplicate probe decides BEFORE anything builds or publishes,
  # so re-cutting an existing tag skips loudly rather than failing or
  # overwriting (tools/scripts/release/publish-npm.sh header).
  publish-npm-clients:
    name: Publish npm Clients
    needs: determine-version
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    permissions:
      contents: read
      packages: write
    env:
      NODE_AUTH_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: "24"

      - name: Authenticate to GitHub Packages npm
        run: |
          auth_dir="${NPM_CONFIG_USERCONFIG:-$HOME/.npmrc}"
          printf '//npm.pkg.github.com/:_authToken=%s\n' "$NODE_AUTH_TOKEN" > "$auth_dir"

      - name: Publish the TS clients
        env:
          VERSION: ${{ needs.determine-version.outputs.version }}
        run: bash tools/scripts/release/publish-npm.sh "$VERSION"

  # The Ruby gem publishes to GitHub Packages RubyGems. There is no versions
  # API on that host, so the publish script treats a duplicate-version push
  # refusal as a loud idempotent skip (see its header) — re-cutting an
  # existing tag stays safe here the same way it is for npm.
  publish-ruby-client:
    name: Publish Ruby Client
    needs: determine-version
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    permissions:
      contents: read
      packages: write
    env:
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          # .ruby-version / mise.toml is 3.4.10.
          ruby-version: "3.4"

      - name: Publish the gem
        env:
          VERSION: ${{ needs.determine-version.outputs.version }}
        run: bash tools/scripts/release/publish-ruby.sh "$VERSION"

  # The Python client ships as wheel + sdist ASSETS ON THE RELEASE ITSELF —
  # GitHub Packages has no pip registry, and Release assets are the path
  # "similar to the way we do the CLI builds": a pyproject.toml pins the client
  # with a PEP 508 direct reference to the download URL, token-free on a
  # public repo. Like the skill bundle this is its own job: it needs uv and
  # Python, not the Rust toolchain. Each distribution gets a sha256 sidecar
  # and a provenance attestation like every other published artifact; neither
  # carries a per-file manifest — manifests exist for install.sh's pre-swap
  # verification and nothing installs a wheel that way.
  build-py-client:
    name: Build Python Client
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    needs: determine-version
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      # uv via pipx, which is preinstalled on ubuntu-latest, rather than a
      # setup-python: the build must run against the interpreter pinned in
      # clients/temper-py/.python-version (the same choice test-python.yml
      # makes).
      - name: Install uv
        run: pipx install uv

      - name: Build wheel and sdist
        working-directory: clients/temper-py
        run: uv build

      - name: Emit sha256 sidecars
        working-directory: clients/temper-py/dist
        run: sha256sum -- *.whl *.tar.gz

      - name: Attest build provenance
        # SHA-pinned for the same reason as build-cli-binaries.yml's copy: this
        # job holds `attestations: write`, so anything it runs can obtain a
        # genuine Sigstore signature.
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4
        with:
          subject-path: |
            clients/temper-py/dist/temper_py-*.whl
            clients/temper-py/dist/temper_py-*.tar.gz

      - name: Upload artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          # Named `cli-v<version>-py` so it is picked up by release-summary's
          # `pattern: cli-v<version>-*` download, like the skill bundle.
          name: cli-v${{ needs.determine-version.outputs.version }}-py
          path: |
            clients/temper-py/dist/temper_py-*.whl
            clients/temper-py/dist/temper_py-*.tar.gz
            clients/temper-py/dist/temper_py-*.sha256
          retention-days: 7
          if-no-files-found: error

  release-summary:
    name: Release Summary
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    needs: [determine-version, build-cli-binaries, build-skill-bundle, build-py-client, publish-npm-clients, publish-ruby-client]
    if: always()
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      # One download, both producers: the skill bundle uploads under the same
      # `cli-v<version>-*` artifact-name prefix, so this pattern collects it too.
      - name: Download release artifacts
        if: needs.build-cli-binaries.result == 'success' && needs.build-skill-bundle.result == 'success' && needs.build-py-client.result == 'success'
        uses: actions/download-artifact@v8
        with:
          pattern: cli-v${{ needs.determine-version.outputs.version }}-*
          path: cli-artifacts/
          merge-multiple: true

      - name: Write job summary
        env:
          VERSION: ${{ needs.determine-version.outputs.version }}
          BUILD_RESULT: ${{ needs.build-cli-binaries.result }}
          SKILL_RESULT: ${{ needs.build-skill-bundle.result }}
          NPM_RESULT: ${{ needs.publish-npm-clients.result }}
          RUBY_RESULT: ${{ needs.publish-ruby-client.result }}
          PY_RESULT: ${{ needs.build-py-client.result }}
        run: |
          icon_for() {
            case "$1" in
              success)   echo "✅" ;;
              failure)   echo "❌" ;;
              cancelled) echo "⏹️" ;;
              skipped)   echo "⏭️" ;;
              *)         echo "❓" ;;
            esac
          }
          {
            echo "## Release v${VERSION}"
            echo ""
            echo "| Artifact | Result |"
            echo "|---|---|"
            echo "| CLI binaries (darwin-arm64 / linux-x64 / windows-x64) | $(icon_for "$BUILD_RESULT") ${BUILD_RESULT} |"
            echo "| Agent Skill bundle (temper-skill-v${VERSION}.zip) | $(icon_for "$SKILL_RESULT") ${SKILL_RESULT} |"
            echo "| npm clients (@tasker-systems/temper-ts, @tasker-systems/temper-telemetry-ts) | $(icon_for "$NPM_RESULT") ${NPM_RESULT} |"
            echo "| Ruby gem (temper-rb on GitHub Packages) | $(icon_for "$RUBY_RESULT") ${RUBY_RESULT} |"
            echo "| Python client (temper_py wheel + sdist on the Release) | $(icon_for "$PY_RESULT") ${PY_RESULT} |"
          } >> "$GITHUB_STEP_SUMMARY"

      # Gated on BOTH producers. A release missing the skill bundle would publish silently and
      # look complete — the same "absence is indistinguishable from never-had-it" failure the
      # manifest guard inside this script exists to prevent, one artifact over.
      - name: Create GitHub Release
        if: needs.build-cli-binaries.result == 'success' && needs.build-skill-bundle.result == 'success' && needs.build-py-client.result == 'success' && needs.publish-npm-clients.result == 'success' && needs.publish-ruby-client.result == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.determine-version.outputs.version }}
          ARTIFACT_DIR: cli-artifacts
        run: ./.github/scripts/release/create-github-release.sh

      - name: Fail the job if any producer did not succeed
        if: needs.build-cli-binaries.result != 'success' || needs.build-skill-bundle.result != 'success' || needs.build-py-client.result != 'success' || needs.publish-npm-clients.result != 'success' || needs.publish-ruby-client.result != 'success'
        run: |
          echo "::error::build-cli-binaries: ${{ needs.build-cli-binaries.result }}, build-skill-bundle: ${{ needs.build-skill-bundle.result }}, build-py-client: ${{ needs.build-py-client.result }}, publish-npm-clients: ${{ needs.publish-npm-clients.result }}, publish-ruby-client: ${{ needs.publish-ruby-client.result }} — release not published."
          exit 1
