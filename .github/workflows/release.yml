name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to release (e.g. v0.1.0)'
        required: true
        type: string
  workflow_call:
    inputs:
      tag:
        description: 'Tag to release (e.g. v0.1.0)'
        required: true
        type: string
    # release-tag.yml passes this through its caller-side `secrets:` mapping, and
    # GitHub validates that mapping against the secrets DECLARED here at workflow
    # parse time — an unpassed/unmapped pair startup-fails the run ("Invalid
    # secret, HOMEBREW_TAP_DEPLOY_KEY is not defined in the referenced workflow").
    # Optional, not required: the tag-push and dispatch triggers never pass
    # through this block at all, and the homebrew tap job surfaces its own
    # actionable error when the secret is absent.
    secrets:
      HOMEBREW_TAP_DEPLOY_KEY:
        description: 'Ed25519 deploy key (private half) for tasker-systems/homebrew-tap push'
        required: false

concurrency:
  group: release
  cancel-in-progress: false

# The ceiling this workflow needs whichever door it enters through (tag push,
# workflow_dispatch, or the workflow_call from release-tag.yml): job-level
# permissions narrow this, never widen it. When CALLED, the caller's own
# declaration is the cap — release-tag.yml declares the same union.
permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  determine-version:
    name: Determine Version
    runs-on: ubuntu-22.04
    timeout-minutes: 2
    outputs:
      version: ${{ steps.version.outputs.version }}
    # This job only derives a version string. It needs no write scope — and with
    # the org default at `default_workflow_permissions: write`, saying nothing
    # grants it EVERY scope, including `contents: write` and `actions: write`.
    # That is the pair that completes the signing-oracle chain, and it is the job
    # the tag values below are expanded in.
    permissions:
      contents: read
    steps:
      - name: Extract version from tag
        id: version
        # Both tag sources arrive as environment variables, never as an
        # expression inside the script. GitHub expands expressions into the run
        # body's TEXT before bash parses it, so a crafted value executes.
        # git check-ref-format accepts all three of these tag names:
        #   v1.0.0";id;#     v1.0.0`id`     v1.0.0$(id)
        # and inputs.tag is not even constrained by that — it is a free string
        # from workflow_dispatch or from release-tag.yml's workflow_call. A shell
        # variable is never re-parsed as script text.
        env:
          INPUT_TAG: ${{ inputs.tag }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          if [[ -n "$INPUT_TAG" ]]; then
            TAG="$INPUT_TAG"
          else
            TAG="$REF_NAME"
          fi
          VERSION="${TAG#v}"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "Releasing temper v${VERSION}"

  # EVERY JOB IN THIS FILE PINS ITS ACTIONS BY FULL COMMIT SHA, with the tag it was taken from as a
  # trailer (Dependabot's github-actions lane bumps both). Each holds something a repointed tag
  # could abuse: an OIDC token a registry exchanges for a publish credential, a Sigstore signing
  # grant, `contents: write` over the Release and its `.sha256` files, or the homebrew tap's deploy
  # key. audit-privileged-action-pins.sh enforces the scope-holding jobs; the deploy-key job is
  # outside what it can see. The same posture
  # build-cli-binaries.yml already takes; `dtolnay/rust-toolchain@stable` is replaced rather than
  # pinned for the reason given there (a branch has no release cadence to bump a pin against).
  # Their checkouts also drop the persisted git credential: none of them pushes.
  build-cli-darwin-arm64:
    name: Build CLI (darwin-arm64)
    needs: determine-version
    # The ceiling for the called workflow. Inside it, only its `attest` job takes `id-token` and
    # `attestations`; the job that compiles holds `contents: read` alone.
    permissions:
      contents: read
      id-token: write
      attestations: write
    uses: ./.github/workflows/build-cli-binaries.yml
    with:
      version: ${{ needs.determine-version.outputs.version }}
      target: darwin-arm64

  build-cli-linux-x64:
    name: Build CLI (linux-x64)
    needs: determine-version
    # The ceiling for the called workflow. Inside it, only its `attest` job takes `id-token` and
    # `attestations`; the job that compiles holds `contents: read` alone.
    permissions:
      contents: read
      id-token: write
      attestations: write
    uses: ./.github/workflows/build-cli-binaries.yml
    with:
      version: ${{ needs.determine-version.outputs.version }}
      target: linux-x64

  build-cli-windows-x64:
    name: Build CLI (windows-x64)
    needs: determine-version
    # The ceiling for the called workflow. Inside it, only its `attest` job takes `id-token` and
    # `attestations`; the job that compiles holds `contents: read` alone.
    permissions:
      contents: read
      id-token: write
      attestations: write
    uses: ./.github/workflows/build-cli-binaries.yml
    with:
      version: ${{ needs.determine-version.outputs.version }}
      target: windows-x64

  # The Agent Skill bundle a user uploads to Claude (Customize > Skills). Deliberately its OWN job
  # rather than a step in build-cli-binaries.yml: that workflow builds one target triple per call,
  # and this artifact is architecture-independent.
  #
  # It carries a sha256 sidecar and a provenance attestation like every other published artifact.
  # It does NOT carry a per-file manifest, and correctly so: manifests exist so `install.sh` can
  # verify each extracted file before an atomic swap, and nothing installs this — a human uploads
  # it. `package-skill.sh`'s header explains why its FILE NAME is what keeps it out of the
  # manifest guard's glob in create-github-release.sh.
  #
  # It compiles temper-cli, so like build-cli-binaries.yml it is two jobs: this one builds and holds
  # no signing identity, and attest-skill-bundle below verifies its hashes and signs.
  build-skill-bundle:
    name: Build Skill Bundle
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    needs: determine-version
    permissions:
      contents: read
    outputs:
      sums: ${{ steps.sums.outputs.sums }}
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # rustup directly, not `dtolnay/rust-toolchain@stable` — see the note above build-cli-binaries.
      - name: Install Rust toolchain
        run: |
          rustup toolchain install stable --profile minimal --no-self-update
          rustup default stable
          rustc --version --verbose

      # Re-emit rather than trusting the committed tree. The drift gate already proves the two
      # agree on every PR, so this is belt-and-braces — but a release is the wrong place to
      # discover that someone pushed to a release branch without re-emitting.
      - name: Re-emit the skill projection
        run: cargo run -q --locked -p temper-cli -- skill emit --path skills/temper-knowledge-base

      # A release must not quietly ship a bundle that differs from what reviewers saw on main.
      - name: Fail if the emitted tree differs from what is committed
        run: |
          if [ -n "$(git status --porcelain -- skills)" ]; then
            echo "::error::the committed skill tree is stale — re-emit and commit before tagging"
            git status --porcelain -- skills
            exit 1
          fi

      - name: Package the skill bundle
        env:
          VERSION: ${{ needs.determine-version.outputs.version }}
        run: bash .github/scripts/release/package-skill.sh dist

      # The hashes leave this job as a job output, which no other job can write: the attest job and
      # release-summary check their downloads against them (tools/scripts/release/artifact-sums.sh).
      - name: Record the built files' hashes
        id: sums
        run: |
          {
            echo 'sums<<SUMS_EOF'
            bash tools/scripts/release/artifact-sums.sh emit dist
            echo 'SUMS_EOF'
          } >> "$GITHUB_OUTPUT"

      - name: Upload artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: cli-v${{ needs.determine-version.outputs.version }}-skill
          path: dist/
          retention-days: 7
          if-no-files-found: error

  # Holds the signing identity and runs nothing from a dependency tree: downloads the bundle,
  # refuses it unless it matches build-skill-bundle's hashes, attests it.
  attest-skill-bundle:
    name: Attest Skill Bundle
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    needs: [determine-version, build-skill-bundle]
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download the built bundle
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: cli-v${{ needs.determine-version.outputs.version }}-skill
          path: dist/

      - name: Check the download against the build job's hashes
        env:
          SUMS: ${{ needs.build-skill-bundle.outputs.sums }}
        run: bash tools/scripts/release/artifact-sums.sh verify dist

      - name: Attest build provenance
        # SHA-pinned: this job holds `attestations: write`, so anything it runs can obtain a
        # genuine Sigstore signature.
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4
        with:
          subject-path: dist/temper-skill-v${{ needs.determine-version.outputs.version }}.zip

  # THE REGISTRY LANES: BUILD, THEN PUBLISH. Each lane is two jobs. The build job
  # holds no `id-token`: it installs, compiles and packs, and so runs third-party
  # code (install scripts, build backends, build scripts). The publish job holds
  # `id-token: write` and runs nothing from the package trees — it downloads the
  # build job's bytes, checks their name and version, and pushes them. Any step in
  # a job holding `id-token: write` can mint the OIDC token a registry accepts, and
  # no registry can tell one job's token from another's in this workflow. So the
  # rule is run-wide, not per lane: NO job in this run that holds `id-token: write`
  # compiles or installs from a dependency tree. The CLI and skill-bundle builds
  # follow it too — they build in jobs with no identity and are signed by separate
  # attest jobs (build-cli-binaries.yml's `attest`, and attest-skill-bundle here).
  #
  # Every job in the run shares one artifact namespace, so a compromised build job
  # could replace ANOTHER lane's artifact by name. Each build job therefore hashes
  # its files into a job output, which only it can write, and every job that
  # consumes an artifact — publish, attest, release-summary — downloads it by exact
  # name and refuses it if it differs (tools/scripts/release/artifact-sums.sh).
  #
  # What the split does NOT stop: a lane's own compromised build tampering with
  # its bytes before it hashes them. Those are then pushed with provenance. The
  # build jobs therefore still pin what they run (`--ignore-scripts`, a
  # hash-pinned Python build backend, a pinned uv), and the crates lane checks
  # the publish job's own packaging is byte-identical to the verified one.
  #
  # Trusted publishers on all four registries match on repository + workflow file
  # (+ an optional environment, none set here), never on job name, so the job
  # names below are free to change (RELEASING.md, "Publishing-side auth").
  #
  # The npm, Ruby and Python scripts probe the registry in both stages, so a
  # re-cut tag skips loudly: the build job uploads nothing (`if-no-files-found:
  # ignore`), and the publish job's download then finds no artifact. (The crates
  # build stage verifies and uploads all seven regardless; its publish stage skips
  # each one already published.) That download is `continue-on-error`
  # because the script, not the download, is the check: it skips a published
  # version, and fails loudly when a version is unpublished and its file absent.

  # The TS clients publish to the public npm registry (@tasker-systems/* scope,
  # --access public; tools/scripts/release/publish-npm.sh header). Auth is npm
  # trusted publishing: --provenance attests via the publish job's OIDC identity
  # token — no registry secret exists.
  build-npm-clients:
    name: Build npm Clients
    needs: determine-version
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    outputs:
      sums: ${{ steps.sums.outputs.sums }}
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"

      - name: Build and pack the TS clients
        env:
          VERSION: ${{ needs.determine-version.outputs.version }}
        run: bash tools/scripts/release/publish-npm.sh "$VERSION" --out dist

      # The hashes leave this job as a job output, which no other job can write: the publish
      # job checks its download against them (tools/scripts/release/artifact-sums.sh).
      - name: Record the built files' hashes
        id: sums
        run: |
          {
            echo 'sums<<SUMS_EOF'
            bash tools/scripts/release/artifact-sums.sh emit dist
            echo 'SUMS_EOF'
          } >> "$GITHUB_OUTPUT"

      - name: Upload the built package
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: registry-npm-${{ needs.determine-version.outputs.version }}
          path: dist/
          retention-days: 7
          if-no-files-found: ignore

  publish-npm-clients:
    name: Publish npm Clients
    needs: [determine-version, build-npm-clients]
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"

      - name: Download the built package
        continue-on-error: true
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: registry-npm-${{ needs.determine-version.outputs.version }}
          path: dist/

      - name: Check the download against the build job's hashes
        env:
          SUMS: ${{ needs.build-npm-clients.outputs.sums }}
        run: bash tools/scripts/release/artifact-sums.sh verify dist

      - name: Publish the TS clients
        env:
          VERSION: ${{ needs.determine-version.outputs.version }}
        run: bash tools/scripts/release/publish-npm.sh "$VERSION" --from dist

  # The Ruby gem publishes to rubygems.org. Auth is RubyGems trusted publishing:
  # the credentials action mints short-lived credentials from the publish job's
  # OIDC identity token — no API key secret exists. The trusted publisher on
  # rubygems.org names THIS workflow (release.yml — the identity claim names the
  # job's own file, not the chain's entry).
  build-ruby-client:
    name: Build Ruby Client
    needs: determine-version
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    outputs:
      sums: ${{ steps.sums.outputs.sums }}
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Ruby
        uses: ruby/setup-ruby@14594264cd68ce8a2345dd349bc3d138a4ef85c8 # v1.327.0
        with:
          # .ruby-version / mise.toml is 3.4.10.
          ruby-version: "3.4"

      - name: Build the gem
        env:
          VERSION: ${{ needs.determine-version.outputs.version }}
        run: bash tools/scripts/release/publish-ruby.sh "$VERSION" --out dist

      # The hashes leave this job as a job output, which no other job can write: the publish
      # job checks its download against them (tools/scripts/release/artifact-sums.sh).
      - name: Record the built files' hashes
        id: sums
        run: |
          {
            echo 'sums<<SUMS_EOF'
            bash tools/scripts/release/artifact-sums.sh emit dist
            echo 'SUMS_EOF'
          } >> "$GITHUB_OUTPUT"

      - name: Upload the built package
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: registry-ruby-${{ needs.determine-version.outputs.version }}
          path: dist/
          retention-days: 7
          if-no-files-found: ignore

  publish-ruby-client:
    name: Publish Ruby Client
    needs: [determine-version, build-ruby-client]
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Ruby
        uses: ruby/setup-ruby@14594264cd68ce8a2345dd349bc3d138a4ef85c8 # v1.327.0
        with:
          ruby-version: "3.4"

      - name: Download the built package
        continue-on-error: true
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: registry-ruby-${{ needs.determine-version.outputs.version }}
          path: dist/

      - name: Check the download against the build job's hashes
        env:
          SUMS: ${{ needs.build-ruby-client.outputs.sums }}
        run: bash tools/scripts/release/artifact-sums.sh verify dist

      - name: Configure RubyGems credentials (trusted publishing)
        uses: rubygems/configure-rubygems-credentials@dc5a8d8553e6ee01fc26761a49e99e733d17954a # v2.1.0

      - name: Publish the gem
        env:
          VERSION: ${{ needs.determine-version.outputs.version }}
        run: bash tools/scripts/release/publish-ruby.sh "$VERSION" --from dist

  # The Python client publishes to pypi.org as temperkb-py — the distribution
  # name; the import package stays `temper` (PyPI has no scopes, and both
  # natural names were taken by unrelated projects, so the distribution
  # carries the kb). The registry is the lane, the way it is for npm and
  # RubyGems; the GitHub Release carries only the CLI binaries and the skill
  # bundle.
  #
  # Auth is PyPI trusted publishing: `uv publish` exchanges the publish job's
  # OIDC identity token for a short-lived upload token — no registry secret
  # exists. No PEP 740 attestation accompanies the upload: `uv publish` uploads
  # attestation files it is handed but generates none, and nothing here makes
  # them (PyPI's integrity API returns 404 for temperkb-py 0.6.0's files). The
  # trusted publisher on pypi.org names THIS workflow (release.yml — the claim
  # names the job's own file, not the chain's entry).
  #
  # uv via pipx (preinstalled on the runner), pinned: an unpinned `pipx install
  # uv` resolves whatever PyPI serves that minute. The build runs against the
  # interpreter in clients/temper-py/.python-version, the choice test-python.yml
  # makes too.
  build-py-client:
    name: Build Python Client
    needs: determine-version
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    outputs:
      sums: ${{ steps.sums.outputs.sums }}
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        run: pipx install uv==0.12.18

      - name: Build the distributions
        env:
          VERSION: ${{ needs.determine-version.outputs.version }}
        run: bash tools/scripts/release/publish-py.sh "$VERSION" --out dist

      # The hashes leave this job as a job output, which no other job can write: the publish
      # job checks its download against them (tools/scripts/release/artifact-sums.sh).
      - name: Record the built files' hashes
        id: sums
        run: |
          {
            echo 'sums<<SUMS_EOF'
            bash tools/scripts/release/artifact-sums.sh emit dist
            echo 'SUMS_EOF'
          } >> "$GITHUB_OUTPUT"

      - name: Upload the built package
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: registry-py-${{ needs.determine-version.outputs.version }}
          path: dist/
          retention-days: 7
          if-no-files-found: ignore

  publish-py-client:
    name: Publish Python Client
    needs: [determine-version, build-py-client]
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        run: pipx install uv==0.12.18

      - name: Download the built package
        continue-on-error: true
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: registry-py-${{ needs.determine-version.outputs.version }}
          path: dist/

      - name: Check the download against the build job's hashes
        env:
          SUMS: ${{ needs.build-py-client.outputs.sums }}
        run: bash tools/scripts/release/artifact-sums.sh verify dist

      - name: Publish the Python client
        env:
          VERSION: ${{ needs.determine-version.outputs.version }}
        run: bash tools/scripts/release/publish-py.sh "$VERSION" --from dist

  # The Rust client closure publishes to crates.io as temperkb-*, in dependency
  # order (tools/scripts/release/publish-crates.sh header). The build job
  # verify-compiles all seven at once; the publish job compiles nothing and
  # checks each `.crate` it packages is the one the build job verified.
  #
  # Auth is crates.io trusted publishing: rust-lang/crates-io-auth-action
  # exchanges the publish job's OIDC identity token for a short-lived upload
  # token, auto-revoked when the job ends — no registry secret exists.
  # crates.io matches the token's CALLING workflow, so inside the
  # release-tag.yml chain it checks release-tag.yml, and on the tag-push and
  # dispatch doors release.yml; trusted publishers for both are configured on
  # every temperkb-* name (RELEASING.md, "Publishing-side auth"). The closure's
  # 0.5.3 initial versions, and temperkb-mcp's 0.6.0, were bootstrapped once
  # with an API token (crates.io attaches publishers only to existing crates —
  # no pending-publisher pre-registration), and every version after that rides
  # this job's OIDC exchange.
  build-rust-crates:
    name: Verify Rust Crates (temperkb-*)
    needs: determine-version
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    outputs:
      sums: ${{ steps.sums.outputs.sums }}
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # rustup directly, not `dtolnay/rust-toolchain@stable` — see the note above build-cli-binaries.
      - name: Install Rust toolchain
        run: |
          rustup toolchain install stable --profile minimal --no-self-update
          rustup default stable
          rustc --version --verbose

      - name: Verify-package the client closure
        env:
          VERSION: ${{ needs.determine-version.outputs.version }}
        run: bash tools/scripts/release/publish-crates.sh "$VERSION" --out dist

      # The hashes leave this job as a job output, which no other job can write: the publish
      # job checks its download against them (tools/scripts/release/artifact-sums.sh).
      - name: Record the built files' hashes
        id: sums
        run: |
          {
            echo 'sums<<SUMS_EOF'
            bash tools/scripts/release/artifact-sums.sh emit dist
            echo 'SUMS_EOF'
          } >> "$GITHUB_OUTPUT"

      - name: Upload the built package
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: registry-crates-${{ needs.determine-version.outputs.version }}
          path: dist/
          retention-days: 7
          if-no-files-found: ignore

  publish-rust-crates:
    name: Publish Rust Crates (temperkb-*)
    needs: [determine-version, build-rust-crates]
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The same toolchain as the build job: packaging must reproduce its bytes.
      - name: Install Rust toolchain
        run: |
          rustup toolchain install stable --profile minimal --no-self-update
          rustup default stable
          rustc --version --verbose

      - name: Download the built package
        continue-on-error: true
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: registry-crates-${{ needs.determine-version.outputs.version }}
          path: dist/

      - name: Check the download against the build job's hashes
        env:
          SUMS: ${{ needs.build-rust-crates.outputs.sums }}
        run: bash tools/scripts/release/artifact-sums.sh verify dist

      - name: Authenticate with crates.io (trusted publishing)
        id: auth
        uses: rust-lang/crates-io-auth-action@c6f97d42243bad5fab37ca0427f495c86d5b1a18 # v1.0.5

      - name: Publish the client closure
        env:
          VERSION: ${{ needs.determine-version.outputs.version }}
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
        run: bash tools/scripts/release/publish-crates.sh "$VERSION" --from dist

  update-homebrew-tap:
    name: Update the homebrew tap
    runs-on: macos-14
    timeout-minutes: 15
    needs: [determine-version, release-summary]
    # Blocking by ruling (E): a tap that silently lags its release is the
    # drifting-second-source the spec forbids. Recovery is this workflow's own
    # `workflow_dispatch` tag re-run — the publish lanes skip loudly on re-cut
    # and the tap render is an idempotent no-op the second time. The push
    # credential is a WRITE DEPLOY KEY on tasker-systems/homebrew-tap
    # (HOMEBREW_TAP_DEPLOY_KEY): repo-scoped by construction, no expiry, no
    # user binding. Feeder logic lives IN the tap (script/apply_release.py);
    # this job downloads the release's own bytes and hands them over.
    permissions:
      contents: read
    steps:
      - name: Require the tap deploy key
        env:
          KEY: ${{ secrets.HOMEBREW_TAP_DEPLOY_KEY }}
        run: |
          if [ -z "$KEY" ]; then
            echo "::error::HOMEBREW_TAP_DEPLOY_KEY is not set. Generate an ed25519 keypair, add the PUBLIC half to tasker-systems/homebrew-tap → Settings → Deploy keys with Allow write access, and store the PRIVATE half (full file, including the BEGIN/END lines) as this repository's HOMEBREW_TAP_DEPLOY_KEY secret. The tap push cannot proceed without it."
            exit 1
          fi

      # The one checkout that keeps its credential: the push step below runs
      # `git -C tap push` with it. It is the tap's deploy key, scoped to that one
      # repository, and the only code that runs while it is on disk is the tap's
      # own script/apply_release.py.
      - name: Checkout the tap (deploy-key-scoped, for the push)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: tasker-systems/homebrew-tap
          ssh-key: ${{ secrets.HOMEBREW_TAP_DEPLOY_KEY }}
          path: tap

      - name: Download the release's own artifacts
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.determine-version.outputs.version }}
        run: |
          mkdir -p dist
          gh release download "v${VERSION}" --repo "${GITHUB_REPOSITORY}" --dir dist             --pattern 'temper-v'"${VERSION}"'-aarch64-apple-darwin.tar.gz'             --pattern 'temper-v'"${VERSION}"'-x86_64-unknown-linux-gnu.tar.gz'             --pattern 'temper-v'"${VERSION}"'-aarch64-apple-darwin.manifest.json'             --pattern 'temper-v'"${VERSION}"'-x86_64-unknown-linux-gnu.manifest.json'
          ls -la dist/

      - name: Apply the release to the tap (render, alias, commit)
        id: apply
        env:
          VERSION: ${{ needs.determine-version.outputs.version }}
        run: |
          python3 tap/script/apply_release.py --version "${VERSION}" --tap tap             --mac-archive "dist/temper-v${VERSION}-aarch64-apple-darwin.tar.gz"             --linux-archive "dist/temper-v${VERSION}-x86_64-unknown-linux-gnu.tar.gz"             --mac-manifest "dist/temper-v${VERSION}-aarch64-apple-darwin.manifest.json"             --linux-manifest "dist/temper-v${VERSION}-x86_64-unknown-linux-gnu.manifest.json" | tee apply.log
          echo "changed=$(sed -n 's/^changed=//p' apply.log | tail -n1)" >> "$GITHUB_OUTPUT"

      - name: Push (idempotent no-ops push nothing)
        if: steps.apply.outputs.changed == 'true'
        run: git -C tap push origin HEAD:main

  release-summary:
    name: Release Summary
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    needs: [determine-version, build-cli-darwin-arm64, build-cli-linux-x64, build-cli-windows-x64, build-skill-bundle, attest-skill-bundle, build-npm-clients, publish-npm-clients, build-ruby-client, publish-ruby-client, build-py-client, publish-py-client, build-rust-crates, publish-rust-crates]
    if: always()
    permissions:
      contents: write
    steps:
      # No git credential left in .git/config: create-github-release.sh reaches the
      # Release through `gh` and GH_TOKEN, never through git, and this job holds
      # `contents: write`.
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # By EXACT name, one artifact per producer — never a name pattern. A pattern would collect
      # any artifact anyone in the run uploaded under a matching name, and every file below ends up
      # on the Release, then in install.sh's and the homebrew tap's hands.
      - name: Download the darwin-arm64 CLI
        if: ${{ !contains(needs.*.result, 'failure') && !contains(needs.*.result, 'cancelled') && !contains(needs.*.result, 'skipped') }}
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: cli-v${{ needs.determine-version.outputs.version }}-darwin-arm64
          path: downloads/darwin-arm64/

      - name: Download the linux-x64 CLI
        if: ${{ !contains(needs.*.result, 'failure') && !contains(needs.*.result, 'cancelled') && !contains(needs.*.result, 'skipped') }}
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: cli-v${{ needs.determine-version.outputs.version }}-linux-x64
          path: downloads/linux-x64/

      - name: Download the windows-x64 CLI
        if: ${{ !contains(needs.*.result, 'failure') && !contains(needs.*.result, 'cancelled') && !contains(needs.*.result, 'skipped') }}
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: cli-v${{ needs.determine-version.outputs.version }}-windows-x64
          path: downloads/windows-x64/

      - name: Download the skill bundle
        if: ${{ !contains(needs.*.result, 'failure') && !contains(needs.*.result, 'cancelled') && !contains(needs.*.result, 'skipped') }}
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: cli-v${{ needs.determine-version.outputs.version }}-skill
          path: downloads/skill/

      # Each producer's files against the hashes it output — the same binding the registry lanes'
      # publish jobs apply — then into the one directory create-github-release.sh uploads from.
      - name: Check every download against its producer's hashes
        if: ${{ !contains(needs.*.result, 'failure') && !contains(needs.*.result, 'cancelled') && !contains(needs.*.result, 'skipped') }}
        env:
          SUMS_DARWIN_ARM64: ${{ needs.build-cli-darwin-arm64.outputs.sums }}
          SUMS_LINUX_X64: ${{ needs.build-cli-linux-x64.outputs.sums }}
          SUMS_WINDOWS_X64: ${{ needs.build-cli-windows-x64.outputs.sums }}
          SUMS_SKILL: ${{ needs.build-skill-bundle.outputs.sums }}
        run: |
          set -euo pipefail
          SUMS="$SUMS_DARWIN_ARM64" bash tools/scripts/release/artifact-sums.sh verify downloads/darwin-arm64
          SUMS="$SUMS_LINUX_X64"    bash tools/scripts/release/artifact-sums.sh verify downloads/linux-x64
          SUMS="$SUMS_WINDOWS_X64"  bash tools/scripts/release/artifact-sums.sh verify downloads/windows-x64
          SUMS="$SUMS_SKILL"        bash tools/scripts/release/artifact-sums.sh verify downloads/skill
          mkdir -p cli-artifacts
          mv downloads/darwin-arm64/* downloads/linux-x64/* downloads/windows-x64/* downloads/skill/* cli-artifacts/

      # Every job this one needs, build and attest jobs included, so a failed build reads as the
      # build that failed rather than as its publish job "skipped".
      - name: Write job summary
        env:
          VERSION: ${{ needs.determine-version.outputs.version }}
          NEEDS: ${{ toJSON(needs) }}
        run: |
          {
            echo "## Release v${VERSION}"
            echo ""
            echo "| Job | Result |"
            echo "|---|---|"
            printf '%s' "$NEEDS" | jq -r 'to_entries[] | select(.key != "determine-version")
              | "| \(.key) | \({"success":"✅","failure":"❌","cancelled":"⏹️","skipped":"⏭️"}[.value.result] // "❓") \(.value.result) |"'
          } >> "$GITHUB_STEP_SUMMARY"

      # Gated on EVERY producer. A release missing the skill bundle, or published while a registry
      # lane failed, would look complete — the same "absence is indistinguishable from
      # never-had-it" failure the manifest guard inside this script exists to prevent.
      - name: Create GitHub Release
        if: ${{ !contains(needs.*.result, 'failure') && !contains(needs.*.result, 'cancelled') && !contains(needs.*.result, 'skipped') }}
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.determine-version.outputs.version }}
          ARTIFACT_DIR: cli-artifacts
        run: ./.github/scripts/release/create-github-release.sh

      - name: Fail the job if any producer did not succeed
        if: ${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') || contains(needs.*.result, 'skipped') }}
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          echo "::error::$(printf '%s' "$NEEDS" | jq -r '[to_entries[] | select(.value.result != "success") | "\(.key): \(.value.result)"] | join(", ")') — release not published."
          exit 1
