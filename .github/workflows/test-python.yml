name: Python SDK Tests

on:
  workflow_call:

# Least privilege. The org default is `default_workflow_permissions: write`,
# which grants EVERY scope — including `actions: write` and `contents: write` —
# to any job that does not say otherwise. This repo now publishes SIGNED
# release artifacts, so a compromised action or build.rs in a test job would
# reach a signing oracle: create a tag at an attacker commit, then
# workflow_dispatch release.yml against it, and the backdoor is attested.
# (A tag pushed with GITHUB_TOKEN does not itself trigger release.yml — GitHub
# suppresses workflow runs from GITHUB_TOKEN-authored events — which is why the
# dispatch step matters and why `actions: write` is the scope that completes
# the chain.) Declaring any permissions block zeroes every unlisted scope.
#
# Declared here and not only in ci.yml: a workflow_call'd workflow inherits the
# CALLER's permissions when it declares none, so a second caller — or a direct
# dispatch — would silently reopen this. Each file states its own floor.
permissions:
  contents: read

jobs:
  test-python:
    name: temper-py (ruff, mypy, pytest, codegen drift)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    defaults:
      run:
        working-directory: clients/temper-py

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      # uv via pipx, which is preinstalled on ubuntu-latest, rather than a setup
      # action: one fewer third-party pin to keep current, and the interpreter comes
      # from `.python-version` rather than from whatever the runner image ships.
      # (The package's own floor is >= 3.9 — a floor is a promise to callers, a pin is
      # a statement about this checkout.)
      - name: Install uv
        run: pipx install uv

      - name: Install dependencies
        run: |
          uv python install
          uv sync --group dev

      - name: Lint
        run: |
          uv run ruff check .
          uv run ruff format --check .

      - name: Type-check
        run: uv run mypy

      - name: Test
        run: uv run pytest

      # The never-skipping backstop for the generated package — the role `test-ruby`'s
      # `rake drift` plays for the gem, and the schema drift step plays for temper-ts.
      # `detect-ci-scope.sh` runs this job for an openapi.json change precisely so this
      # step fires on the PR that would break it.
      #
      # No `docker` here and none needed: ubuntu-latest ships a JDK, so the pinned
      # generator runs from the jar. That is why this job does NOT pay the ~1GB image
      # pull that makes test-ruby expensive.
      - name: Codegen drift gate
        run: bash ../../.github/scripts/check-temper-py-drift.sh

      # A package that cannot be built is not shippable, and hatchling reads
      # temper/version.py standalone — a regression there is invisible to pytest and
      # fatal to `uv build`. The gem's job builds its gem for the identical reason.
      - name: Build the distribution
        run: uv build
