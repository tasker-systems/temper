name: TypeScript SDK & Agent Tests

on:
  workflow_call:

# Least privilege. The org default is `default_workflow_permissions: write`,
# which grants EVERY scope — including `actions: write` and `contents: write` —
# to any job that does not say otherwise. This repo now publishes SIGNED
# release artifacts, so a compromised action or build.rs in a test job would
# reach a signing oracle: create a tag at an attacker commit, then
# workflow_dispatch release.yml against it, and the backdoor is attested.
# (A tag pushed with GITHUB_TOKEN does not itself trigger release.yml — GitHub
# suppresses workflow runs from GITHUB_TOKEN-authored events — which is why the
# dispatch step matters and why `actions: write` is the scope that completes
# the chain.) Declaring any permissions block zeroes every unlisted scope.
#
# Declared here and not only in ci.yml: a workflow_call'd workflow inherits the
# CALLER's permissions when it declares none, so a second caller — or a direct
# dispatch — would silently reopen this. Each file states its own floor.
permissions:
  contents: read

jobs:
  temper-ts:
    name: temper-ts (typecheck, vitest)
    runs-on: ubuntu-latest
    timeout-minutes: 10

    defaults:
      run:
        working-directory: clients/temper-ts

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: "24"

      # npm, not bun: temper-ts is deliberately NOT a bun workspace member (the root list is exactly
      # temper-cloud + temper-ui), and a root install would inherit the root's overrides.
      - name: Install dependencies
        run: npm ci

      # The never-skipping backstop for the generated schema — the role `test-ruby`'s
      # `rake drift` plays for the gem. `detect-ci-scope.sh` runs this job for an
      # openapi.json change precisely so this step fires on the PR that would break it.
      - name: Schema drift (schema.ts vs openapi.json)
        run: bash ../../.github/scripts/check-temper-ts-drift.sh

      - name: Type-check
        run: npm run typecheck

      - name: Run tests
        run: npm test

  temper-telemetry-ts:
    name: temper-telemetry-ts (typecheck, vitest)
    runs-on: ubuntu-latest
    timeout-minutes: 10

    defaults:
      run:
        working-directory: clients/temper-telemetry-ts

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: "24"

      # npm, not bun: like temper-ts, this package is deliberately NOT a bun workspace
      # member (the root list is exactly temper-cloud + temper-ui), and a root install
      # would inherit the root's overrides. It ships compiled `dist/` and is consumed as
      # a `file:` dependency by temper-ui (and, in a later PR, the eve agents), whose own
      # jobs build it via their `build:dep` step.
      - name: Install dependencies
        run: npm ci

      - name: Type-check
        run: npm run typecheck

      # dist/ is committed (see this package's README for why bun's file:-dependency
      # copy semantics force that). Rebuild and fail on any drift, so a src/ change that
      # forgot to regenerate dist/ cannot ship stale compiled output to the consumers.
      - name: Build and verify committed dist is current
        run: |
          npm run build
          git diff --exit-code -- dist \
            || { echo "::error::dist/ is stale — run 'npm ci && npm run build' in clients/temper-telemetry-ts and commit the result"; exit 1; }

      - name: Run tests
        run: npm test

  steward:
    name: steward agent (typecheck, vitest)
    runs-on: ubuntu-latest
    timeout-minutes: 10

    defaults:
      run:
        working-directory: packages/agent-workflows/steward

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: "24"

      # The steward takes temper-ts as a `file:` dependency, so npm symlinks it and its `pretest`
      # hook builds it. Run from INSIDE this directory — a root install fails on the root's bun
      # overrides.
      - name: Install dependencies
        run: npm install

      - name: Type-check
        run: npm run typecheck

      - name: Run tests
        run: npm test

      # eve resolves the agent by DISCOVERY at build time — authored instructions, channels,
      # routes, and now `agent/instrumentation.ts`. typecheck and vitest are both blind to a
      # discovery break, so build here (as the `mention` job does). `connections/temper.ts`
      # resolves TEMPER_MCP_URL at module load, so discovery needs the variable PRESENT, not
      # correct — `.invalid` is reserved by RFC 2606 and can never resolve.
      - name: Build (eve discovery)
        env:
          TEMPER_MCP_URL: https://mcp.example.invalid
        run: npm run build

  mention:
    name: mention agent (typecheck, vitest)
    runs-on: ubuntu-latest
    timeout-minutes: 10

    defaults:
      run:
        working-directory: packages/agent-workflows/mention

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: "24"

      # Unlike the steward, this agent has no temper-ts `file:` dependency — nothing to build
      # first, so the install is a plain one. Still run from INSIDE this directory: it is
      # deliberately not a root workspace member, and a root install fails on the root's bun
      # overrides.
      - name: Install dependencies
        run: npm install

      - name: Type-check
        run: npm run typecheck

      - name: Run tests
        run: npm test

      # The gate that matters, and the one that was missing: eve resolves the agent by
      # DISCOVERY at build time — authored instructions, channels, routes. A missing
      # `agent/instructions.md` fails the build while typecheck and vitest both stay green,
      # so the first sign of it is a failed Vercel deploy. That is exactly how it shipped
      # once. Build here instead of finding out in prod.
      - name: Build (eve discovery)
        # `agent/connections/temper.ts` resolves TEMPER_MCP_URL at MODULE LOAD, matching the
        # steward. That is deliberate: a missing variable then fails the BUILD rather than the
        # first user turn. Discovery consequently needs the variable PRESENT, not correct —
        # nothing here connects to it. `.invalid` is reserved by RFC 2606 and can never
        # resolve, so this cannot accidentally reach a real host. The deployed value is
        # supplied per-environment.
        env:
          TEMPER_MCP_URL: https://mcp.example.invalid
        run: npm run build
