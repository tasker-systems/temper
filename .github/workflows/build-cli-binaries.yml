name: Build CLI Binaries

on:
  workflow_call:
    inputs:
      version:
        description: 'Version string for artifact naming (without leading v)'
        required: true
        type: string
  workflow_dispatch:
    inputs:
      version:
        description: 'Version string for artifact naming'
        required: false
        default: 'dev'

env:
  ONNX_RUNTIME_VERSION: '1.24.2'

jobs:
  build:
    name: ${{ matrix.target.name }}
    runs-on: ${{ matrix.target.runner }}
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
      attestations: write
    env:
      SQLX_OFFLINE: 'true'
    strategy:
      fail-fast: false
      matrix:
        target:
          - name: darwin-arm64
            runner: macos-14
            triple: aarch64-apple-darwin
            ort_archive: onnxruntime-osx-arm64
            ort_archive_ext: tgz
            # sha256 of onnxruntime-osx-arm64-<ONNX_RUNTIME_VERSION>.tgz. Bumping
            # ONNX_RUNTIME_VERSION means recomputing all three of these — see
            # internal/development/releasing.md#standing-obligation-onnx-runtime-digest-pinning
            ort_sha256: 0af4fa503e8ea285245b47ee42d0a7461b8156a81270857da0c1d4ecf858abde
            lib_name: libonnxruntime.dylib
            lib_dest_dir: lib
            archive_ext: tar.gz
          - name: linux-x64
            runner: ubuntu-22.04
            triple: x86_64-unknown-linux-gnu
            ort_archive: onnxruntime-linux-x64
            ort_archive_ext: tgz
            ort_sha256: 43725474ba5663642e17684717946693850e2005efbd724ac72da278fead25e6
            lib_name: libonnxruntime.so
            lib_dest_dir: lib
            archive_ext: tar.gz
          - name: windows-x64
            runner: windows-2022
            triple: x86_64-pc-windows-msvc
            ort_archive: onnxruntime-win-x64
            ort_archive_ext: zip
            ort_sha256: 8e3e9c826375352e29cb2614fe44f3d7a4b0ff7b8028ad7a456af9d949a7e8b0
            lib_name: onnxruntime.dll
            lib_dest_dir: .
            archive_ext: zip

    steps:
      - name: Checkout code
        # SHA-pinned, not tag-pinned: this job holds `id-token: write` and
        # `attestations: write`, so anything it runs can get a genuine Sigstore
        # signature over its output. A mutable major-version tag is a repo the
        # signing key trusts and that someone else can move. Pinning is scoped
        # to THIS workflow on purpose — repo-wide pinning generates ~20
        # rubber-stamped bump PRs a year, which is net-negative for security.
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The release archive ships the embedding model, which is an LFS blob. Without this the
          # job gets a 130-byte pointer file instead — which is exactly how the CLI ended up
          # fetching a *different* (fp32) model from Hugging Face at runtime while the server used
          # the quantized one, silently filling the index with vectors from two models.
          lfs: true

      # NOTE: this job deliberately does NOT use `.github/actions/setup-rust`.
      # That composite is the right thing for the PR path, but it wraps
      # `dtolnay/rust-toolchain@stable` + `Swatinem/rust-cache@v2` — both of
      # which are exactly what the two blocks below exist to avoid inside the
      # signing job. Pointing this job at the composite would silently reinstate
      # both. If the composite is ever reworked, it does not follow that this job
      # should adopt it; re-derive the two decisions below first.
      - name: Install Rust toolchain
        shell: bash
        run: |
          # rustup is preinstalled on all three runner images (macos-14,
          # ubuntu-22.04, windows-2022). Used directly rather than
          # `dtolnay/rust-toolchain@stable` because that action resolves a
          # MUTABLE BRANCH ref inside the job that holds `id-token: write` — and
          # unlike the other actions here it cannot simply be SHA-pinned: a
          # branch has no release cadence, so a pin would have to be bumped
          # blind, forever, with no changelog to read. Replacing it is the only
          # way to close it. There is no rust-toolchain.toml in this repo, so
          # `rustup default stable` is what makes the `cargo build` below use
          # stable.
          rustup toolchain install stable --profile minimal --no-self-update
          rustup default stable
          rustup target add "${{ matrix.target.triple }}"
          rustc --version --verbose

      # NO BUILD CACHE HERE — this is deliberate, do not "restore" it.
      #
      # `Swatinem/rust-cache@v2` keys its cache into the repository's Actions
      # cache scope, and GitHub's cache scoping lets a job on `main` (or on any
      # branch whose cache the default branch's scope covers) WRITE entries that
      # a job on a release tag can then READ. That means a compromised PR/`main`
      # job could seed a poisoned `target/` — and this job would compile against
      # it, produce a backdoored binary, and then TRUTHFULLY attest it. The
      # attestation would be genuine; the artifact would not be. Every
      # downstream verdict (`temper version --verify --online`, `temper update`)
      # would read `verified` over it, which is the worst possible failure shape
      # for this repo: a signature-backed lie rather than an honest
      # `unverifiable`.
      #
      # THE TRADEOFF, stated so nobody has to re-derive it: dropping the cache
      # costs a cold `cargo build --release` per matrix target on every release
      # (roughly the job's 30-minute timeout budget is sized for this). We pay
      # it because release builds are infrequent — tags only, not PRs — and this
      # is the one build path whose output is signed. The alternative considered
      # and rejected was keeping the cache with a release-scoped `key`; a
      # distinct key narrows the namespace but does NOT change who can write
      # into the scope, so it mitigates collision, not poisoning. Build time is
      # the cheaper thing to spend.
      - name: Build temper CLI (${{ matrix.target.triple }})
        shell: bash
        run: |
          cargo build \
            --release \
            --locked \
            --package temper-cli \
            --target ${{ matrix.target.triple }} \
            --features embed,extract

      - name: Download ONNX Runtime (${{ matrix.target.name }})
        shell: bash
        run: |
          ORT_VER="${{ env.ONNX_RUNTIME_VERSION }}"
          ORT_NAME="${{ matrix.target.ort_archive }}-${ORT_VER}"
          ORT_EXT="${{ matrix.target.ort_archive_ext }}"
          ORT_URL="https://github.com/microsoft/onnxruntime/releases/download/v${ORT_VER}/${ORT_NAME}.${ORT_EXT}"

          mkdir -p ort-staging
          echo "Downloading ${ORT_URL}..."
          curl -fsSL -o "ort-staging/ort.${ORT_EXT}" "$ORT_URL"

          # Pin the native library we are about to sign. What comes out of this
          # archive is copied into staging, hashed into the manifest, attested,
          # and then dlopen'd by the shipped binary — so an unpinned fetch means
          # we faithfully sign whatever the network handed us, and every
          # downstream verdict is `verified` over it. The embedding model riding
          # in the same archive is already pinned via EXPECTED_MODEL_SHA256
          # (attest.rs cites it as this repo's doctrine); this closes the other
          # half. Bumping ONNX_RUNTIME_VERSION means recomputing all three
          # matrix digests — see
          # internal/development/releasing.md#standing-obligation-onnx-runtime-digest-pinning
          #
          # sha256sum on Linux and on the Windows runner's Git Bash, shasum on
          # macOS — the same branch as emit-manifest.sh's `sha_of` (:23-29) and
          # install.sh's `sha_of_file` (:233-239). Never assume one: this matrix
          # spans macos-14, ubuntu-22.04, AND windows-2022, and this step runs on
          # all three. Witnesses for the Windows leg are already in this file —
          # the zip-only archive step (`archive_ext == 'zip'`, i.e. windows-x64
          # alone) calls `sha256sum` under `shell: bash`, and the unconditional
          # "Emit per-file manifest" step runs `sha_of` there too.
          EXPECTED_ORT_SHA="${{ matrix.target.ort_sha256 }}"
          if command -v sha256sum >/dev/null 2>&1; then
            ACTUAL_ORT_SHA=$(sha256sum "ort-staging/ort.${ORT_EXT}" | awk '{print $1}')
          else
            ACTUAL_ORT_SHA=$(shasum -a 256 "ort-staging/ort.${ORT_EXT}" | awk '{print $1}')
          fi
          if [[ "$ACTUAL_ORT_SHA" != "$EXPECTED_ORT_SHA" ]]; then
            echo "error: ONNX Runtime archive sha256 mismatch for ${ORT_URL}" >&2
            echo "  expected: $EXPECTED_ORT_SHA" >&2
            echo "  actual:   $ACTUAL_ORT_SHA" >&2
            exit 1
          fi
          echo "ONNX Runtime archive sha256 verified: $ACTUAL_ORT_SHA"

          echo "Extracting..."
          if [[ "$ORT_EXT" == "tgz" ]]; then
            tar -xzf "ort-staging/ort.${ORT_EXT}" -C ort-staging
          else
            7z x "ort-staging/ort.${ORT_EXT}" -oort-staging -y >/dev/null
          fi

          echo "Contents:"
          find ort-staging -name 'libonnxruntime*' -o -name 'onnxruntime.dll' | head -20

      - name: Assemble archive contents
        shell: bash
        # `inputs.version` is a FREE STRING — this workflow carries its own
        # `workflow_dispatch` (default 'dev', no `type:`, no pattern), so
        # `actions: write` alone dispatches it directly, with no tag and no
        # release.yml involved. Expanding it into the run body's TEXT would put
        # arbitrary code inside the job holding `id-token: write` +
        # `attestations: write` — the signing job itself. An env var is never
        # re-parsed as script text. `matrix.target.triple` stays inline: it is a
        # repo-controlled literal from the matrix above, not caller input.
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          VERSION="$INPUT_VERSION"
          TARGET="${{ matrix.target.triple }}"
          STAGING="staging"
          rm -rf "$STAGING"
          mkdir -p "$STAGING/${{ matrix.target.lib_dest_dir }}"

          BIN_SRC="target/${TARGET}/release/temper"
          if [[ "${{ matrix.target.name }}" == "windows-x64" ]]; then
            BIN_SRC="${BIN_SRC}.exe"
            cp "$BIN_SRC" "$STAGING/temper.exe"
          else
            cp "$BIN_SRC" "$STAGING/temper"
            chmod +x "$STAGING/temper"
          fi

          ORT_LIB=$(find ort-staging -name '${{ matrix.target.lib_name }}' | head -n1)
          if [[ -z "$ORT_LIB" ]]; then
            echo "::error::Could not locate ${{ matrix.target.lib_name }} in extracted archive"
            find ort-staging -type f | head -50
            exit 1
          fi

          if [[ "${{ matrix.target.lib_dest_dir }}" == "." ]]; then
            cp "$ORT_LIB" "$STAGING/${{ matrix.target.lib_name }}"
          else
            cp "$ORT_LIB" "$STAGING/${{ matrix.target.lib_dest_dir }}/${{ matrix.target.lib_name }}"
          fi

          # The embedding model rides in the archive alongside the ORT lib. The CLI resolves it
          # binary-adjacent (`<exe_dir>/models/`) and verifies its sha256 before loading, so binary
          # and model stay in lockstep through `temper update` — a binary and a model that disagree
          # produce a silently corrupt semantic index.
          MODEL_SRC="crates/temper-ingest/models/bge-base-en-v1.5/model_quantized.onnx"
          if [[ ! -f "$MODEL_SRC" ]] || [[ "$(wc -c < "$MODEL_SRC")" -lt 1000000 ]]; then
            echo "::error::$MODEL_SRC is missing or is still an LFS pointer (checkout needs lfs: true)"
            ls -la "$(dirname "$MODEL_SRC")" || true
            exit 1
          fi
          mkdir -p "$STAGING/models"
          cp "$MODEL_SRC" "$STAGING/models/"

          cp LICENSE "$STAGING/"
          {
            printf 'temper v%s — %s\n' "$VERSION" "$TARGET"
            printf '\n'
            printf 'Install this archive via:\n'
            printf '  https://raw.githubusercontent.com/tasker-systems/temper/main/scripts/install/install.sh\n'
            printf 'or\n'
            printf '  https://raw.githubusercontent.com/tasker-systems/temper/main/scripts/install/install.ps1\n'
            printf '\n'
            printf 'See full install docs at:\n'
            printf '  https://github.com/tasker-systems/temper/blob/main/docs/guides/install.md\n'
          } > "$STAGING/README-INSTALL.txt"

          echo "Staging contents:"
          find "$STAGING" -type f

      - name: Emit per-file manifest
        shell: bash
        env:
          VERSION: ${{ inputs.version }}
          TARGET: ${{ matrix.target.triple }}
          STAGING: staging
          OUTPUT: temper-v${{ inputs.version }}-${{ matrix.target.triple }}.manifest.json
        run: bash .github/scripts/release/emit-manifest.sh

      - name: Create archive (tar.gz)
        if: matrix.target.archive_ext == 'tar.gz'
        shell: bash
        # Free-string caller input; see "Assemble archive contents" above.
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          VERSION="$INPUT_VERSION"
          TARGET="${{ matrix.target.triple }}"
          ARCHIVE="temper-v${VERSION}-${TARGET}.tar.gz"
          tar -czf "$ARCHIVE" -C staging .
          ls -lh "$ARCHIVE"
          shasum -a 256 "$ARCHIVE" > "${ARCHIVE}.sha256"
          cat "${ARCHIVE}.sha256"

      - name: Create archive (zip)
        if: matrix.target.archive_ext == 'zip'
        shell: bash
        # Free-string caller input; see "Assemble archive contents" above.
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          VERSION="$INPUT_VERSION"
          TARGET="${{ matrix.target.triple }}"
          ARCHIVE="temper-v${VERSION}-${TARGET}.zip"
          (cd staging && 7z a -tzip "../${ARCHIVE}" . >/dev/null)
          ls -lh "$ARCHIVE"
          sha256sum "$ARCHIVE" > "${ARCHIVE}.sha256"
          cat "${ARCHIVE}.sha256"

      - name: Attest build provenance
        # SHA-pinned (see the checkout step). `v4` is an ANNOTATED tag, so the
        # tag ref resolves to a tag OBJECT, not a commit — this is the
        # dereferenced commit. Pinning the tag-object sha instead is rejected by
        # Actions at runtime, and it would fail on the release path only.
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4
        with:
          # Each matrix target produces exactly one of .tar.gz/.zip (per its
          # archive_ext above), never both. subject-path tolerates a
          # non-matching line in the list — @actions/glob resolves each line
          # independently and only errors if the *combined* match set across
          # every line is empty — so the manifest plus whichever archive this
          # target actually built are attested together without a per-target
          # conditional here.
          subject-path: |
            temper-v${{ inputs.version }}-${{ matrix.target.triple }}.tar.gz
            temper-v${{ inputs.version }}-${{ matrix.target.triple }}.zip
            temper-v${{ inputs.version }}-${{ matrix.target.triple }}.manifest.json

      - name: Upload artifact
        # SHA-pinned (see the checkout step).
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: cli-v${{ inputs.version }}-${{ matrix.target.name }}
          path: |
            temper-v${{ inputs.version }}-*.tar.gz
            temper-v${{ inputs.version }}-*.zip
            temper-v${{ inputs.version }}-*.sha256
            temper-v${{ inputs.version }}-*.manifest.json
          retention-days: 7
          if-no-files-found: error
