name: Ruby SDK Tests

on:
  workflow_call:

# Least privilege. The org default is `default_workflow_permissions: write`,
# which grants EVERY scope — including `actions: write` and `contents: write` —
# to any job that does not say otherwise. This repo now publishes SIGNED
# release artifacts, so a compromised action or build.rs in a test job would
# reach a signing oracle: create a tag at an attacker commit, then
# workflow_dispatch release.yml against it, and the backdoor is attested.
# (A tag pushed with GITHUB_TOKEN does not itself trigger release.yml — GitHub
# suppresses workflow runs from GITHUB_TOKEN-authored events — which is why the
# dispatch step matters and why `actions: write` is the scope that completes
# the chain.) Declaring any permissions block zeroes every unlisted scope.
#
# Declared here and not only in ci.yml: a workflow_call'd workflow inherits the
# CALLER's permissions when it declares none, so a second caller — or a direct
# dispatch — would silently reopen this. Each file states its own floor.
permissions:
  contents: read

jobs:
  test-ruby:
    name: temper-rb (rubocop, rspec, codegen drift)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    defaults:
      run:
        working-directory: clients/temper-rb

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          # Floats to the newest 3.4.x. The gem's floor is >= 3.1; the dev pin in
          # .ruby-version / mise.toml is 3.4.10.
          ruby-version: "3.4"
          bundler-cache: true
          working-directory: clients/temper-rb

      - name: Lint
        run: bundle exec rubocop

      - name: Test
        run: bundle exec rspec

      # The generated core is committed, so contributors need neither Docker nor a
      # JVM to build or test the gem. CI is where we prove it still matches the
      # contract: `rake drift` regenerates and fails on any diff.
      #
      # `rake drift` is a thin delegate to .github/scripts/check-temper-rb-drift.sh --
      # the same script `cargo make openapi-rb-drift` runs -- so this job and local dev
      # assert the identical thing. It used to hand-roll its own `git diff` here, and
      # that copy drifted: it never grew the manifest diff and orphan cross-check that
      # catch a file the generator has STOPPED writing, so two retired files rode this
      # step green. The script skips only on a host with neither Docker nor a JVM; this
      # runner has both, so it never skips here.
      #
      # This step is why the job is path-scoped -- it pulls a ~1GB image.
      - name: Codegen drift gate
        run: bundle exec rake drift

      # A gem that cannot be packaged is not shippable, and the gemspec loads
      # lib/temper/version.rb standalone -- a regression there is invisible to
      # rspec but fatal to `gem build`.
      - name: Build the gem
        run: gem build temper-rb.gemspec
