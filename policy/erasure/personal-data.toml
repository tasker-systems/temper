# The personal-data surface — DERIVED candidates, DECLARED classifications.
#
# WHY THIS FILE EXISTS, AND WHY IT IS HALF A FILE.
#
# A fully-derived inventory of personal data is impossible: no query can tell you whether a `text`
# column holds a person's name. A fully-declared one rots — the way it rots is that someone adds a
# column and nobody remembers this file. So the work is split, and the split is the point:
#
#   * `personal_data_surface_test.rs` DERIVES the candidate set from the live catalog. It cannot
#     miss a column, because it asks Postgres rather than a person.
#   * This file DECLARES the judgement for each candidate: what class of personal data it holds and
#     how far erasure can reach it.
#   * The test fails on any derived candidate with no entry here, and on any entry here naming a
#     column that no longer exists. Neither half can drift silently.
#
# The derivations are seven, and each exists because the one before it is blind to something:
#
#   fk       foreign keys into kb_profiles / kb_entities.
#   poly     polymorphic (`*_table` + `*_id`) references, which carry NO foreign key at all —
#            Postgres will neither cascade them nor complain about them.
#   prin     every column of the principal tables themselves, where identity actually lives.
#   vec      vector / tsvector columns: representations derived from content.
#   json     every jsonb column, because that is where unbounded free-form data lives.
#   bytes    every bytea column. NO structural derivation above sees BYTEA — raw binary content
#            is invisible to type-keyed nomination alike. Binary content is personal content the
#            moment a person uploads it, so every bytea column nominates.
#   named    a NAME-PATTERN heuristic over text columns. It is the only derivation that is not
#            structural, and it exists because four identifier columns have no structure to find
#            them by: kb_team_invitations.invited_email, kb_slack_link_intents.slack_principal_id,
#            kb_slack_grant_vault.slack_principal_id, kb_saml_idp.email_attr. A heuristic produces
#            CANDIDATES, never verdicts — which is exactly what this file is for.
#
# WHAT THIS FILE DOES NOT CLASSIFY.
# The `text`/`varchar` columns no derivation above nominates are NOT classified here. They are
# declared in the sibling manifest, policy/erasure/sensitivity-scan.toml, which states their count
# and adjudicates each as scan / structural / credential / out-of-scope. The two files PARTITION
# every text/varchar column of a public base table (sensitivity_scan_surface_test.rs), so a column
# is never in neither. That is a declaration, not a detection: a column called `note` that happens
# to hold a person's name is found by no derivation here, and is reached only by the sensitivity
# sweep reading what the sibling marks `scan`.
#
# FORMAT (TOML; `#` comments and blank lines ignored)
#   [columns]
#   "<table>.<column>" = { class = "<class>", ceiling = "<ceiling>", achieved = "<achieved>", note = "<note>" }
#
#   One inline table per column, so a column declared twice fails the TOML parse itself. `note`
#   may be left out, and then reads as empty.
#
# class
#   identifier     a direct identifier of a natural person
#   reference      a pseudonymous UUID pointing at a principal
#   content        authored content
#   derived        a representation computed FROM content (vector, search index)
#   incidental     free-form that MAY carry personal data depending on what was written
#   discriminator  the table-name half of a polymorphic pair; no personal data, but it is what
#                  makes its `_id` sibling resolvable, so it is declared rather than skipped
#   none           carries no personal data
#
# ceiling — how far erasure reaches
#   full        erasable outright
#   recompute   must be RECOMPUTED after an erasure, not deleted; a cascade will not reach it
#   pseudonym   a UUID that stops identifying anyone once kb_profiles is tombstoned
#   none        on the append-only ledger; cannot be erased at all
#   n-a         nothing to erase
#
# achieved — what the person act DOES reach, which is not the ceiling. The ceiling says how far
# erasure could go; `achieved` says what the act does. Every `full` line names what reaches it, or
# the remainder; every other line carries `-`. Claims join with ` + `, and each one is bound by
# personal_data_surface_test.rs to the live act:
#   erased:<arm>         _erasure_apply_redaction assigns the column an erasure value in an UPDATE
#                        of its table, and every assignment to it erases (NULL, '', '{}', or an
#                        'erased…' sentinel, `v_sentinel` included)
#   deleted:<arm>        _erasure_apply_redaction deletes from the column's table
#   cascaded:<arm>:<t>   _erasure_apply_redaction deletes from <t>, and the column's table has a
#                        foreign key to <t> with ON DELETE CASCADE
#   resource-erasure     principal_erasure_execute runs resource_erasure_execute over the estate,
#                        which runs _resource_erasure_apply_redaction, and
#                        policy/erasure/resource-erasure.toml declares the column `handled`
#   remainder: <reason>  the act does not reach it; the reason is required
#
# <arm> is the number in the act body's comments: (1) to (12), with 4a, 6a, 7a and 9a. It is a
# label for the reader, and the test checks only that it names an arm that exists.
#
# WHAT THE ACHIEVED BINDING READS: the live act's statements.
#   * Not rows. A claim binds when the statement exists. Which rows its WHERE reaches is the act's own
#     witnesses' job; where the act leaves rows of a reached column, the note says which.
#   * Not control flow. It binds statements, not the branches that run them: an UPDATE under an IF
#     never taken, or after a RETURN, still binds. The refresh-token claims are two branches of one
#     IF, and the fence sees both.
#   * Not arms. Comments are dropped before binding, so it cannot tell which arm a statement sits in.

[columns]

# ── the pseudonym, and the identifiers that give it meaning ──────────────────────────────────
"kb_profiles.id"                                   = { class = "reference", ceiling = "pseudonym", achieved = "-", note = "THE pseudonym; breaking its mapping is what erasure does" }
"kb_profiles.email"                                = { class = "identifier", ceiling = "full", achieved = "erased:7" }
"kb_profiles.handle"                               = { class = "identifier", ceiling = "full", achieved = "erased:7", note = "also denormalized into kb_teams.slug — see below" }
"kb_profiles.display_name"                         = { class = "identifier", ceiling = "full", achieved = "erased:7", note = "also denormalized into kb_teams.name — see below" }
"kb_profiles.preferences"                          = { class = "incidental", ceiling = "full", achieved = "erased:7", note = "open jsonb, user-controlled" }
"kb_profiles.created"                              = { class = "none", ceiling = "n-a", achieved = "-" }
"kb_profiles.tombstoned_at"                        = { class = "none", ceiling = "n-a", achieved = "-", note = "the erasure act's own marker: WHEN the pseudonym broke — act metadata, not an identifier; the identifier nulling happens in the same act" }
"kb_profile_auth_links.id"                         = { class = "none", ceiling = "n-a", achieved = "-", note = "surrogate" }
"kb_profile_auth_links.profile_id"                 = { class = "reference", ceiling = "pseudonym", achieved = "-" }
"kb_profile_auth_links.email"                      = { class = "identifier", ceiling = "full", achieved = "erased:9", note = "every provider's rows" }
"kb_profile_auth_links.auth_provider_user_id"      = { class = "identifier", ceiling = "full", achieved = "erased:9", note = "the IdP's subject identifier for this person; sentineled to 'erased-' || the row's own id (the UNIQUE (auth_provider, auth_provider_user_id) grain) AFTER arm 8's Slack stores resolve their principals through it — the order is load-bearing" }
"kb_profile_auth_links.auth_provider"              = { class = "none", ceiling = "n-a", achieved = "-" }
"kb_profile_auth_links.email_verified"             = { class = "none", ceiling = "n-a", achieved = "-" }
"kb_profile_auth_links.is_default"                 = { class = "none", ceiling = "n-a", achieved = "-" }
"kb_profile_auth_links.linked_at"                  = { class = "none", ceiling = "n-a", achieved = "-" }

# ── the actor layer: one indirection between the ledger and a person ─────────────────────────
"kb_entities.id"                                   = { class = "reference", ceiling = "pseudonym", achieved = "-", note = "what kb_events points at; undeletable once any event exists" }
"kb_entities.profile_id"                           = { class = "reference", ceiling = "pseudonym", achieved = "-", note = "the link erasure breaks" }
"kb_entities.name"                                 = { class = "identifier", ceiling = "full", achieved = "erased:10", note = "agent-instance name; may embed a person's name; 'erased-' || the entity's own id (the (profile_id, name) UNIQUE grain forbids one shared sentinel), the entity UUID kept as the pseudonym" }
"kb_entities.metadata"                             = { class = "incidental", ceiling = "full", achieved = "erased:6a", note = "launch metadata (model, platform, persona), emptied to '{}'" }
"kb_entities.created"                              = { class = "none", ceiling = "n-a", achieved = "-" }

# ── the ledger: immutable by trigger, so every ceiling here is `none` ────────────────────────
"kb_events.emitter_entity_id"                      = { class = "reference", ceiling = "pseudonym", achieved = "-", note = "the ONLY ledger link to a person, and it is one indirection" }
"kb_events.payload"                                = { class = "incidental", ceiling = "none", achieved = "-", note = "titles, origin_uri, edge labels, property values, telos_centroid" }
"kb_events.metadata"                               = { class = "incidental", ceiling = "none", achieved = "-" }
"kb_events.references"                             = { class = "none", ceiling = "none", achieved = "-", note = "typed provenance pointers" }
"kb_event_types.payload_schema"                    = { class = "none", ceiling = "n-a", achieved = "-" }

# ── denormalized by trigger, reachable by NO foreign key ─────────────────────────────────────
# `sync_personal_team` copies handle and display_name into kb_teams on every profile insert.
# Found by derivation `denorm`, not by memory. Scrubbing kb_profiles alone leaves these behind.
"kb_teams.slug"                                    = { class = "identifier", ceiling = "full", achieved = "erased:1", note = "'personal-' || kb_profiles.handle, `-N` suffixed when that slug was held" }
"kb_teams.name"                                    = { class = "identifier", ceiling = "full", achieved = "erased:1", note = "kb_profiles.display_name || ' (personal)'" }
"kb_teams.personal_of"                             = { class = "reference", ceiling = "pseudonym", achieved = "-", note = "the profile whose personal team this is; how erasure finds the two rows above" }

# ── polymorphic references: a CHECK, not a foreign key ───────────────────────────────────────
"kb_access_grants.principal_table"                 = { class = "discriminator", ceiling = "n-a", achieved = "-" }
"kb_access_grants.principal_id"                    = { class = "reference", ceiling = "pseudonym", achieved = "-", note = "may be a team; only kb_profiles rows are in scope" }
"kb_access_grants.subject_table"                   = { class = "discriminator", ceiling = "n-a", achieved = "-", note = "nominated by `named`; the subject is a resource, not a person" }
"kb_contexts.owner_table"                          = { class = "discriminator", ceiling = "n-a", achieved = "-" }
"kb_contexts.owner_id"                             = { class = "reference", ceiling = "pseudonym", achieved = "-" }
"kb_data_artifacts.kind_owner_table"               = { class = "discriminator", ceiling = "n-a", achieved = "-" }
"kb_data_artifacts.kind_owner_id"                  = { class = "reference", ceiling = "pseudonym", achieved = "-" }
"kb_data_artifact_shapes.kind_owner_table"         = { class = "discriminator", ceiling = "n-a", achieved = "-" }
"kb_data_artifact_shapes.kind_owner_id"            = { class = "reference", ceiling = "pseudonym", achieved = "-" }

# ── content-derived representations ──────────────────────────────────────────────────────────
# A centroid is an AGGREGATE over member embeddings. No cascade reaches it: erasing a member does
# not change it, so it must be recomputed or it keeps residue of erased content.
"kb_chunks.embedding"                              = { class = "derived", ceiling = "full", achieved = "resource-erasure + erased:4", note = "estate resources through resource erasure; a charter the act holds through arm 4. A chunk outside the estate keeps its vector" }
"kb_resource_search_index.search_vector"           = { class = "derived", ceiling = "full", achieved = "resource-erasure + erased:5", note = "emptied to ''; the embedding's reach" }
"kb_cogmap_regions.centroid"                       = { class = "derived", ceiling = "recompute", achieved = "-" }
"kb_cogmaps.telos_centroid"                        = { class = "derived", ceiling = "recompute", achieved = "-", note = "an immutable copy also rides kb_events.payload" }
"kb_contexts.telos_centroid"                       = { class = "derived", ceiling = "recompute", achieved = "-", note = "an immutable copy also rides kb_events.payload" }

# ── external identifiers ─────────────────────────────────────────────────────────────────────
"kb_team_invitations.invited_email"                = { class = "identifier", ceiling = "full", achieved = "erased:6a", note = "an email for someone who may have NO profile at all. Invitations sent by the subject or to an email they verifiably hold, sentineled to 'erased-' || id, the token replaced by a random sentinel, pending ones revoked. An invitation to an address the subject never verified is left and counted" }
"kb_slack_link_intents.slack_principal_id"         = { class = "identifier", ceiling = "full", achieved = "deleted:8", note = "no profile FK; an unconsumed intent is reachable only by this value, matched through a Slack auth link or a vault row of the subject" }
"kb_slack_grant_vault.slack_principal_id"          = { class = "identifier", ceiling = "full", achieved = "deleted:8", note = "matched through a Slack auth link or the vault row's own profile_id; the grant is revoked at Slack first, best-effort, before the act" }
"kb_slack_grant_vault.rt_ciphertext"               = { class = "identifier", ceiling = "full", achieved = "deleted:8", note = "AEAD-sealed Slack refresh token — the durable grant (found by the `bytes` derivation; invisible to every type-keyed source before it); a failed revoke re-seals the token into kb_erasure_slack_revocations first" }
"kb_slack_grant_vault.at_ciphertext"               = { class = "identifier", ceiling = "full", achieved = "deleted:8", note = "AEAD-sealed cached Slack access token" }
"kb_slack_grant_vault.rt_nonce"                    = { class = "none", ceiling = "n-a", achieved = "-", note = "per-row random AEAD nonce — no personal data" }
"kb_slack_grant_vault.at_nonce"                    = { class = "none", ceiling = "n-a", achieved = "-", note = "per-row random AEAD nonce — no personal data" }
"kb_slack_grant_vault.key_fingerprint"             = { class = "none", ceiling = "n-a", achieved = "-", note = "truncated HMAC of the instance vault key, identical on every row that key sealed — names a key, not a person" }
"kb_erasure_slack_revocations.rt_ciphertext"       = { class = "identifier", ceiling = "full", achieved = "remainder: not the act's to reach — the erasure drain (erasure_slack_revocation_service) NULLs it at revocation or at the retry cap, outside any act body", note = "a Slack refresh token whose revoke failed during an erasure, re-sealed under the row id; no Slack id or profile beside it" }
"kb_erasure_slack_revocations.rt_nonce"            = { class = "none", ceiling = "n-a", achieved = "-", note = "per-row random AEAD nonce — no personal data" }
"kb_erasure_retention_policies.set_by_profile_id"  = { class = "reference", ceiling = "pseudonym", achieved = "-", note = "the operator who set the policy" }
"kb_saml_idp.email_attr"                           = { class = "none", ceiling = "n-a", achieved = "-", note = "an attribute NAME, not a value" }
"_sqlx_migrations.checksum"                        = { class = "none", ceiling = "n-a", achieved = "-", note = "test/migration bookkeeping bytea, not user data" }

# ── free-form columns that may carry personal data ───────────────────────────────────────────
"kb_properties.property_value"                     = { class = "incidental", ceiling = "full", achieved = "resource-erasure", note = "the estate resources' properties, to the sentinel '\"erased\"'; a property on a resource outside the estate is not reached" }
"kb_workflow_jobs.payload"                         = { class = "incidental", ceiling = "full", achieved = "resource-erasure", note = "jobs whose resource_id is an estate resource; context-, cogmap- and system-scoped jobs are left" }
"kb_invocations.outcome"                           = { class = "incidental", ceiling = "full", achieved = "remainder: no arm reaches it — the person act never touches kb_invocations, and resource erasure declares the column out of scope" }
"kb_connections.credential"                        = { class = "incidental", ceiling = "full", achieved = "erased:6a", note = "an external account binding; connections homed in the estate or whose profile is the subject, revoked in temper; provider-side tokens are not revoked (task 01a128a4-5a16-7724-8e57-3dc2f2327f0f)" }
"kb_connections.observed_reach"                    = { class = "incidental", ceiling = "full", achieved = "erased:6a", note = "NULLed with the credential" }
"kb_connections.tool_manifest"                     = { class = "none", ceiling = "n-a", achieved = "-", note = "the provider's tool schema" }
"kb_data_artifact_content.content"                 = { class = "content", ceiling = "full", achieved = "resource-erasure + erased:11", note = "every artifact of an estate resource, whatever its kind owner, through resource erasure, emptied to '{}' with the artifact id and both content_hash columns kept. Arm 11 empties the subject's own kind namespace wherever it is homed in the estate, which after resource erasure leaves a charter's; another principal's kind on a charter is the remainder the act's targets name. Not admitted to kb_erased_content: no artifact consult site exists — the tombstone keeps the subject from re-committing" }
"kb_blob_upload_segments.bytes"                    = { class = "content", ceiling = "full", achieved = "cascaded:6a:kb_blob_uploads", note = "raw staged bytes, upload transport state; pre-ledger, no event/replay copy. Upload sessions owned by the subject or homed in the estate are deleted; their segments cascade" }
"kb_data_artifact_shapes.schema"                   = { class = "none", ceiling = "n-a", achieved = "-", note = "a JSON schema" }
"kb_data_artifact_verdicts.detail"                 = { class = "incidental", ceiling = "full", achieved = "resource-erasure", note = "verdicts on an estate resource's artifacts" }
"kb_subscriptions.selector"                        = { class = "none", ceiling = "n-a", achieved = "-" }
"kb_oauth_flow.claims"                             = { class = "identifier", ceiling = "full", achieved = "deleted:6a", note = "IdP claims carry email and name; flows bound to the subject; an unbound flow is minutes from expiry and reaped by the AS sweep" }
"kb_oauth_refresh_tokens.claims"                   = { class = "identifier", ceiling = "full", achieved = "deleted:7a + erased:7a", note = "IdP claims carry email and name; tokens bound to the subject, or unbound and theirs by (login provider, sub), deleted with their replay rows; under a credential-replay-evidence policy kept revoked with claims emptied and hash replaced. The two claims are the two branches of one IF: the fence sees both statements, not which one runs" }

