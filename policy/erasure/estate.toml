# The erasure estate: what an erasure holds, and how it reaches each table's rows.
#
# Under goal "A person can be erased without the ledger losing what happened".
#
# An estate is the set of containers an erasure takes in, and everything homed in them. This file
# says two things about it (spec D3 *Contents*, D7.4):
#
#   * scope   the rules that put containers in an estate, one per D3 bullet, each with the
#             mechanism that selects its set.
#   * tables  one grain per table: how an erasure reaches the table's rows.
#
# THE GRAINS.
#
#   per-item      erased item by item, each by its own unit. The entry names the fence (the flag
#                 column that makes a declared item unreachable), the unit (the function that
#                 erases one item), whether the table is a container, and, for a leaf, how an item
#                 names the container it is homed in. kb_resources, kb_contexts, kb_cogmaps,
#                 kb_blobs, and kb_edges homed in the estate.
#   covered       reached through a parent, by a foreign key or a CHECKed discriminator pair, and
#                 erased by the parent's unit. A `unit` on a covered entry names what erases rows the
#                 parent's unit does not.
#   identity      erased at declaration, with the subject's identity. The mechanism is the person
#                 act's body, `_erasure_apply_redaction`; the note names its arms, as the body's
#                 comments number them (20261023100000). Which columns each arm reaches is
#                 personal-data.toml's `achieved`, at column grain.
#   declared-out  deliberately not erased, with its reason, and the retention category that keeps
#                 it when one applies.
#
# A table reached by more than one path keeps one grain; each other path is an `also_reached`
# entry with what follows it (an edge is reached by its home, and by each of its endpoints).
#
# Every place this file names a mechanism, it says whether the mechanism exists
# (`{ bound = "<live name>" }`) or is still to be built (`{ gap = "<slice>: <what>" }`), so nothing
# reads as covered by being absent. A gap names the slice that builds it (1b, 1c, 1d, 2a, 2b, 2c,
# 3, `prereq 2a`) or the task that tracks it (`task <uuid>`).
#
# WHICH TABLES MUST HAVE A GRAIN.
# A content or identity table is a public base table with at least one column classed `content`,
# `incidental`, `derived` or `identifier` in personal-data.toml, or `scan` in sensitivity-scan.toml.
# erasure_policy_catalog_test.rs computes that set from those entries, never from a list, and fails
# on a table in it with no grain here. Three tables outside the set are grained because D3 or a
# ruling names them: kb_blobs (a per-item type), kb_content_blocks (the parent of most covered
# content) and kb_block_provenance (ruled 2026-10-11).
#
# WHAT THIS FILE DOES NOT SEE, STATED SO NOBODY INFERS COVERAGE FROM SILENCE.
#   * A gap is work not yet built. The rows behind it are in reach of no erasure until its slice
#     lands; the gap says so, and the catalog test only checks that it names its slice.
#   * The catalog test checks names: every table, link column, flag column and reached column
#     exists, and every bound function exists. It does not check that a bound function does what the entry says, or
#     that a discriminator value in a `via` (kb_remote_sources) matches the live vocabulary.
#   * A covered parent need not be grained itself. kb_block_revisions and kb_blob_uploads carry no
#     content of their own; the note on the child names the rest of the path.
#   * The value set of a polymorphic pair's CHECK is not compared with the paths declared here.
#     Every value admitted today has an entry (a parent or an `also_reached`), but a value a later
#     migration adds to a CHECK is not caught by this file's test.
#
# FORMAT (TOML; `#` comments and blank lines ignored)
#   scope = [ { rule = "<the set, in words>", mechanism = { bound = "…" } | { gap = "…" } }, … ]
#
#   [tables.<table>]
#   note = "<note>"                                                             (optional)
#   [tables.<table>.grain]
#   kind = "per-item" | "covered" | "identity" | "declared-out"
#     per-item:     container = true|false, fence = <mechanism>, unit = <mechanism>,
#                   home = { table, table_column, id_column }                   (a leaf only)
#     covered:      parent = <path>, unit = <mechanism>                         (unit optional)
#     identity:     mechanism = <mechanism>
#     declared-out: reason = "<why>", retention = "<category>"                  (retention optional)
#   [[tables.<table>.also_reached]]                                             (optional, repeated)
#   path = <path>
#   mechanism = <mechanism>
#   column = "<column>"        (optional: the one column of the row the mechanism is for; absent,
#                               the whole row)
#
#   <path>       { table = "<table reached>", link = { fk = "<column>" }
#                                                  | { pair = { table_column, id_column } },
#                  via = "<how a reverse citation is read>" }                   (via optional)
#   A path's link columns are on the row's own table; with `via`, on the path's `table`, the
#   table whose rows cite this one. A bound fence names a flag column on the grained table; every
#   other bound mechanism names a function.

scope = [
  { rule = "the subject's own (@me) contexts", mechanism = { bound = "_erasure_estate_contexts" } },
  { rule = "the subject's personal team's contexts (kb_teams.personal_of)", mechanism = { bound = "_erasure_estate_contexts" } },
  { rule = "cogmaps whose only kb_team_cogmaps row is the personal team (R15)", mechanism = { gap = { task = "01a12dcf-2ef5-729d-b6ef-051fdee3ef8c", what = "cogmaps whose only kb_team_cogmaps row is the personal team" } } },
]

[tables]

# ── per-item ─────────────────────────────────────────────────────────────────────────────────────

[tables.kb_resources]
note = "a leaf, homed through kb_resource_homes. The unit runs resource erasure's D2 steps on one resource (title and origin_uri at D2.9)"

[tables.kb_resources.grain]
kind = "per-item"
container = false
fence = { bound = "is_active" }
unit = { bound = "resource_erasure_execute" }
home = { table = "kb_resource_homes", table_column = "anchor_table", id_column = "anchor_id" }

[tables.kb_contexts]
note = "a container, reached by the scope rules"

[tables.kb_contexts.grain]
kind = "per-item"
container = true
fence = { bound = "is_active" }
unit = { gap = { task = "01a12dcf-2ef5-729d-b6ef-051fdee3ef8c", what = "the unit that erases one context of the estate" } }

[tables.kb_cogmaps]
note = "a container, reached by the R15 scope rule (itself a gap). The fence is D2's new flag, mirroring context retirement. The unit waits on map-grain (charter) erasure, which resource_erasure_execute refuses today"

[tables.kb_cogmaps.grain]
kind = "per-item"
container = true
fence = { gap = { task = "01a12dcf-1a90-741c-9ea1-64a1dd44aefc", what = "a liveness flag on kb_cogmaps that fences a declared cogmap" } }
unit = { gap = { task = "01a0e960-0ca2-7f42-b33e-1ed19b024e6b", what = "erasure of a cogmap and its charter" } }

[tables.kb_blobs]
note = "a leaf, homed by its own pair (kb_blobs_home_context_only admits kb_contexts alone). Blob gates will consult the map (D2); no flag binds it"

[tables.kb_blobs.grain]
kind = "per-item"
container = false
fence = { gap = { task = "01a12dcf-24ab-705d-809a-35e3a2f9c169", what = "a fence that makes a declared blob unreachable" } }
unit = { bound = "blob_delete" }
home = { table = "kb_blobs", table_column = "home_table", id_column = "home_id" }

[tables.kb_edges]
note = "homed in the estate: folded at declaration, the label redacted by the unit. Also reached by each endpoint: resource erasure nulls the label on every edge with the resource at either end (step 9c) and replaces its edge-owned properties (step 9d); an edge with an estate blob at either end is P4 (ruled 2026-10-11). kb_edges_source_table_check and kb_edges_target_table_check also admit kb_cogmaps: an edge with an estate cogmap at either end waits on charter erasure (the kb_cogmaps also_reached entries)"

[tables.kb_edges.grain]
kind = "per-item"
container = false
fence = { bound = "is_folded" }
unit = { gap = { task = "01a12dcf-2ef5-729d-b6ef-051fdee3ef8c", what = "redaction of the label of an edge homed in the estate" } }
home = { table = "kb_edges", table_column = "home_anchor_table", id_column = "home_anchor_id" }

[[tables.kb_edges.also_reached]]
path = { table = "kb_resources", link = { pair = { table_column = "source_table", id_column = "source_id" } } }
mechanism = { bound = "resource_erasure_execute" }

[[tables.kb_edges.also_reached]]
path = { table = "kb_resources", link = { pair = { table_column = "target_table", id_column = "target_id" } } }
mechanism = { bound = "resource_erasure_execute" }

[[tables.kb_edges.also_reached]]
path = { table = "kb_blobs", link = { pair = { table_column = "source_table", id_column = "source_id" } } }
mechanism = { gap = { task = "01a12fcb-69cf-7051-a078-6af3a5e91905", what = "labels of edges whose source or target is an estate blob" } }

[[tables.kb_edges.also_reached]]
path = { table = "kb_blobs", link = { pair = { table_column = "target_table", id_column = "target_id" } } }
mechanism = { gap = { task = "01a12fcb-69cf-7051-a078-6af3a5e91905", what = "labels of edges whose source or target is an estate blob" } }

[[tables.kb_edges.also_reached]]
path = { table = "kb_cogmaps", link = { pair = { table_column = "source_table", id_column = "source_id" } } }
mechanism = { gap = { task = "01a0e960-0ca2-7f42-b33e-1ed19b024e6b", what = "edges whose source or target is an estate cogmap" } }

[[tables.kb_edges.also_reached]]
path = { table = "kb_cogmaps", link = { pair = { table_column = "target_table", id_column = "target_id" } } }
mechanism = { gap = { task = "01a0e960-0ca2-7f42-b33e-1ed19b024e6b", what = "edges whose source or target is an estate cogmap" } }

