# The sensitivity scan surface: the declared COMPLEMENT of the personal-data surface. Sibling of
# personal-data.toml.
#
# WHY THIS FILE EXISTS.
#
# personal-data.toml is built from STRUCTURE: foreign keys, polymorphic pairs, principal
# tables, vector/jsonb/bytea types, and a name heuristic. The `text` / `character varying` columns
# those derivations do not nominate include the whole authored corpus (kb_block_content.content,
# kb_chunk_content.content), because `text` is the type of everything and structure cannot tell
# prose from a hash.
#
# This file declares each of those columns, and the partition is a checked invariant. Every
# text/varchar column of a public base table appears in EXACTLY ONE of the two manifests:
#
#   * nominated by a personal-data derivation  -> declared in personal-data.toml
#   * nominated by nothing                     -> declared here
#
# sensitivity_scan_surface_test.rs asserts the partition: the union is total, the intersection is
# empty, and an entry here naming a column that is not a live text/varchar column fails.
#
# METHOD. The column set is every column of information_schema.columns with data_type in
# ('text','character varying') whose table is a BASE TABLE in schema `public`, as migrated by
# temper_services::MIGRATOR (so `_sqlx_migrations` is included). The complement is that set minus
# every `table.column` declared in personal-data.toml.
#
# COUNT at `count_at`: 176 text/varchar columns; 18 declared in the sibling; `declared_count` declared here.
count_at = "20261108000000"
declared_count = 158
#
# THERE IS NO `unadjudicated` CLASS. A class that means "we will decide later" is how a manifest
# starts accumulating lines nobody reads. A new column is declared by the PR that adds it.
#
# FORMAT (TOML; `#` comments and blank lines ignored)
#   count_at = "<migration>"      the migration the COUNT above was taken at
#   declared_count = <n>          how many columns [columns] declares
#   [columns]
#   "<table>.<column>" = { disposition = "<disposition>", note = "<note>" }
#
#   One inline table per column, so a column declared twice fails the TOML parse itself. `note`
#   may be left out, and then reads as empty.
#
# disposition
#   scan          authored or user-supplied free text; the sweep reads it
#   structural    hash, enum, discriminator, surrogate, vocabulary, or a value derived from one
#   credential    secret material by design (hashed, or a short-lived plaintext value a flow reads
#                 back); not a PII surface, and a sweep must never echo it
#   out-of-scope  anything else, with the reason in the note (a note is REQUIRED for this class)
#
# Remediability is not a column here. It comes from the sibling's `ceiling` for the surfaces the
# sweep reads through that file, and from the erasure act for the surfaces declared `scan` here.

[columns]

