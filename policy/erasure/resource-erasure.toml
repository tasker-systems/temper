# The resource-erasure surface: what the act does with every carrier a resource reaches.
#
# Under goal "A single resource can be erased out of a live estate" (spec: temper-artifacts
# specs/2026-09-28-resource-erasure-design.md, D9). Sibling of personal-data.toml and
# sensitivity-scan.toml.
#
# WHY THIS FILE EXISTS.
#
# The erasure act (`_resource_erasure_apply_redaction`, D2) names the columns it empties by hand. The
# first draft of that list missed `kb_chunks.header_path` and `kb_citation_audits.reason`: both were
# prose, both were reachable from the resource, and nothing said so until a joint read with the
# sensitivity sweep. This file is where that question is answered for every such column, and
# resource_erasure_surface_test.rs fails until it is.
#
# THE INVARIANT. Every CARRIER in a table a resource reaches has a line here: handled by a numbered
# D2 step, or out-of-scope with its reason. A carrier is (ruled 2026-10-02):
#
#   * a column sensitivity-scan.toml classes `scan` (authored text), or
#   * a column personal-data.toml classes `content`, `incidental` or `derived` (jsonb, bytea,
#     vector and search-index columns that hold or are computed from what someone wrote).
#
# NOTHING HERE DECIDES WHAT A COLUMN HOLDS. Those two manifests are the definitions; this file only
# says what the act does about the columns they mark. A third classification would drift.
#
# NOTHING HERE LISTS TABLES. Reach is derived from the live catalog by the test (ruled 2026-10-02,
# amended 2026-10-03):
#
#   roots  kb_resources, kb_content_blocks, kb_chunks, kb_block_revisions, kb_edges.
#   edges  a foreign key makes its table a child of the table it references. A single-column CHECK
#          on a `*_table` discriminator makes its table a child of each table it names: a
#          polymorphic reference, which carries no foreign key.
#   walk   every child of a reached table, recursively, the ledger included. A table reached only
#          through a foreign key into kb_events is reached all the same: that is how
#          kb_contexts.telos_centroid, which is computed from a context's goal resources, comes into
#          view. Its lines say when the event key is the only path.
#
# Every base-table `*_table` column must carry a CHECK that enumerates the tables it may name
# (`col IN ('kb_a', 'kb_b')` or `col = 'kb_a'`), or the test fails: a discriminator the walk cannot
# read could point at a resource unseen.
#
# STEP NUMBERS are the spec's D2 numbering (1–9, 7a). The function's own section labels count
# differently; read the spec, not the comment, to check a line.
#
# WHAT THIS FENCE DOES NOT SEE, STATED SO NOBODY INFERS COVERAGE FROM SILENCE.
#   * Rows. A line is checked at column grain: the D2 function has a statement that writes the column
#     with an erasure value (a constant, or an 'erased…' literal joined to an id). Which rows that
#     statement reaches is the act's own witnesses' job. Where a handled column keeps rows tied to R
#     that the act leaves, the line's note says so. The check reads statements, not control flow:
#     an UPDATE under a branch never taken, after a RETURN, or with a WHERE that matches nothing
#     still binds. The one such RETURN today is the block-set form: called with p_blocks (the block
#     history scrub, its only caller) the function returns after step 3, so every line here past
#     step 3 binds while the scrub reaches none of them.
#   * Derivation without reference. A vector computed from R's content is tied to R by no key: a
#     region's centroid (a mean over its members) and a context's telos_centroid (a mean over its
#     goals). The walk reaches both tables by other paths, so both have lines, but nothing structural
#     would find the next such aggregate. Both are handled by step 6.
#   * References with neither a foreign key nor a CHECKed `*_table` discriminator:
#     - kb_remote_sources, referenced by kb_block_provenance through (source_kind, source_id). Its
#       `uri` is declared below because D2 step 9 does reach it; the test binds that line to the
#       function body instead of to the walk.
#     - discriminators spelled `*_kind` (kb_block_provenance.source_kind,
#       kb_citation_audits.source_kind). Both tables are reached through block_id.
#     - bare uuid references: kb_idempotency_keys.resource_id, and kb_cogmap_components.member_ids
#       (a uuid[] of members). Neither holds a carrier today.
#   * Columns neither sibling manifest classes as a carrier: an `identifier` or `reference`, a
#     `structural` text column, and any type both manifests leave out (text[], json, enums).
#   * Schemas other than `public`. sensitivity.findings points at resources (target_table,
#     target_id, resource_id) without a key. It holds no authored text. Every digest the sweep
#     stores is keyed by a salt that never enters the database: a finding's match fingerprints
#     (sweep D11) and content_hash, the memo's hash of each unit a detector found nothing in, and
#     place_observations' last hash of a mutable place. For a place the act reached (and one the
#     block history scrub or the principal act emptied), the sweep drops the finding's digests and
#     the memo rows carrying its hash 30 days after it first sees the finding closed (migration
#     20261004000010). Every memo row goes 30 days after it was written, and every observation of
#     an erased resource on the next expiry call, and no hash column keeps planner statistics
#     (migration 20261007000010). The category, detector and match count, which say what kind of
#     data R held, stay as the record of what was found. The act itself never names the schema.
#
# FORMAT (TOML; `#` comments and blank lines ignored)
#   [tables]                                  this table; [payload], D9's payload half, is below
#   "<table>.<column>" = { disposition = "<disposition>", note = "<note>" }
#
#   One inline table per column, so a column declared twice fails the TOML parse itself. `note`
#   may be left out, and then reads as empty.
#
# disposition
#   handled:D2.<step>     the D2 step that empties or sentinels the column. The test checks that the
#                         live `_resource_erasure_apply_redaction` assigns it, in an UPDATE of its
#                         table, an erasure value: NULL, '', '{}' or '"erased"' (optionally cast), or
#                         an 'erased…' literal joined by || to an id.
#   repointed:D2.<step>:<table>.<column>
#                         the rows citing it are re-pointed, through the named column, to a sentinel
#                         row, and the original is deleted when nothing else cites it. The test checks
#                         for a re-point that assigns something other than the column's own value, and
#                         for the DELETE: statements, not the rows they reach.
#   out-of-scope          the act deliberately leaves it; the reason in the note is REQUIRED.

[tables]

# ── handled: the content shape (D2) ─────────────────────────────────────────────────────────
"kb_chunk_content.content"                = { disposition = "handled", note = "every chunk of the resource, current and superseded, emptied to ''" }
"kb_chunks.header_path"                   = { disposition = "handled", note = "joint-read fix: the heading trail is authored prose" }
"kb_block_content.content"                = { disposition = "handled", note = "every revision of every block, live and folded" }
"kb_chunks.embedding"                     = { disposition = "handled", note = "nulled with embedded_with, together. Vectors computed FROM it (region centroids, a context's telos) are separate lines below" }
"kb_resource_search_index.search_vector"  = { disposition = "handled", note = "emptied to ''" }
"kb_data_artifact_content.content"        = { disposition = "handled", note = "every artifact of the resource, whatever its kind owner, intent or fold state" }
"kb_workflow_jobs.payload"                = { disposition = "handled", note = "jobs whose resource_id is R, in every status. Context-, cogmap- and system-scoped jobs are left (see last_error)" }
"kb_workflow_jobs.last_error"             = { disposition = "handled", note = "jobs whose resource_id is R, in every status. Context-, cogmap- and system-scoped jobs whose error text quotes R are left" }
"kb_ingestion_records.source_uri"         = { disposition = "handled", note = "the origin_uri class sentinel 'erased:<resource_id>'" }
"kb_data_artifact_verdicts.detail"        = { disposition = "handled", note = "every verdict on an artifact of the resource" }
"kb_data_artifacts.artifact_kind"         = { disposition = "handled", note = "D4 artifact family: 'erased:<asserted_by_event_id>', every artifact of the resource whatever its intent or fold state; husks erased before (9f) existed got it once (20261008100000)" }
"kb_citation_audits.reason"               = { disposition = "handled", note = "joint-read fix: audits whose block is R's. Audits by other findings that cite R are left, and named in the remainder only when their payload carries R's id" }

# ── handled: projection-side sentinels (D2 step 9, D4 classes) ──────────────────────────────
"kb_resources.title"                      = { disposition = "handled", note = "D4 title: 'erased-<resource_id>'" }
"kb_resources.origin_uri"                 = { disposition = "handled", note = "D4 origin_uri: 'erased:<resource_id>'" }
"kb_properties.property_key"              = { disposition = "handled", note = "D4 'erased-key-<n>', for properties of R, of every edge touching it, and of every block of R (step 9d′)" }
"kb_properties.property_value"            = { disposition = "handled", note = "D4 '\"erased\"', on the same rows as property_key" }
"kb_edges.label"                          = { disposition = "handled", note = "D4 edge label: NULL, on every edge touching the resource" }
"kb_remote_sources.uri"                   = { disposition = "repointed:kb_block_provenance.source_id", note = "outside the walk (see header). The original row is deleted only when nothing else cites it; a URL another resource still cites stays, named by id in the remainder (D8)" }

# ── out of scope: the ledger (cut 2) ────────────────────────────────────────────────────────
"kb_events.payload"                       = { disposition = "out-of-scope", note = "the ledger, not this section's: the act rewrites the free text of R's own trail events path by path (cut 2, 20261009100000), declared under [payload] below, and this section's binding cannot see a payload rewrite. Events outside R's trail that quote R are not named" }
"kb_events.metadata"                      = { disposition = "out-of-scope", note = "the ledger, not this section's: authorship reasoning, rationale, persona and model on R's trail events are rewritten to the authorship sentinel (cut 2), declared by [payload]'s metadata: lines; the fence walks AgentAuthorship's schema" }

# ── derived vectors ──────────────────────────────────────────────────────────────────────────
"kb_cogmap_regions.centroid"              = { disposition = "handled", note = "a FOLDED region holding R as a member is zeroed (never recomputed; R's vector was recoverable from it). A LIVE region holding R is recomputed over the survivors by _resource_erasure_recompute_live_centroids, which the body PERFORMs: a recompute is not an erasure constant, so this fence does not bind it; the act's witnesses do. The re-form the service queues after commit then folds a clean row; a materialize already in flight at the act, which loaded R live, is followed by the region drain's erased-member gate (region_clocks::tick), which re-forms the anchor's default-lens regions (ruled 2026-10-04). Every materialize recomputes, under its anchor lock and before it folds, the live regions of its lens that list an erased resource (_region_recompute_erased_member_centroids, ruled 2026-10-08)" }
"kb_contexts.telos_centroid"              = { disposition = "handled", note = "R's home context's snapshot nulled beside its watermark, whatever R's doc type; the drain's materialize re-arms it from the live telos, which already excludes R. The copies in region_materialized / salience_refreshed payloads are named in ledger_remainder when R is a goal: the ledger exception does not reach them, so they are a permanent remainder (ruled 2026-10-04)" }
"kb_cogmaps.telos_centroid"               = { disposition = "out-of-scope", note = "derived from the charter's content, so R-derived only when R is the charter, which the act refuses (D5). The map-grain task owns it" }

# ── out of scope: the map's text ────────────────────────────────────────────────────────────
"kb_cogmaps.name"                         = { disposition = "out-of-scope", note = "reached through kb_cogmaps.telos_resource_id. The act refuses a charter resource (D5); map-grain charter erasure is its own filed task" }
"kb_cogmap_lenses.name"                   = { disposition = "out-of-scope", note = "reached through kb_cogmaps: the map author's name for a lens" }
"kb_cogmap_regions.label"                 = { disposition = "out-of-scope", note = "reached through kb_cogmaps; also tied to R when R is a member. An optional agent-written label that may summarize its members, R included, and a folded region keeps it. Left as the map's text by judgement, not because it cannot carry R" }
"kb_invocations.outcome"                  = { disposition = "out-of-scope", note = "reached incidentally, through its cogmap and its telos (a charter, refused by D5). An invocation over a map where R is only a region member is NOT refused, and its outcome may quote R. Its ledger copy, invocation_closed.outcome, is named in the remainder only when its payload carries R's id" }

# ── out of scope: deliveries ────────────────────────────────────────────────────────────────
"kb_subscription_deliveries.rationale"    = { disposition = "out-of-scope", note = "another principal's judgment of a webhook, never redacted across the resource boundary (Q1). A delivery whose webhook body, rationale or scope_reason quotes R's id is named in the remainder by delivery id (D8)" }
"kb_subscription_deliveries.scope_reason" = { disposition = "out-of-scope", note = "a caller's reason for a scope verdict, off the ledger. Listed only, on the same remainder line as rationale (D8)" }

# ── out of scope: containers and connections, reached only through an event key ────────────
"kb_contexts.name"                        = { disposition = "out-of-scope", note = "reached only through an event key (shape_materialized_event_id). The name of R's home, chosen by its owner; not R's text" }
"kb_connections.reach_affirmation"        = { disposition = "out-of-scope", note = "reached only through an event key, via kb_contexts. An operator's rationale for a connection's reach: configuration, not resource content" }
"kb_connections.credential"               = { disposition = "out-of-scope", note = "reached only through an event key, via kb_contexts. Connection secret material: configuration, not resource content" }
"kb_connections.observed_reach"           = { disposition = "out-of-scope", note = "reached only through an event key, via kb_contexts. What the connection's credential could see: configuration, not resource content" }

# ── out of scope: blobs ─────────────────────────────────────────────────────────────────────
"kb_data_artifact_shapes.artifact_kind"   = { disposition = "out-of-scope", note = "the home's declaration of a family, not the resource's instance; the exception never crosses the resource boundary (Q1). The remainder names, by shape id, a shape in force in R's home for a family R's artifacts used" }
"kb_blob_upload_segments.bytes"           = { disposition = "out-of-scope", note = "staged upload bytes, reached through a cogmap-homed upload. Blobs are homed in a context or cogmap, not the resource; the act strikes a blob only when the operator lists it (D8)" }

# ═════════════════════════════════════════════════════════════════════════════════════════════
# [payload] — D9's payload half: what the act does with every free-text path on the ledger.
#
# Cut 2 is live (20261009100000): the act rewrites every `redact` path of R's own trail events to
# its class sentinel and records the paths in `redacted_fields`; a husk erased under cut 1 is brought
# up by the completion pass (20261010100000). The verifier's allowlist, _erasure_redact_paths(), is
# held equal to the `redact` lines, so a path the verifier admits is a reviewed line here.
#
# WHAT IS NOMINATED. resource_erasure_surface_test walks, for every registered event type, both its
# committed schema snapshot (temper-substrate tests/fixtures/payloads) and its registered
# payload_schema (kb_event_types), and nominates each path that holds a string or an open value;
# the `metadata` tables are walked the same way from AgentAuthorship's snapshot
# (tests/fixtures/metadata). Arrays read as
# `*`, a map's keys as `?`. Three kinds of string are classed by the walk itself and never appear
# here: a `format: uuid` or `format: date-time` string (an id or a time), and a string confined by
# `enum` or `const` (vocabulary). A number or boolean is never nominated.
#
# PERMISSIVE TYPES. A type registered with no payload_schema cannot be walked. Each has a
# `"*" = { disposition = "permissive", ... }` entry under its `[payload."<type>"]` table, and its string paths are declared by hand beside it (ids
# and vocabulary left out, as the walk would leave them). The test checks that every schema-less
# type has that entry and that no walked type does; it cannot check a hand list is complete, so the
# note says where the list came from.
#
# FORMAT
#   [payload."<event_type>"]               one table per event type; `metadata` holds the
#                                          authorship keys, on any event
#   "<path>" = { disposition = "<disposition>", note = "<note>" }
#   "*" = { disposition = "permissive", note = "<note>" }        (a schema-less type)
#
# A path is a JSON pointer from the payload's root. A refinement narrows a path by its own
# event's fields, and sits under the path it refines, so it cannot refine a path that is not
# declared:
#
#   [payload."<event_type>"."<path>"]
#   disposition = "<disposition>"
#   note = "<note>"
#   refine = [
#     { where = { key = "doc_type", owner = "kb_resources" }, disposition = "<disposition>", note = "<note>" },
#   ]
#
# `where` matches a property event of that key and owner table; it names `key`, `owner` or both.
# The most specific line wins.
#
# disposition
#   redact:<class>   the act rewrites it to the D4 sentinel of <class> and records it in
#                    redacted_fields.
#                    Classes: title, origin-uri, remote-source-url, property-key, property-value,
#                    facet-value, doc-type, artifact-family, edge-label, reason, scar, authorship.
#   structural       a hash, a vocabulary word or a record's own fixed text; kept (F3)
#   out-of-scope     not R's text, or not reachable by D3's exception; the reason is REQUIRED
# ═════════════════════════════════════════════════════════════════════════════════════════════

[payload]

# ── the resource and its blocks ─────────────────────────────────────────────────────────────
[payload."resource_created"]
"/title"                                = { disposition = "redact:title", note = "F3; the commonest PII carrier" }
"/origin_uri"                           = { disposition = "redact:origin-uri", note = "F3; a local path names its user" }
"/doc_type"                             = { disposition = "redact:doc-type", note = "free text, F3 corrected 2026-10-03; the literal key doc_type is kept on property events" }
"/blocks/*/incorporated/*/source/value" = { disposition = "redact:remote-source-url", note = "a remote source's URL; resource and event sources are uuids" }
"/blocks/*/role"                        = { disposition = "structural", note = "F3: a block's role is structural on the ledger (ruled 2026-10-07; step 9d′ erases its projected row)" }
"/blocks/*/chunks/*/content_hash"       = { disposition = "structural", note = "a hash" }

[payload."resource_updated"]
"*"           = { disposition = "permissive", note = "fields from payloads.rs ResourceUpdated" }
"/title"      = { disposition = "redact:title", note = "F3" }
"/origin_uri" = { disposition = "redact:origin-uri", note = "F3" }

[payload."resource_finalized"]
"*"                      = { disposition = "permissive", note = "fields from payloads.rs ResourceFinalized" }
"/expected_body_hash"    = { disposition = "structural", note = "a hash" }
"/expected_content_hash" = { disposition = "structural", note = "a hash" }

[payload."resource_deleted"]
"*" = { disposition = "permissive", note = "ResourceDeleted carries only resource_id" }

[payload."resource_reassigned"]
"*" = { disposition = "permissive", note = "ResourceReassigned carries only ids" }

[payload."resource_rehomed"]
"*"           = { disposition = "permissive", note = "fields from payloads.rs ResourceRehomed" }
"/home/table" = { disposition = "structural", note = "an anchor table name" }

[payload."block_created"]
"/block/incorporated/*/source/value" = { disposition = "redact:remote-source-url", note = "a remote source's URL" }
"/block/role"                        = { disposition = "structural", note = "F3, as resource_created's" }
"/block/chunks/*/content_hash"       = { disposition = "structural", note = "a hash" }

[payload."block_mutated"]
"/incorporated/*/source/value" = { disposition = "redact:remote-source-url", note = "a remote source's URL" }
"/chunks/*/content_hash"       = { disposition = "structural", note = "a hash" }

[payload."block_folded"]
"/reason" = { disposition = "redact:reason", note = "F3" }

[payload."block_provenance_annotated"]
"*"                            = { disposition = "permissive", note = "fields from payloads.rs BlockProvenanceAnnotated; production shapes checked 2026-10-08" }
"/incorporated/*/source/kind"  = { disposition = "structural", note = "provenance kind vocabulary" }
"/incorporated/*/source/value" = { disposition = "redact:remote-source-url", note = "a remote source's URL" }

[payload."block_provenance_corrected"]
"/scar"         = { disposition = "redact:scar", note = "F3" }
"/source/value" = { disposition = "redact:remote-source-url", note = "a remote source's URL" }

[payload."resource_reblocked"]
"/created/*/attribution/*/source/value" = { disposition = "redact:remote-source-url", note = "carried forward with its original seq (D4)" }
"/kept/*/attribution/*/source/value"    = { disposition = "redact:remote-source-url", note = "carried forward with its original seq (D4)" }
"/created/*/chunks/*/content_hash"      = { disposition = "structural", note = "a hash" }

[payload."citation_audited"]
"*"             = { disposition = "permissive", note = "fields from payloads.rs CitationAudited; production shapes checked 2026-10-08" }
"/reason"       = { disposition = "redact:reason", note = "the auditor's free text" }
"/source/kind"  = { disposition = "structural", note = "provenance kind vocabulary" }
"/source/value" = { disposition = "structural", note = "the cited resource's id: citation_audit refuses every kind but resource (20260724000110), and the projector casts it to uuid" }

[payload."data_artifact_committed"]
"/artifact_kind" = { disposition = "redact:artifact-family", note = "free text, F3 corrected 2026-10-03; step 9f writes the same sentinel to the projection" }
"/content_hash"  = { disposition = "structural", note = "a hash" }

# ── properties: the key decides the class (D3, D4) ──────────────────────────────────────────
[payload."property_set"]
"*"            = { disposition = "permissive", note = "fields from payloads.rs PropertySet; production shapes checked 2026-10-08" }
"/owner/table" = { disposition = "structural", note = "an anchor table name" }

[payload."property_set"."/property_key"]
disposition = "redact:property-key"
note = "erased-key-<n>, the n of the row it asserted"
refine = [
  { where = { key = "doc_type", owner = "kb_resources" }, disposition = "structural", note = "the literal key stays, so R's doc_type family stays one key (ruled 2026-10-03)" },
  { where = { key = "facet" }, disposition = "structural", note = "the literal key stays (ruled 2026-10-03)" },
]

[payload."property_set"."/value"]
disposition = "redact:property-value"
note = "erased:<event_id>"
refine = [
  { where = { key = "doc_type", owner = "kb_resources" }, disposition = "redact:doc-type", note = "erased:<event_id>" },
  { where = { key = "facet" }, disposition = "redact:facet-value", note = "one erased-facet-<m> per original mark" },
]

[payload."property_asserted"."/property_key"]
disposition = "redact:property-key"
note = "as property_set's"
refine = [
  { where = { key = "doc_type", owner = "kb_resources" }, disposition = "structural", note = "as property_set's" },
  { where = { key = "facet" }, disposition = "structural", note = "as property_set's" },
]

[payload."property_asserted"."/value"]
disposition = "redact:property-value"
note = "as property_set's"
refine = [
  { where = { key = "doc_type", owner = "kb_resources" }, disposition = "redact:doc-type", note = "as property_set's" },
  { where = { key = "facet" }, disposition = "redact:facet-value", note = "as property_set's" },
]

[payload."property_unset"]
"*"            = { disposition = "permissive", note = "fields from payloads.rs PropertyUnset; production shapes checked 2026-10-08" }
"/owner/table" = { disposition = "structural", note = "an anchor table name" }

[payload."property_unset"."/property_key"]
disposition = "redact:property-key"
note = "the n of a sibling assertion, or above the asserted range when only ever unset (D4)"
refine = [
  { where = { key = "doc_type", owner = "kb_resources" }, disposition = "structural", note = "as property_set's" },
  { where = { key = "facet" }, disposition = "structural", note = "as property_set's" },
]

[payload."property_retracted"]
"*"            = { disposition = "permissive", note = "fields from payloads.rs PropertyRetracted" }
"/owner/table" = { disposition = "structural", note = "an anchor table name" }

[payload."property_folded"]
"*" = { disposition = "permissive", note = "registered with no write path (canonical_seed); nothing emits one" }

[payload."property_reweighted"]
"*" = { disposition = "permissive", note = "registered with no write path (canonical_seed); nothing emits one" }

# ── edges ───────────────────────────────────────────────────────────────────────────────────
[payload."relationship_asserted"]
"/label" = { disposition = "redact:edge-label", note = "erased-label-<n>, numbered per resource by first assertion; a label is part of an edge's identity (ruled 2026-10-08)" }

[payload."relationship_folded"]
"/reason" = { disposition = "redact:reason", note = "D4: JSON null" }

[payload."relationship_corrected"]
"/scar" = { disposition = "redact:scar", note = "D4: \"erased\"" }

[payload."relationship_retracted"]
"*" = { disposition = "permissive", note = "registered with no write path (canonical_seed); nothing emits one" }

# ── authorship, on any event ────────────────────────────────────────────────────────────────
[payload."metadata"]
"/reasoning" = { disposition = "redact:authorship", note = "D4: \"erased\"" }
"/rationale" = { disposition = "redact:authorship", note = "D4: \"erased\"" }
"/persona"   = { disposition = "redact:authorship", note = "D4: \"erased\"; caller-supplied, up to 256 bytes" }
"/model"     = { disposition = "redact:authorship", note = "D4: \"erased\"; caller-supplied, up to 256 bytes" }

# ── records: an act's own record, written from fixed strings and ids ────────────────────────
[payload."resource_erased"]
